industries:
  - id: smart_building_pack
    name: Smart-Building Pack (BMS)
    description: >-
      Building automation starter kit with MQTT/LwM2M sensors, Modbus HVAC controllers
      and weather services for immediate BMS demos.
    protocols: [mqtt, lwm2m, coap, http, modbus, opcua, knx, matter, bacnet]
    services: [mqtt_broker, lwm2m_server, modbus_tcp_gateway, http_gateway, knx_gateway, homeassistant_bridge, matter_server, opcua_server, bacnet_gateway]
    profiles:
      - profiles/smart_building_pack/bms_quickstart.yaml
    default_instances:
      - model: Env.EnvSensor.Mqtt
        instance: spx_env_sensor_mqtt
      - model: Env.EnvSensor.Lwm2m
        instance: spx_env_sensor_lwm2m
      - model: Process.ThermalController.Modbus
        instance: spx_hvac_controller
      - model: Building.HvacFlexitNordic.Bacnet
        instance: spx_hvac_flexit_nordic_bacnet
      - model: Energy.EnergyMeterIem3000.Modbus
        instance: spx_energy_meter_iem3000_modbus
      - model: Energy.UpsEasy3M.Modbus
        instance: spx_easy_ups_3m_modbus
      - model: Energy.EnergyMeterPm3200.Modbus
        instance: spx_energy_meter_pm3200_modbus
      - model: Energy.EnergyMeterPm5330.Modbus
        instance: spx_energy_meter_pm5330_modbus
      - model: Energy.EnergyMeterPm8000.Modbus
        instance: spx_energy_meter_pm8000_modbus
      - model: Energy.EnergyMeterAbbD13_15.Modbus
        instance: spx_energy_meter_abb_d13_15_modbus
      - model: Energy.EnergyMeterEm4200.Modbus
        instance: spx_energy_meter_em4200_modbus
      - model: Energy.EnergyMeterPac3200.Modbus
        instance: spx_energy_meter_pac3200_modbus
      - model: Energy.RackPdu.ApcNetShelter2g.Modbus
        instance: spx_apc_rack_pdu_2g_modbus
      - model: Energy.EnergyMeterDirisA40.Modbus
        instance: spx_energy_meter_diris_a40_modbus
      - model: Energy.EnergyMeterCarloGavazziEm24.Modbus
        instance: spx_energy_meter_em24_modbus
      - model: Energy.EnergyMeterEastronSdm630.Modbus
        instance: spx_energy_meter_sdm630_modbus
      - model: Energy.EnergyMeterEatonPxm2000.Modbus
        instance: spx_energy_meter_pxm2000_modbus

      - model: Weather.WeatherFeed.Http
        instance: spx_weather_feed
      - model: Weather.WeatherGateway.WagoPfc200.VaisalaWxt530.Mqtt
        instance: spx_weather_gateway_wago_pfc200_vaisala_wxt530_mqtt
      - model: Env.AirQualityStation.Http
        instance: spx_air_quality_feed
      - model: Building.BMSController.OpcUa
        instance: spx_bms_controller_opcua
      - model: Building.LightingPanel.OpcUa
        instance: spx_lighting_panel_opcua
      - model: Building.RoomController.Knx
        instance: spx_room_controller_knx
      - model: Building.LightingZone.Knx
        instance: spx_lighting_zone_knx
      - model: Building.SwitchActuator.AbbSaS12_16_5_1.Knx
        instance: spx_abb_sa_s12_16_5_1_knx
      - model: Building.CoverActuator.AbbJraS4_230_5_1.Knx
        instance: spx_abb_jra_s4_230_5_1_knx
      - model: Building.FireAlarmPanel.Bacnet
        instance: spx_fire_alarm_panel_bacnet
      - model: Building.SecurityAccessController.Bacnet
        instance: spx_security_access_controller_bacnet
    start_instances:
      - spx_hvac_flexit_nordic_bacnet
      - spx_energy_meter_iem3000_modbus
      - spx_weather_gateway_wago_pfc200_vaisala_wxt530_mqtt
      - spx_abb_sa_s12_16_5_1_knx
      - spx_abb_jra_s4_230_5_1_knx
    path: library/industries/smart_building_pack
  - id: energy_pack
    name: Energy Pack (e-Mobility & DER)
    description: >-
      Energy-native e-mobility and DER scaffold with OCPP 1.6 EVSE/CSMS twins,
      Modbus EVSEs, and power-meter telemetry while SunSpec device models land.
    protocols: [mqtt, modbus, ocpp]
    services: [mqtt_broker, modbus_tcp_gateway, ocpp_central_system]
    profiles:
      - profiles/energy_pack/ev_csms_demo.yaml
    default_instances:
      - model: Energy.CSMS.Ocpp
        instance: spx_csms_ocpp
      - model: Energy.EVSE.Ocpp
        instance: spx_evse_ocpp
      - model: Energy.EVSE.SiemensVersiChargeAc.Modbus
        instance: spx_evse_versicharge_ac_modbus
      - model: Energy.EnergyMeterDirisA10.Modbus
        instance: spx_energy_meter_diris_a10_modbus
      - model: Energy.EnergyMeterPm5560.Modbus
        instance: spx_energy_meter_pm5560_modbus
    path: library/industries/energy_pack
  - id: embedded_lab_pack
    name: Embedded & Lab Pack
    description: >-
      BLE, MQTT/LwM2M and SCPI devices for firmware CI and hardware-in-the-loop labs.
    protocols: [ble, mqtt, lwm2m, coap, scpi, modbus]
    services: [btvirt_adapter, mqtt_broker, lwm2m_server, scpi_tcp_stack, modbus_tcp_gateway]
    profiles:
      - profiles/embedded_lab_pack/mhealth_ci.yaml
      - profiles/embedded_lab_pack/scpi_lab.yaml
    default_instances:
      - model: Embedded.HealthMonitor.BleGatt
        instance: spx_health_monitor_ble
      - model: Embedded.TempSensor.BleGatt
        instance: spx_temp_sensor_ble
      - model: Env.EnvSensor.Mqtt
        instance: spx_env_sensor_mqtt
      - model: Env.EnvSensor.Lwm2m
        instance: spx_env_sensor_lwm2m
      - model: Lab.Multimeter.Scpi
        instance: spx_lab_multimeter
      - model: Lab.FunctionGenerator.SiglentSdg1032X.Scpi
        instance: spx_lab_function_generator
      - model: Lab.PowerSupply.KeysightE36312A.Scpi
        instance: spx_lab_power_supply
      - model: Process.VacuumGauge.Modbus
        instance: spx_vacuum_gauge
      - model: Lab.Detector.PrevacMCD7.Modbus
        instance: spx_prevac_mcd7
    start_instances:
      - spx_health_monitor_ble
      - spx_temp_sensor_ble
      - spx_env_sensor_mqtt
      - spx_lab_multimeter
      - spx_vacuum_gauge
    path: library/industries/embedded_lab_pack
  - id: industrial_iiot_pack
    name: Industrial Pack (Industry 4.0)
    description: >-
      Motion/process control and monitoring bundle mixing Modbus, MQTT and SCPI
      instrumentation for factory/QA flows.
    protocols: [modbus, mqtt, http, scpi, opcua]
    services: [modbus_tcp_gateway, mqtt_broker, http_gateway, scpi_tcp_stack, opcua_server]
    profiles:
      - profiles/industrial_iiot_pack/process_cell_quickstart.yaml
      - profiles/industrial_iiot_pack/iiot_monitoring.yaml
      - profiles/industrial_iiot_pack/modbus_master_plc_demo.yaml
    default_instances:
      - model: Motion.StepperController.Modbus
        instance: spx_stepper_axis
      - model: Process.ThermalController.Modbus
        instance: spx_process_heater
      - model: Process.ThermalController.Eurotherm3216.Modbus
        instance: spx_eurotherm_3216_temp
      - model: Process.PressureController.Eurotherm3504.Modbus
        instance: spx_eurotherm_3504_pressure
      - model: Process.VacuumGauge.Modbus
        instance: spx_vacuum_gauge
      - model: Lab.Detector.PrevacMCD7.Modbus
        instance: spx_prevac_mcd7
      - model: Env.EnvSensor.Mqtt
        instance: spx_env_sensor_mqtt
      - model: Env.AirQualityStation.Http
        instance: spx_air_quality_feed
      - model: IIoT.LineCounter.Mqtt
        instance: spx_line_counter
      - model: Energy.EnergyMeter3Ph.Mqtt
        instance: spx_energy_meter_3ph
      - model: Condition.ConditionMonitor.Mqtt
        instance: spx_condition_monitor
      - model: Lab.Multimeter.Scpi
        instance: spx_lab_multimeter
      - model: Logistics.AGVVehicle.Mqtt
        instance: spx_agv_vehicle
      - model: Quality.VisionStation.Http
        instance: spx_vision_station
      - model: Motion.VFDrive.Modbus
        instance: spx_vfd_drive
      - model: Motion.VFDrive.SiemensG120C.Modbus
        instance: spx_g120c_vfd
      - model: Motion.VFDrive.SchneiderAltivar320.Modbus
        instance: spx_altivar_320_vfd
      - model: IO.IOModule.Modbus
        instance: spx_io_module
      - model: IO.IOModule.Wago750_8000.Modbus
        instance: spx_wago_750_8000_io
      - model: Process.PIDController.Modbus
        instance: spx_pid_controller
      - model: Energy.EnergyMeter3Ph.Modbus
        instance: spx_energy_meter_3ph_modbus
      - model: Energy.PowerMeter.AbbM1M.Modbus
        instance: spx_abb_m1m_power_meter
      - model: Energy.RackPdu.ApcNetShelter2g.Modbus
        instance: spx_apc_rack_pdu_2g_modbus
      - model: Process.PressureTransmitter.Modbus
        instance: spx_pressure_transmitter
      - model: Process.ProcessCell.OpcUa
        instance: spx_process_cell_opcua
      - model: Process.ProcessCell.SiemensS7_1500.OpcUa
        instance: spx_s7_1500_process_cell
      - model: Process.Workcell.OpcUa
        instance: spx_workcell_opcua
      - model: Process.PackagingLine.OpcUa
        instance: spx_packaging_line_opcua
    start_instances:
      - spx_eurotherm_3216_temp
      - spx_eurotherm_3504_pressure
      - spx_g120c_vfd
      - spx_altivar_320_vfd
      - spx_wago_750_8000_io
      - spx_s7_1500_process_cell
    path: library/industries/industrial_iiot_pack
