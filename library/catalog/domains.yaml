    description: Actuator/drive models exposed over Modbus.
    path: library/domains/motion_controllers
  - id: thermal_controllers
    name: Thermal Controllers
    description: Heating/cooling loops with Modbus access.
    path: library/domains/thermal_controllers
  - id: vacuum_systems
    name: Vacuum Systems
    description: Vacuum gauges and process instrumentation.
    path: library/domains/vacuum_systems
  - id: measurement_instruments
    name: Measurement Instruments
    description: SCPI-grade bench instruments.
    path: library/domains/measurement_instruments
  - id: ble
    name: BLE Devices
    description: BLE GATT wearables and sensors.
    path: library/domains/ble
