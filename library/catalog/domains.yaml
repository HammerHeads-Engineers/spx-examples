domains:
  - id: iot
    name: IoT & Edge Telemetry
    description: Environmental sensors served over MQTT/LwM2M/HTTP.
    path: library/domains/iot
  - id: weather
    name: Weather & Forecasting
    description: Static/dynamic weather feeds via HTTP.
    path: library/domains/weather
  - id: energy
    name: Energy & e-Mobility
    description: EVSE/CSMS twins and DER-oriented telemetry for OCPP/SunSpec.
    path: library/domains/energy
  - id: motion_controllers
