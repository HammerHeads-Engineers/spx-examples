name: open_meteo_static
description: |
  Static Open-Meteo style forecast served over the HTTP endpoint protocol.
  Useful for validating HTTP clients against the SPX simulator without
  enabling dynamic weather actions.

meta_parameters:
  http_host:
    type: str
    default: 0.0.0.0
  http_port:
    type: int
    default: 8091

attributes:
  k__latitude: 52.2297
  k__longitude: 21.0122
  elevation_m: 100.0
  k__timezone: Europe/Warsaw
  generation_time_ms: 18.5
  forecast_horizon_hours: 48

  k__active_profile: clear

  hourly_time:
    - "2025-01-01T00:00"
    - "2025-01-01T03:00"
    - "2025-01-01T06:00"
    - "2025-01-01T09:00"
    - "2025-01-01T12:00"
    - "2025-01-01T15:00"
    - "2025-01-01T18:00"
    - "2025-01-01T21:00"

  hourly_temperature_2m:
    - -3.1
    - -1.5
    - 0.2
    - 2.8
    - 5.6
    - 4.9
    - 1.7
    - -0.8

  hourly_precipitation_probability:
    - 10
    - 15
    - 20
    - 25
    - 30
    - 20
    - 15
    - 10

  hourly_wind_speed_10m:
    - 8.0
    - 10.4
    - 12.8
    - 14.2
    - 16.7
    - 12.1
    - 9.5
    - 7.3

  daily_time:
    - "2025-01-01"
    - "2025-01-02"

  daily_temp_max:
    - 5.8
    - 3.2

  daily_temp_min:
    - -3.4
    - -6.1

  daily_precip_sum:
    - 2.6
    - 0.8

  k__current_temperature: 4.2
  k__current_wind_speed: 14.3
  k__current_wind_direction: 245
  k__current_weather_code: 2

communication:
  - http_endpoint:
      host: "$param(http_host)"
      port: "$param(http_port)"
      endpoints:
        "/v1/forecast/{profile}/{horizon_hours}":
          method: GET
          alias:
            - "#attr(k__active_profile) = #param(profile)"
            - "#attr(forecast_horizon_hours) = #param(horizon_hours)"
          response:
            latitude: "#attr(k__latitude)"
            longitude: "#attr(k__longitude)"
            elevation_m: "#attr(elevation_m)"
            timezone: "#attr(k__timezone)"
            generationtime_ms: "#attr(generation_time_ms)"
            forecast_profile: "#attr(k__active_profile)"
            forecast_horizon_hours: "#attr(forecast_horizon_hours)"
            hourly_units:
              time: "iso8601"
              temperature_2m: "°C"
              precipitation_probability: "%"
              wind_speed_10m: "km/h"
            hourly:
              time: "#attr(hourly_time)"
              temperature_2m: "#attr(hourly_temperature_2m)"
              precipitation_probability: "#attr(hourly_precipitation_probability)"
              wind_speed_10m: "#attr(hourly_wind_speed_10m)"
            daily_units:
              time: "iso8601"
              temperature_2m_max: "°C"
              temperature_2m_min: "°C"
              precipitation_sum: "mm"
            daily:
              time: "#attr(daily_time)"
              temperature_2m_max: "#attr(daily_temp_max)"
              temperature_2m_min: "#attr(daily_temp_min)"
              precipitation_sum: "#attr(daily_precip_sum)"
            current_weather:
              temperature: "#attr(k__current_temperature)"
              windspeed: "#attr(k__current_wind_speed)"
              winddirection: "#attr(k__current_wind_direction)"
              weathercode: "#attr(k__current_weather_code)"

        "/simulator/profile":
          method: POST
          alias:
            - "#attr(k__active_profile) = #param(__body__.profile)"
            - "#attr(forecast_horizon_hours) = #param(__body__.horizon_hours)"
          response:
            status: "ok"
            active_profile: "#attr(k__active_profile)"
            forecast_horizon_hours: "#attr(forecast_horizon_hours)"

        "/simulator/location":
          method: PUT
          alias:
            - "#attr(k__latitude) = #param(__body__.latitude)"
            - "#attr(k__longitude) = #param(__body__.longitude)"
            - "#attr(k__timezone) = #param(__body__.timezone)"
          response:
            status: "ok"
            latitude: "#attr(k__latitude)"
            longitude: "#attr(k__longitude)"
            timezone: "#attr(k__timezone)"
