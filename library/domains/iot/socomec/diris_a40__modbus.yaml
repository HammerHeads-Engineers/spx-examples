# SPDX-License-Identifier: MIT

name: diris_a40__modbus
description: |
  Socomec DIRIS A-40 power meter simulated as a Modbus TCP slave. The register
  map follows the DIRIS A-40 communication table (load and energy instant values):
    - 18436..18492: frequency + power (Int32/UInt32 input registers)
    - 18608..18668: RMS voltages/currents (UInt32 input registers, 10^-2 scale)
    - 18688..18692: total active energy import/export (UInt32 input registers, 10^-2 scale)

meta_parameters:
  modbus_port:
    type: int
    default: 5031
  modbus_unit_id:
    type: int
    default: 1

attributes:
  # Phase-to-neutral voltages (V)
  k__voltage_l1_n_v: 230.0
  k__voltage_l2_n_v: 231.0
  k__voltage_l3_n_v: 229.5

  # Line-to-line voltages (V)
  voltage_l1_l2_v: 0.0
  voltage_l2_l3_v: 0.0
  voltage_l3_l1_v: 0.0

  # Phase currents (A)
  k__current_l1_a: 12.0
  k__current_l2_a: 10.8
  k__current_l3_a: 11.4
  current_n_a: 0.0

  # Power factor and sign convention
  k__power_factor: 0.96
  power_factor_leading: 0

  # Power (W/var/VA)
  active_power_l1_w: 0.0
  active_power_l2_w: 0.0
  active_power_l3_w: 0.0
  k__active_power_total_w: 0.0
  reactive_power_total_var: 0.0
  apparent_power_total_va: 0.0

  reactive_power_l1_var: 0.0
  reactive_power_l2_var: 0.0
  reactive_power_l3_var: 0.0
  apparent_power_l1_va: 0.0
  apparent_power_l2_va: 0.0
  apparent_power_l3_va: 0.0

  # Frequency (Hz)
  k__frequency_hz: 50.0

  # Cumulative energy (kWh)
  k__energy_import_total_kwh: 0.0
  k__energy_export_total_kwh: 0.0

  _cycle_time_s: 1.0
  scale_0p01: 100.0

  # Raw Modbus register values
  voltage_l1_l2_raw: 0
  voltage_l2_l3_raw: 0
  voltage_l3_l1_raw: 0
  voltage_l1_n_raw: 0
  voltage_l2_n_raw: 0
  voltage_l3_n_raw: 0

  current_l1_raw: 0
  current_l2_raw: 0
  current_l3_raw: 0
  current_n_raw: 0

  frequency_raw: 0

  active_power_l1_raw: 0
  active_power_l2_raw: 0
  active_power_l3_raw: 0
  active_power_total_raw: 0

  reactive_power_l1_raw: 0
  reactive_power_l2_raw: 0
  reactive_power_l3_raw: 0
  reactive_power_total_raw: 0

  apparent_power_l1_raw: 0
  apparent_power_l2_raw: 0
  apparent_power_l3_raw: 0
  apparent_power_total_raw: 0

  energy_import_raw: 0
  energy_export_raw: 0

actions:
  - function: $in(voltage_l1_l2_v)
    name: compute_voltage_l1_l2
    description: Approximate L1-L2 voltage from phase-to-neutral values.
    call: 1.7320508075688772 * (($in(k__voltage_l1_n_v) + $in(k__voltage_l2_n_v)) / 2.0)

  - function: $in(voltage_l2_l3_v)
    name: compute_voltage_l2_l3
    description: Approximate L2-L3 voltage from phase-to-neutral values.
    call: 1.7320508075688772 * (($in(k__voltage_l2_n_v) + $in(k__voltage_l3_n_v)) / 2.0)

  - function: $in(voltage_l3_l1_v)
    name: compute_voltage_l3_l1
    description: Approximate L3-L1 voltage from phase-to-neutral values.
    call: 1.7320508075688772 * (($in(k__voltage_l3_n_v) + $in(k__voltage_l1_n_v)) / 2.0)

  - function: $in(active_power_l1_w)
    name: compute_active_power_l1
    description: Phase L1 active power.
    call: $in(k__power_factor) * $in(k__voltage_l1_n_v) * $in(k__current_l1_a)

  - function: $in(active_power_l2_w)
    name: compute_active_power_l2
    description: Phase L2 active power.
    call: $in(k__power_factor) * $in(k__voltage_l2_n_v) * $in(k__current_l2_a)

  - function: $in(active_power_l3_w)
    name: compute_active_power_l3
    description: Phase L3 active power.
    call: $in(k__power_factor) * $in(k__voltage_l3_n_v) * $in(k__current_l3_a)

  - function: $in(k__active_power_total_w)
    name: compute_active_power_total
    description: Total active power (sum of per-phase values).
    call: $in(active_power_l1_w) + $in(active_power_l2_w) + $in(active_power_l3_w)

  - function: $in(apparent_power_l1_va)
    name: compute_apparent_power_l1
    description: Phase L1 apparent power.
    call: $in(k__voltage_l1_n_v) * $in(k__current_l1_a)

  - function: $in(apparent_power_l2_va)
    name: compute_apparent_power_l2
    description: Phase L2 apparent power.
    call: $in(k__voltage_l2_n_v) * $in(k__current_l2_a)

  - function: $in(apparent_power_l3_va)
    name: compute_apparent_power_l3
    description: Phase L3 apparent power.
    call: $in(k__voltage_l3_n_v) * $in(k__current_l3_a)

  - function: $in(apparent_power_total_va)
    name: compute_apparent_power_total
    description: Total apparent power (sum of per-phase values).
    call: $in(apparent_power_l1_va) + $in(apparent_power_l2_va) + $in(apparent_power_l3_va)

  - function: $in(reactive_power_total_var)
    name: compute_reactive_power_total
    description: Approximate total reactive power magnitude from active/apparent power.
    call: (
          max(0.0, ($in(apparent_power_total_va) ** 2) - ($in(k__active_power_total_w) ** 2)) ** 0.5
        ) * (-1.0 if $in(power_factor_leading) else 1.0)

  - function: $in(reactive_power_l1_var)
    name: compute_reactive_power_l1
    description: Estimate phase L1 reactive power.
    call: (
          max(0.0, ($in(apparent_power_l1_va) ** 2) - ($in(active_power_l1_w) ** 2)) ** 0.5
        ) * (-1.0 if $in(power_factor_leading) else 1.0)

  - function: $in(reactive_power_l2_var)
    name: compute_reactive_power_l2
    description: Estimate phase L2 reactive power.
    call: (
          max(0.0, ($in(apparent_power_l2_va) ** 2) - ($in(active_power_l2_w) ** 2)) ** 0.5
        ) * (-1.0 if $in(power_factor_leading) else 1.0)

  - function: $in(reactive_power_l3_var)
    name: compute_reactive_power_l3
    description: Estimate phase L3 reactive power.
    call: (
          max(0.0, ($in(apparent_power_l3_va) ** 2) - ($in(active_power_l3_w) ** 2)) ** 0.5
        ) * (-1.0 if $in(power_factor_leading) else 1.0)

  - function: $in(k__energy_import_total_kwh)
    name: integrate_energy_import
    description: Integrate imported energy (kWh) from total active power (W).
    call: $in(k__energy_import_total_kwh) + max(0.0, $in(k__active_power_total_w)) * $in(_cycle_time_s) / 3600000.0

  - function: $in(k__energy_export_total_kwh)
    name: integrate_energy_export
    description: Integrate exported energy (kWh) from total active power (W).
    call: $in(k__energy_export_total_kwh) + max(0.0, -$in(k__active_power_total_w)) * $in(_cycle_time_s) / 3600000.0

  - function: $in(voltage_l1_l2_raw)
    name: encode_voltage_l1_l2_raw
    call: int(round($in(voltage_l1_l2_v) * $in(scale_0p01)))

  - function: $in(voltage_l2_l3_raw)
    name: encode_voltage_l2_l3_raw
    call: int(round($in(voltage_l2_l3_v) * $in(scale_0p01)))

  - function: $in(voltage_l3_l1_raw)
    name: encode_voltage_l3_l1_raw
    call: int(round($in(voltage_l3_l1_v) * $in(scale_0p01)))

  - function: $in(voltage_l1_n_raw)
    name: encode_voltage_l1_n_raw
    call: int(round($in(k__voltage_l1_n_v) * $in(scale_0p01)))

  - function: $in(voltage_l2_n_raw)
    name: encode_voltage_l2_n_raw
    call: int(round($in(k__voltage_l2_n_v) * $in(scale_0p01)))

  - function: $in(voltage_l3_n_raw)
    name: encode_voltage_l3_n_raw
    call: int(round($in(k__voltage_l3_n_v) * $in(scale_0p01)))

  - function: $in(current_l1_raw)
    name: encode_current_l1_raw
    call: int(round($in(k__current_l1_a) * $in(scale_0p01)))

  - function: $in(current_l2_raw)
    name: encode_current_l2_raw
    call: int(round($in(k__current_l2_a) * $in(scale_0p01)))

  - function: $in(current_l3_raw)
    name: encode_current_l3_raw
    call: int(round($in(k__current_l3_a) * $in(scale_0p01)))

  - function: $in(current_n_raw)
    name: encode_current_n_raw
    call: int(round($in(current_n_a) * $in(scale_0p01)))

  - function: $in(frequency_raw)
    name: encode_frequency_raw
    call: int(round($in(k__frequency_hz) * $in(scale_0p01)))

  - function: $in(active_power_l1_raw)
    name: encode_active_power_l1_raw
    call: int(round($in(active_power_l1_w)))

  - function: $in(active_power_l2_raw)
    name: encode_active_power_l2_raw
    call: int(round($in(active_power_l2_w)))

  - function: $in(active_power_l3_raw)
    name: encode_active_power_l3_raw
    call: int(round($in(active_power_l3_w)))

  - function: $in(active_power_total_raw)
    name: encode_active_power_total_raw
    call: int(round($in(k__active_power_total_w)))

  - function: $in(reactive_power_l1_raw)
    name: encode_reactive_power_l1_raw
    call: int(round($in(reactive_power_l1_var)))

  - function: $in(reactive_power_l2_raw)
    name: encode_reactive_power_l2_raw
    call: int(round($in(reactive_power_l2_var)))

  - function: $in(reactive_power_l3_raw)
    name: encode_reactive_power_l3_raw
    call: int(round($in(reactive_power_l3_var)))

  - function: $in(reactive_power_total_raw)
    name: encode_reactive_power_total_raw
    call: int(round($in(reactive_power_total_var)))

  - function: $in(apparent_power_l1_raw)
    name: encode_apparent_power_l1_raw
    call: int(round($in(apparent_power_l1_va)))

  - function: $in(apparent_power_l2_raw)
    name: encode_apparent_power_l2_raw
    call: int(round($in(apparent_power_l2_va)))

  - function: $in(apparent_power_l3_raw)
    name: encode_apparent_power_l3_raw
    call: int(round($in(apparent_power_l3_va)))

  - function: $in(apparent_power_total_raw)
    name: encode_apparent_power_total_raw
    call: int(round($in(apparent_power_total_va)))

  - function: $in(energy_import_raw)
    name: encode_energy_import_raw
    call: int(round($in(k__energy_import_total_kwh) * $in(scale_0p01)))

  - function: $in(energy_export_raw)
    name: encode_energy_export_raw
    call: int(round($in(k__energy_export_total_kwh) * $in(scale_0p01)))

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: "$param(modbus_port)"
      unit_id: "$param(modbus_unit_id)"
      zero_fill: true
      mapping:
        # Frequency (Hz) UInt32 (10^-2)
        frequency_raw: { address: [18436, 18437], group: i_r, type: uint_32 }

        # Active power (W) Int32
        active_power_l1_raw:   { address: [18448, 18449], group: i_r, type: int_32 }
        active_power_l2_raw:   { address: [18452, 18453], group: i_r, type: int_32 }
        active_power_l3_raw:   { address: [18456, 18457], group: i_r, type: int_32 }
        active_power_total_raw: { address: [18460, 18461], group: i_r, type: int_32 }

        # Reactive power (var) Int32
        reactive_power_l1_raw:   { address: [18464, 18465], group: i_r, type: int_32 }
        reactive_power_l2_raw:   { address: [18468, 18469], group: i_r, type: int_32 }
        reactive_power_l3_raw:   { address: [18472, 18473], group: i_r, type: int_32 }
        reactive_power_total_raw: { address: [18476, 18477], group: i_r, type: int_32 }

        # Apparent power (VA) UInt32
        apparent_power_l1_raw:   { address: [18480, 18481], group: i_r, type: uint_32 }
        apparent_power_l2_raw:   { address: [18484, 18485], group: i_r, type: uint_32 }
        apparent_power_l3_raw:   { address: [18488, 18489], group: i_r, type: uint_32 }
        apparent_power_total_raw: { address: [18492, 18493], group: i_r, type: uint_32 }

        # RMS voltages (V) UInt32 (10^-2)
        voltage_l1_l2_raw: { address: [18608, 18609], group: i_r, type: uint_32 }
        voltage_l2_l3_raw: { address: [18612, 18613], group: i_r, type: uint_32 }
        voltage_l3_l1_raw: { address: [18616, 18617], group: i_r, type: uint_32 }
        voltage_l1_n_raw:  { address: [18624, 18625], group: i_r, type: uint_32 }
        voltage_l2_n_raw:  { address: [18628, 18629], group: i_r, type: uint_32 }
        voltage_l3_n_raw:  { address: [18632, 18633], group: i_r, type: uint_32 }

        # RMS currents (A) UInt32 (10^-2)
        current_l1_raw: { address: [18656, 18657], group: i_r, type: uint_32 }
        current_l2_raw: { address: [18660, 18661], group: i_r, type: uint_32 }
        current_l3_raw: { address: [18664, 18665], group: i_r, type: uint_32 }
        current_n_raw:  { address: [18668, 18669], group: i_r, type: uint_32 }

        # Total active energy (kWh) UInt32 (10^-2)
        energy_import_raw: { address: [18688, 18689], group: i_r, type: uint_32 }
        energy_export_raw: { address: [18692, 18693], group: i_r, type: uint_32 }

scenarios:
  peak_demand:
    description: Elevated balanced currents with near-unity power factor.
    duration: 30.0
    overrides:
      $in(k__current_l1_a): 40.0
      $in(k__current_l2_a): 39.5
      $in(k__current_l3_a): 41.0
      $in(k__power_factor): 0.99

  voltage_sag:
    description: Reduced phase-to-neutral voltages across all phases.
    duration: 25.0
    overrides:
      $in(k__voltage_l1_n_v): 210.0
      $in(k__voltage_l2_n_v): 212.0
      $in(k__voltage_l3_n_v): 209.0

  frequency_drift:
    description: Off-nominal grid frequency.
    duration: 20.0
    overrides:
      $in(k__frequency_hz): 49.2

  low_load:
    description: Light load with low currents.
    duration: 20.0
    overrides:
      $in(k__current_l1_a): 4.0
      $in(k__current_l2_a): 3.8
      $in(k__current_l3_a): 4.1
