name: security_access_controller__bacnet
description: |
  Intrusion detection and access-control panel exposing door contacts, motion zones,
  lock command and partition mode via BACnet/IP.

attributes:
  entry_door_contact: 0   # 1 when door open
  server_room_contact: 0  # 1 when door open
  motion_zone: 0          # 1 when movement detected

  lock_command: 1         # 1=locked, 0=unlocked
  siren_command: 0
  alarm_active: 0

  access_mode: 1          # 1=disarmed, 2=armed-stay, 3=armed-away, 4=alarm
  alarm_text: "DISARMED"

conditions:
  # Trigger alarm when armed and intrusion detected.
  - if: (
        $in(access_mode) in [2, 3]
        and (
          $in(entry_door_contact) == 1
          or $in(server_room_contact) == 1
          or ($in(motion_zone) == 1 and $in(access_mode) == 3)
        )
      )
    actions:
      - set: $in(alarm_active)
        value: 1
      - set: $in(siren_command)
        value: 1
      - set: $in(access_mode)
        value: 4
      - set: $in(alarm_text)
        value: "ALARM"

  # Clear alarm when disarmed.
  - if: $in(access_mode) == 1
    actions:
      - set: $in(alarm_active)
        value: 0
      - set: $in(siren_command)
        value: 0
      - set: $in(alarm_text)
        value: "DISARMED"

communication:
  - bacnet:
      host: 0.0.0.0
      port: 47818
      device:
        instance_id: 3020
        vendor_id: 999
        name: "SPX BACnet Security Controller"
        model_name: "spx-server"
      timing:
        poll_interval: 0.5
        poll_jitter: 0.05
      objects:
        entry_door:
          type: binaryInput
          instance: 11
          properties:
            presentValue:
              read: "#attr(entry_door_contact)"
              states:
                0: "closed"
                1: "open"
        server_room_door:
          type: binaryInput
          instance: 12
          properties:
            presentValue:
              read: "#attr(server_room_contact)"
              states:
                0: "closed"
                1: "open"
        motion_zone:
          type: binaryInput
          instance: 13
          properties:
            presentValue:
              read: "#attr(motion_zone)"
              states:
                0: "clear"
                1: "motion"
        door_lock:
          type: binaryOutput
          instance: 21
          priority: 8
          properties:
            presentValue:
              read: "#attr(lock_command)"
              write: "#attr(lock_command)"
              states:
                0: "unlocked"
                1: "locked"
            relinquishDefault: 1
        siren_output:
          type: binaryOutput
          instance: 22
          priority: 8
          properties:
            presentValue:
              read: "#attr(siren_command)"
              write: "#attr(siren_command)"
              states:
                0: "off"
                1: "on"
            relinquishDefault: 0
        partition_mode:
          type: multiStateValue
          instance: 30
          properties:
            presentValue:
              read: "#attr(access_mode)"
              write: "#attr(access_mode)"
              states:
                1: "disarmed"
                2: "armed-stay"
                3: "armed-away"
                4: "alarm"
            numberOfStates: 4
            stateText:
              - "disarmed"
              - "armed-stay"
              - "armed-away"
              - "alarm"
        alarm_state:
          type: binaryValue
          instance: 40
          properties:
            presentValue:
              read: "#attr(alarm_active)"
              states:
                0: "normal"
                1: "alarm"
      alarms:
        intrusion_alarm:
          instance: 410
          properties:
            monitoredObjectIdentifier: "binaryValue,40"
            eventEnable: [true, true, true]
            eventMessageTexts:
              value:
                - "Intrusion alarm active"
                - "Intrusion fault"
                - "Intrusion normal"
