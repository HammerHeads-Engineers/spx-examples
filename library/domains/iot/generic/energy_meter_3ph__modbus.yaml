# SPDX-License-Identifier: MIT

name: energy_meter_3ph__modbus
description: |
  Three-phase energy meter model for Modbus-based energy monitoring. Mirrors
  the behaviour of the MQTT variant but exposes measurements via Modbus.

attributes:
  voltage_l1: 400.0
  voltage_l2: 400.0
  voltage_l3: 400.0
  voltage_nominal: 400.0
  voltage_drop_per_amp: 1.5
  voltage_unbalance_gain: 0.8
  voltage_floor: 340.0
  voltage_ceiling: 420.0

  current_l1: 12.0
  current_l2: 10.5
  current_l3: 11.2
  current_nominal: 10.0

  frequency_hz: 50.0
  frequency_nominal_hz: 50.0
  frequency_droop_per_kw: 0.03
  frequency_floor_hz: 47.5
  frequency_ceiling_hz: 51.5

  power_factor: 0.95
  power_factor_leading: 0

  active_power_kw: 0.0
  energy_import_kwh: 0.0
  reactive_power_kvar: 0.0

  overload_threshold_kw: 45.0
  overload_alarm: 0

  nominal_power_kw: 30.0

  cycle_time_s: 1.0

actions:
  - function: $in(active_power_kw)
    name: compute_active_power
    description: Estimate active power from three-phase voltage, currents, and power factor.
    call: 1e-3
         * $in(power_factor)
         * (
             $in(voltage_l1) * $in(current_l1)
             + $in(voltage_l2) * $in(current_l2)
             + $in(voltage_l3) * $in(current_l3)
           )

  - function: $in(energy_import_kwh)
    name: integrate_energy
    description: Integrate cumulative imported energy based on active power.
    call: $in(energy_import_kwh) + max(0.0, $in(active_power_kw)) * cycle_time_s / 3600.0

  - function: $in(overload_alarm)
    name: detect_overload
    description: Raise overload alarm when power exceeds the threshold.
    call: 1 if $in(active_power_kw) >= $in(overload_threshold_kw) else 0

  - function: $in(reactive_power_kvar)
    name: compute_reactive_power
    description: Approximate reactive power magnitude from active power / power factor and apply lead-lag sign.
    call: (
          (
            max(
              0.0,
              (
                (
                  abs($in(active_power_kw))
                  / max(0.05, min(1.0, abs($in(power_factor))))
                )
                ** 2
                - ($in(active_power_kw) ** 2)
              )
            )
          )
          ** 0.5
        ) * (-1.0 if $in(power_factor_leading) else 1.0)

  - function: $in(voltage_l1)
    name: adjust_voltage_l1
    description: Apply load-dependent sag and unbalance effects on phase L1 voltage.
    call: max(
          $in(voltage_floor),
          min(
            $in(voltage_ceiling),
            $in(voltage_nominal)
            - $in(voltage_drop_per_amp) * max(0.0, $in(current_l1) - $in(current_nominal))
            - $in(voltage_unbalance_gain)
              * max(
                0.0,
                abs(
                  $in(current_l1)
                  - (($in(current_l2) + $in(current_l3)) / 2.0)
                )
              )
          )
        )

  - function: $in(voltage_l2)
    name: adjust_voltage_l2
    description: Apply load-dependent sag and unbalance effects on phase L2 voltage.
    call: max(
          $in(voltage_floor),
          min(
            $in(voltage_ceiling),
            $in(voltage_nominal)
            - $in(voltage_drop_per_amp) * max(0.0, $in(current_l2) - $in(current_nominal))
            - $in(voltage_unbalance_gain)
              * max(
                0.0,
                abs(
                  $in(current_l2)
                  - (($in(current_l1) + $in(current_l3)) / 2.0)
                )
              )
          )
        )

  - function: $in(voltage_l3)
    name: adjust_voltage_l3
    description: Apply load-dependent sag and unbalance effects on phase L3 voltage.
    call: max(
          $in(voltage_floor),
          min(
            $in(voltage_ceiling),
            $in(voltage_nominal)
            - $in(voltage_drop_per_amp) * max(0.0, $in(current_l3) - $in(current_nominal))
            - $in(voltage_unbalance_gain)
              * max(
                0.0,
                abs(
                  $in(current_l3)
                  - (($in(current_l1) + $in(current_l2)) / 2.0)
                )
              )
          )
        )

  - function: $in(frequency_hz)
    name: droop_frequency
    description: Simulate governor droop where higher power draw depresses frequency.
    call: max(
          $in(frequency_floor_hz),
          min(
            $in(frequency_ceiling_hz),
            $in(frequency_nominal_hz)
            - $in(frequency_droop_per_kw)
              * max(0.0, $in(active_power_kw) - $in(nominal_power_kw))
          )
        )

communication:
  - modbus_tcp:
      poll_interval: 0.5
      mapping:
        voltage_l1:        { address: [0,1],  group: h_r, type: float }
        voltage_l2:        { address: [2,3],  group: h_r, type: float }
        voltage_l3:        { address: [4,5],  group: h_r, type: float }
        current_l1:        { address: [6,7],  group: h_r, type: float }
        current_l2:        { address: [8,9],  group: h_r, type: float }
        current_l3:        { address: [10,11], group: h_r, type: float }
        frequency_hz:      { address: [12,13], group: h_r, type: float }
        power_factor:      { address: [14,15], group: h_r, type: float }
        active_power_kw:   { address: [16,17], group: h_r, type: float }
        energy_import_kwh: { address: [18,19], group: h_r, type: float }
        overload_threshold_kw: { address: [20,21], group: h_r, type: float }
        overload_alarm:    { address: [22,22], group: h_r, type: uint_16 }
        voltage_nominal:   { address: [23,24], group: h_r, type: float }
        voltage_drop_per_amp: { address: [25,26], group: h_r, type: float }
        voltage_unbalance_gain: { address: [27,28], group: h_r, type: float }
        current_nominal:   { address: [29,30], group: h_r, type: float }
        frequency_nominal_hz: { address: [31,32], group: h_r, type: float }
        frequency_droop_per_kw: { address: [33,34], group: h_r, type: float }
        nominal_power_kw:  { address: [35,36], group: h_r, type: float }
        reactive_power_kvar: { address: [37,38], group: h_r, type: float }
        power_factor_leading: { address: [39,39], group: h_r, type: uint_16 }

scenarios:
  balanced_load_step:
    enabled: true
    duration: 20.0
    overrides:
      $in(current_l1): 18.0
      $in(current_l2): 17.5
      $in(current_l3): 18.2
      $in(power_factor): 0.92

  unbalanced_phase_l2:
    enabled: true
    duration: 15.0
    overrides:
      $in(current_l1): 9.0
      $in(current_l2): 24.0
      $in(current_l3): 8.5
      $in(power_factor): 0.88

  voltage_sag_event:
    enabled: true
    duration: 10.0
    overrides:
      $in(voltage_nominal): 390.0
      $in(voltage_drop_per_amp): 2.5
      $in(power_factor): 0.9

  frequency_dip_under_overload:
    enabled: true
    duration: 12.0
    overrides:
      $in(current_l1): 20.0
      $in(current_l2): 19.0
      $in(current_l3): 20.5
      $in(power_factor): 0.9
      $in(nominal_power_kw): 20.0
      $in(frequency_droop_per_kw): 0.05

  pv_backfeed_disturbance:
    enabled: true
    duration: 18.0
    overrides:
      $in(current_l1): -14.0
      $in(current_l2): -11.5
      $in(current_l3): -15.2
      $in(power_factor): 0.98
      $in(power_factor_leading): 1
      $in(voltage_nominal): 415.0
      $in(voltage_drop_per_amp): 0.8
      $in(voltage_unbalance_gain): 1.4
      $in(frequency_droop_per_kw): 0.07
      $in(nominal_power_kw): 18.0
