# Multi-sensor environmental node exposing MQTT telemetry and accepting remote setpoints.
# name: generic_mqtt_environment_sensor
# description: |
#   Virtual HVAC zone sensor that publishes environmental telemetry over MQTT while reacting
#   to remote control commands. The model captures typical smart-building data such as
#   temperature, humidity, and indoor air quality while surfacing health alarms.

meta_parameters:
  mqtt_broker_host:
    type: str
    default: host.docker.internal
  mqtt_broker_port:
    type: int
    default: 1883
  mqtt_topic_prefix:
    type: str
    default: "spx/examples/env"
  mqtt_publish_interval:
    type: float
    default: 0.5
  mqtt_default_qos:
    type: int
    default: 1

attributes:
  k__temperature_c: 22.5          # °C, current measured temperature
  ambient_c: 20.5              # °C, surrounding ambient temperature
  k__target_c: 22.0               # °C, commanded comfort setpoint from MQTT
  k__humidity_percent: 45.0       # %RH, instantaneous humidity
  humidity_target: 47.0        # %RH, preferred humidity band target
  humidity_ambient: 42.0       # %RH, ambient humidity influencing drift
  k__co2_ppm: 560.0               # ppm, indoor CO₂ level estimate
  co2_target: 650.0            # ppm, acceptable CO₂ band upper bound
  k__hvac_mode: auto              # HVAC operating mode (auto/heat/cool/off)
  k__fan_speed_percent: 32.0      # %, current fan command applied by local controller
  k__fan_speed_target: 35.0       # %, desired fan speed from remote command
  fan_speed_adjusted_target: 35.0  # %, target after automatic biasing
  fan_slew_rate: 4.0           # % per cycle, slew rate limiter for fan updates
  fan_temp_gain: 2.5           # gain converting temperature error into additional fan demand
  k__occupancy_count: 3.0         # people, inferred occupancy
  k__occupancy_target: 3.0        # people, scenario override target

  k__comfort_index: 92.0          # 0-100 composite comfort score
  comfort_weight_temp: 0.55    # weighting factor for temperature error
  comfort_weight_humidity: 0.25  # weighting factor for humidity error
  comfort_weight_co2: 0.20     # weighting factor for CO₂ excess

  temperature_integral: 0.0    # helper removing steady-state error in temperature loop
  temperature_integral_gain: 0.08  # gain for integrating temperature error
  temperature_integral_leak: 0.02  # leak factor preventing integral wind-up
  temperature_integral_clamp: 40.0 # absolute clamp for integral contribution

  humidity_temp_gain: 0.015    # rate at which higher temps dry the air
  co2_temp_gain: 1.5           # ppm contribution per degree of positive temp error

  k__alarm_high_temp: 0           # 0/1, over-temperature alarm flag
  k__alarm_co2: 0                 # 0/1, elevated CO₂ alarm flag
  k__alarm_stale_data: 0          # 0/1, MQTT stale-data alarm flag
  high_temp_threshold: 28.0    # °C, alarm threshold
  co2_threshold: 1200.0        # ppm, alarm threshold
  stale_counter: 0.0           # s, accumulator tracking offline duration
  stale_timeout: 60.0          # s, threshold before stale data alarm

  ventilation_rate: 0.18       # fractional fresh-air replacement per cycle
  occupancy_emission: 25.0     # ppm contribution per occupant per cycle
  occupancy_decay: 0.45        # fractional decay toward occupancy target

  k__mqtt_connected: 1            # 0/1, communication health flag
  k__status_text: "IDLE"          # textual summary of current mode
  command_source: ""           # helper storing last command origin label

actions:
  # Slew the inferred occupancy toward the target (used by scenarios).
  - function: $in(k__occupancy_count)
    description: Smoothly blend occupancy toward scenario target to avoid impulsive spikes.
    slew_rate: 0.6
    call: (
          $in(k__occupancy_target)
          if abs($in(k__occupancy_target) - $in(k__occupancy_count)) <= slew_rate
          else $in(k__occupancy_count)
               + (slew_rate if $in(k__occupancy_target) > $in(k__occupancy_count) else -slew_rate)
        )

  # Update process temperature using a simple ambient/load/PI blend.
  - function: $in(temperature_integral)
    description: Integrate temperature error to remove steady-state offset.
    call: max(
          -$in(temperature_integral_clamp),
          min(
            $in(temperature_integral_clamp),
            $in(temperature_integral) * (1 - $in(temperature_integral_leak))
            + $in(temperature_integral_gain) * ($in(k__target_c) - $in(k__temperature_c))
          )
        )

  - function: $in(k__temperature_c)
    description: Combine ambient drift, occupant heat load, and setpoint tracking consistent with HVAC models.
    heating_gain: 0.12
    cooling_gain: 0.09
    ambient_gain: 0.04
    occupancy_gain: 0.018
    call: (
          $in(k__temperature_c)
          + ambient_gain * ($in(ambient_c) - $in(k__temperature_c))
          + occupancy_gain * max(0.0, $in(k__occupancy_count) - 1.0)
          + heating_gain * max(0.0, $in(k__target_c) - $in(k__temperature_c))
          - cooling_gain * max(0.0, $in(k__temperature_c) - $in(k__target_c))
          + $in(temperature_integral)
        )

  # Blend humidity toward the target while respecting physical limits.
  - function: $in(k__humidity_percent)
    description: Approach humidity target with ambient influence and occupant moisture load.
    recovery_gain: 0.06
    occupant_gain: 0.025
    call: max(
          15.0,
          min(
            95.0,
            $in(k__humidity_percent)
            + recovery_gain * ($in(humidity_target) - $in(k__humidity_percent))
            + occupant_gain * max(0.0, $in(k__occupancy_count) - 1.0)
            + 0.02 * ($in(humidity_ambient) - $in(k__humidity_percent))
            - $in(humidity_temp_gain) * max(0.0, $in(k__temperature_c) - $in(k__target_c))
          )
        )

  # Evolve CO₂ concentration based on ventilation and occupancy respiration.
  - function: $in(k__co2_ppm)
    description: Estimate indoor CO₂ with a low-order balance between emissions and ventilation.
    outdoor_ppm: 420.0
    call: max(
          outdoor_ppm,
          (
            $in(k__co2_ppm)
            - $in(ventilation_rate) * max(0.0, $in(k__co2_ppm) - outdoor_ppm)
            + $in(occupancy_emission) * max(0.0, $in(k__occupancy_count))
            + $in(co2_temp_gain) * max(0.0, $in(k__temperature_c) - $in(k__target_c))
          )
        )

  # Blend manual fan target with automatic bias based on temperature error.
  - function: $in(fan_speed_adjusted_target)
    description: Increase fan demand when temperature exceeds the setpoint.
    call: max(
          0.0,
          min(
            100.0,
            $in(k__fan_speed_target)
            + max(-25.0, min(25.0, $in(fan_temp_gain) * ($in(k__temperature_c) - $in(k__target_c))))
          )
        )

  # Slew the applied fan speed toward the target command with rate limiting.
  - function: $in(k__fan_speed_percent)
    description: Rate-limit fan speed adjustments derived from MQTT commands or automation.
    call: max(
          0.0,
          min(
            100.0,
            (
              $in(fan_speed_adjusted_target)
              if abs($in(fan_speed_adjusted_target) - $in(k__fan_speed_percent)) <= $in(fan_slew_rate)
              else (
                $in(k__fan_speed_percent)
                + (
                    $in(fan_slew_rate)
                    if $in(fan_speed_adjusted_target) > $in(k__fan_speed_percent)
                    else -$in(fan_slew_rate)
                  )
              )
            )
          )
        )

  # Compute a composite comfort index based on temperature, humidity, and CO₂ deviation.
  - function: $in(k__comfort_index)
    description: Collapse deviations into a 0-100 score (100 = best comfort).
    call: max(
          0.0,
          min(
            100.0,
            100.0
            - 10.0 * $in(comfort_weight_temp) * abs($in(k__target_c) - $in(k__temperature_c))
            - 2.5 * $in(comfort_weight_humidity) * abs($in(humidity_target) - $in(k__humidity_percent))
            - 0.08 * $in(comfort_weight_co2) * max(0.0, $in(k__co2_ppm) - $in(co2_target))
          )
        )

  # Derive a readable status string for telemetry dashboards.
  - function: $in(k__status_text)
    description: Provide a textual status reflecting target tracking and connectivity.
    call: (
          "DISCONNECTED" if $in(k__mqtt_connected) == 0
          else (
            "HEATING" if $in(k__target_c) - $in(k__temperature_c) > 0.6
            else ("COOLING" if $in(k__temperature_c) - $in(k__target_c) > 0.6 else "IDLE")
          )
        )

  # Track stale counter based on connectivity status.
  - function: $in(stale_counter)
    description: Integrate offline time to drive stale-data alarms.
    increment: 1.0
    decay: 1.2
    call: (
          max(0.0, min($in(stale_timeout), $in(stale_counter) + increment))
          if $in(k__mqtt_connected) == 0
          else max(0.0, $in(stale_counter) - decay)
        )

  # Raise alarms based on environmental thresholds or stale communications.
  - function: $in(k__alarm_high_temp)
    call: 1 if $in(k__temperature_c) >= $in(high_temp_threshold) else 0

  - function: $in(k__alarm_co2)
    call: 1 if $in(k__co2_ppm) >= $in(co2_threshold) else 0

  - function: $in(k__alarm_stale_data)
    call: 1 if $in(stale_counter) >= $in(stale_timeout) else 0

communication:
  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: "$param(mqtt_topic_prefix)"
      default_qos: "$param(mqtt_default_qos)"
      default_retain: false
      bindings:
        - attribute: $ext(k__temperature_c)
          topic: telemetry/temperature_c
          direction: publish
        - attribute: $ext(k__target_c)
          topic: telemetry/target_c
          direction: publish
        - attribute: $ext(k__humidity_percent)
          topic: telemetry/humidity_percent
          direction: publish
        - attribute: $ext(k__co2_ppm)
          topic: telemetry/co2_ppm
          direction: publish
        - attribute: $ext(k__comfort_index)
          topic: telemetry/comfort_index
          direction: publish
        - attribute: $ext(k__hvac_mode)
          topic: telemetry/hvac_mode
          direction: publish
        - attribute: $ext(k__fan_speed_percent)
          topic: telemetry/fan_speed_percent
          direction: publish
        - attribute: $ext(k__occupancy_count)
          topic: telemetry/occupancy_count
          direction: publish
        - attribute: $ext(k__status_text)
          topic: telemetry/status
          direction: publish
        - attribute: $ext(k__alarm_high_temp)
          topic: telemetry/alarms/high_temp
          direction: publish
        - attribute: $ext(k__alarm_co2)
          topic: telemetry/alarms/co2
          direction: publish
        - attribute: $ext(k__alarm_stale_data)
          topic: telemetry/alarms/stale
          direction: publish
        - attribute: $ext(k__mqtt_connected)
          topic: telemetry/health/mqtt_connected
          direction: publish
        - attribute: $attr(k__target_c)
          topic: command/setpoint_c
          direction: subscribe
        - attribute: $attr(k__hvac_mode)
          topic: command/hvac_mode
          direction: subscribe
        - attribute: $attr(k__fan_speed_target)
          topic: command/fan_speed
          direction: subscribe
        - attribute: $attr(k__occupancy_target)
          topic: command/occupancy
          direction: subscribe
        - attribute: $attr(command_source)
          topic: command/source
          direction: subscribe

scenarios:
  occupancy_spike:
    duration: 15.0
    overrides:
      $in(k__occupancy_target): 18.0

  night_setback:
    duration: 30.0
    overrides:
      $in(k__target_c): 18.5
      $in(k__fan_speed_target): 20.0

  mqtt_disconnect:
    duration: 4.0
    call:
      path: communication.mqtt.detach
      stop_path: communication.mqtt.attach
