    call: -1.0

communication:
  - knx_ip:
      router:
        host: knx_gateway
        port: 3671
        route_back: true
      poll_interval: 0.2
      bindings:
        - name: c1_move_long
          direction: inbound
          group_address: "2/1/1"
          value_codec: bool
          write_attribute: "#attr(c1_move_long_cmd)"
        - name: c1_stop
          direction: inbound
          group_address: "2/2/1"
          value_codec: bool
          write_attribute: "#attr(c1_stop_cmd)"
        - name: c1_position_set
          direction: inbound
          group_address: "2/3/1"
          value_codec: uint8
          write_attribute: "#attr(c1_position_set_raw_cmd)"
        - name: c1_position_state
          direction: outbound
          group_address: "2/4/1"
          value_codec: uint8
          read_attribute: "#attr(c1_position_state_raw)"

        - name: c2_move_long
          direction: inbound
          group_address: "2/1/2"
          value_codec: bool
          write_attribute: "#attr(c2_move_long_cmd)"
        - name: c2_stop
          direction: inbound
          group_address: "2/2/2"
          value_codec: bool
          write_attribute: "#attr(c2_stop_cmd)"
        - name: c2_position_set
          direction: inbound
          group_address: "2/3/2"
          value_codec: uint8
          write_attribute: "#attr(c2_position_set_raw_cmd)"
        - name: c2_position_state
          direction: outbound
          group_address: "2/4/2"
          value_codec: uint8
          read_attribute: "#attr(c2_position_state_raw)"

        - name: c3_move_long
          direction: inbound
          group_address: "2/1/3"
          value_codec: bool
          write_attribute: "#attr(c3_move_long_cmd)"
        - name: c3_stop
          direction: inbound
          group_address: "2/2/3"
          value_codec: bool
          write_attribute: "#attr(c3_stop_cmd)"
        - name: c3_position_set
          direction: inbound
          group_address: "2/3/3"
          value_codec: uint8
          write_attribute: "#attr(c3_position_set_raw_cmd)"
        - name: c3_position_state
          direction: outbound
          group_address: "2/4/3"
          value_codec: uint8
          read_attribute: "#attr(c3_position_state_raw)"

        - name: c4_move_long
          direction: inbound
          group_address: "2/1/4"
          value_codec: bool
          write_attribute: "#attr(c4_move_long_cmd)"
        - name: c4_stop
          direction: inbound
          group_address: "2/2/4"
          value_codec: bool
          write_attribute: "#attr(c4_stop_cmd)"
        - name: c4_position_set
          direction: inbound
          group_address: "2/3/4"
          value_codec: uint8
          write_attribute: "#attr(c4_position_set_raw_cmd)"
        - name: c4_position_state
          direction: outbound
          group_address: "2/4/4"
          value_codec: uint8
          read_attribute: "#attr(c4_position_state_raw)"
