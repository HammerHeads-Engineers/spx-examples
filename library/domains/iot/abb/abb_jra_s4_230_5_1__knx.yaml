    name: clear_position_set_raw_cmd_c3
    call: -1.0

  # ------------------------------------------------------------------
  # Channel 4
  # ------------------------------------------------------------------
  - function: $in(c4_target_pct)
    name: latch_target_c4
    params:
      raw_pct: "(max(0.0, min(255.0, $in(c4_position_set_raw_cmd))) / 255.0) * 100.0"
    call: (
          max(
            0.0,
            min(
              100.0,
              (100.0 - raw_pct) if $in(invert_position) == 1 else raw_pct,
            ),
