timer:
  time_step: 1.0

actions:
  - function: $in(daylight_active)
    name: detect_daylight
    description: Treat high outdoor brightness as daytime for utility demand physics.
    call: 1 if $in(k__brightness_lux) >= $in(k__daylight_threshold_lux) else 0

  - function: $in(weather_water_boost_l_min)
    name: compute_weather_water_boost
    description: Use central building-physics water demand when provided, otherwise estimate local hot-day demand.
    call: (
          max(0.0, $in(k__external_water_demand_boost_l_min))
          if $in(k__external_water_demand_boost_l_min) > 0.0
          else (
            $in(daylight_active)
            * min(
              max(0.0, $in(k__max_weather_water_boost_l_min)),
              max(0.0, $in(k__outdoor_temperature_c) - $in(k__water_heat_threshold_c))
              * max(0.0, $in(k__water_heat_gain_l_min_per_c))
            )
          )
        )

  - function: $in(water_flow_l_min)
    name: clamp_water_flow
    description: Expose sanitized water flow read from the PFC200 pulse input logic plus weather-driven demand.
    call: max(0.0, $in(k__water_flow_l_min)) + max(0.0, $in(weather_water_boost_l_min))

  - function: $in(gas_flow_m3_h)
    name: clamp_gas_flow
    description: Expose sanitized gas flow read from the PFC200 pulse input logic.
    call: max(0.0, $in(k__gas_flow_m3_h))

  - function: $in(water_total_m3)
    name: integrate_water_total
    description: Integrate cumulative water consumption from current flow.
    call: $in(water_total_m3) + $in(water_flow_l_min) * $in(cycle_time_s) / 60000.0

  - function: $in(gas_total_m3)
    name: integrate_gas_total
    description: Integrate cumulative gas consumption from current flow.
    call: $in(gas_total_m3) + $in(gas_flow_m3_h) * $in(cycle_time_s) / 3600.0

  - function: $in(water_pulse_count)
    name: compute_water_pulse_count
    description: Convert water total to pulse count using configured pulse weight.
    call: int(round($in(water_total_m3) * 1000.0 / max(0.001, $in(k__water_pulse_weight_l))))

  - function: $in(gas_pulse_count)
    name: compute_gas_pulse_count
    description: Convert gas total to pulse count using configured pulse weight.
    call: int(round($in(gas_total_m3) / max(0.000001, $in(k__gas_pulse_weight_m3))))

  - function: $in(gas_energy_total_kwh)
    name: compute_gas_energy_total
    description: Convert metered gas volume into approximate energy equivalent.
    call: $in(gas_total_m3) * max(0.0, $in(k__gas_calorific_value_kwh_m3))

communication:
  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      client_id: "$param(mqtt_client_id)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: spx/utility
      default_qos: 1
      default_retain: false
      birth_topic: availability
      birth_payload: online
      birth_retain: true
      will_topic: availability
      will_payload: offline
      will_retain: true
      bindings:
        - name: water_total_m3
          attribute: $ext(water_total_m3)
          topic: water_total_m3
          direction: publish
          publish_on_change: false
        - name: water_flow_l_min
          attribute: $ext(water_flow_l_min)
          topic: water_flow_l_min
          direction: publish
          publish_on_change: false
        - name: water_pulse_count
          attribute: $ext(water_pulse_count)
          topic: water_pulse_count
          direction: publish
          publish_on_change: false
        - name: weather_water_boost_l_min
          attribute: $ext(weather_water_boost_l_min)
          topic: weather_water_boost_l_min
          direction: publish
          publish_on_change: false
        - name: gas_total_m3
          attribute: $ext(gas_total_m3)
          topic: gas_total_m3
          direction: publish
          publish_on_change: false
        - name: gas_flow_m3_h
          attribute: $ext(gas_flow_m3_h)
          topic: gas_flow_m3_h
          direction: publish
          publish_on_change: false
        - name: gas_pulse_count
          attribute: $ext(gas_pulse_count)
          topic: gas_pulse_count
          direction: publish
          publish_on_change: false
        - name: gas_energy_total_kwh
          attribute: $ext(gas_energy_total_kwh)
          topic: gas_energy_total_kwh
          direction: publish
          publish_on_change: false
        - name: availability
          attribute: $ext(availability)
          topic: availability
          direction: publish
          retain: true
          publish_on_change: false

  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      client_id: "$param(mqtt_discovery_client_id)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: homeassistant
      default_qos: 1
      default_retain: true
      bindings:
        - name: _ha_discovery_water_total_config
          attribute: $ext(_ha_discovery_water_total_config)
          topic: sensor/spx_utility_water_total/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_water_flow_config
          attribute: $ext(_ha_discovery_water_flow_config)
          topic: sensor/spx_utility_water_flow/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_weather_water_boost_config
          attribute: $ext(_ha_discovery_weather_water_boost_config)
          topic: sensor/spx_utility_weather_water_boost/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_gas_total_config
          attribute: $ext(_ha_discovery_gas_total_config)
          topic: sensor/spx_utility_gas_total/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_gas_flow_config
          attribute: $ext(_ha_discovery_gas_flow_config)
          topic: sensor/spx_utility_gas_flow/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_gas_energy_config
          attribute: $ext(_ha_discovery_gas_energy_config)
          topic: sensor/spx_utility_gas_energy_total/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_availability_config
          attribute: $ext(_ha_discovery_availability_config)
          topic: sensor/spx_utility_gateway_availability/config
          direction: publish
          retain: true
          publish_on_change: true

scenarios:
  normal_household_usage:
    display_name: Normal Household Usage
    description: Moderate water flow and small gas consumption.
    duration: 30.0
    overrides:
      $in(k__water_flow_l_min): 4.2
      $in(k__gas_flow_m3_h): 0.35
      $in(k__outdoor_temperature_c): 20.0
      $in(k__brightness_lux): 20000.0

  morning_peak:
    display_name: Morning Peak
    description: Shower/kitchen water usage and heating or hot-water gas demand.
    duration: 30.0
    overrides:
      $in(k__water_flow_l_min): 14.0
      $in(k__gas_flow_m3_h): 1.8
      $in(k__outdoor_temperature_c): 18.0
      $in(k__brightness_lux): 12000.0

  hot_sunny_day:
    display_name: Hot Sunny Day
    description: High daytime temperature increases water demand through irrigation and occupant use.
    duration: 30.0
    overrides:
      $in(k__water_flow_l_min): 4.2
      $in(k__gas_flow_m3_h): 0.15
      $in(k__outdoor_temperature_c): 32.0
      $in(k__brightness_lux): 85000.0

  away_mode:
    display_name: Away Mode
    description: No intentional utility consumption.
    duration: 30.0
    overrides:
      $in(k__water_flow_l_min): 0.0
      $in(k__gas_flow_m3_h): 0.0
      $in(k__outdoor_temperature_c): 16.0
      $in(k__brightness_lux): 0.0
