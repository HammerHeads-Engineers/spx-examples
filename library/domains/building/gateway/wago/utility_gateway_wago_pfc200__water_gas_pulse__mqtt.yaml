name: utility_gateway_wago_pfc200__water_gas_pulse__mqtt
description: |
  WAGO PFC200 utility gateway demo for Smart Building Pack. The model represents
  pulse inputs from a water meter and gas meter, converts them into cumulative
  consumption counters, adds simple weather-driven water demand for hot sunny
  days, and publishes Home Assistant MQTT Discovery sensors.

meta_parameters:
  mqtt_broker_host:
    type: str
    default: mosquitto-server
  mqtt_broker_port:
    type: int
    default: 1883
  mqtt_client_id:
    type: str
    default: spx_utility_gateway_1
  mqtt_discovery_client_id:
    type: str
    default: spx_utility_gateway_1_discovery
  mqtt_publish_interval:
    type: float
    default: 1.0

attributes:
  k__water_flow_l_min:
    type: float
    default: 4.2
    unit: L/min
  k__outdoor_temperature_c:
    type: float
    default: 20.0
    unit: degC
  k__brightness_lux:
    type: float
    default: 20000.0
    unit: lux
  k__daylight_threshold_lux:
    type: float
    default: 10000.0
    unit: lux
  k__water_heat_threshold_c:
    type: float
    default: 24.0
    unit: degC
  k__water_heat_gain_l_min_per_c:
    type: float
    default: 0.55
    unit: L/min/degC
  k__max_weather_water_boost_l_min:
    type: float
    default: 8.0
    unit: L/min
  k__external_water_demand_boost_l_min:
    type: float
    default: 0.0
    unit: L/min
  k__gas_flow_m3_h:
    type: float
    default: 0.35
    unit: m3/h
  k__water_pulse_weight_l:
    type: float
    default: 1.0
    unit: L/pulse
  k__gas_pulse_weight_m3:
    type: float
    default: 0.01
    unit: m3/pulse
  k__gas_calorific_value_kwh_m3:
    type: float
    default: 10.8
    unit: kWh/m3
  water_total_m3:
    type: float
    default: 24.0
    unit: m3
  water_flow_l_min:
    type: float
    default: 4.2
    unit: L/min
  daylight_active:
    type: int
    default: 1
  weather_water_boost_l_min:
    type: float
    default: 0.0
    unit: L/min
  water_pulse_count:
    type: int
    default: 24000
  gas_total_m3:
    type: float
    default: 180.0
    unit: m3
  gas_flow_m3_h:
    type: float
    default: 0.35
    unit: m3/h
  gas_pulse_count:
    type: int
    default: 18000
  gas_energy_total_kwh:
    type: float
    default: 1944.0
    unit: kWh
  availability:
    type: str
    default: online
  cycle_time_s:
    type: float
    default: 1.0
    unit: s
  _ha_discovery_water_total_config:
    type: str
    default: |-
      {
        "name": "Water Total",
        "unique_id": "spx_utility_water_total",
        "state_topic": "spx/utility/water_total_m3",
        "availability_topic": "spx/utility/availability",
        "payload_available": "online",
        "payload_not_available": "offline",
        "unit_of_measurement": "m\u00b3",
        "device_class": "water",
        "state_class": "total_increasing",
        "device": {
          "identifiers": ["wago_pfc200_utility_gateway_1"],
          "manufacturer": "WAGO",
          "model": "PFC200 + Pulse IO (Sim)",
          "name": "WAGO PFC200 Utility Gateway",
          "sw_version": "SPX"
        }
      }
  _ha_discovery_water_flow_config:
    type: str
    default: |-
      {
        "name": "Water Flow",
        "unique_id": "spx_utility_water_flow",
        "state_topic": "spx/utility/water_flow_l_min",
        "availability_topic": "spx/utility/availability",
        "payload_available": "online",
        "payload_not_available": "offline",
        "unit_of_measurement": "L/min",
        "suggested_display_precision": 6,
        "state_class": "measurement",
        "device": {
          "identifiers": ["wago_pfc200_utility_gateway_1"],
          "manufacturer": "WAGO",
          "model": "PFC200 + Pulse IO (Sim)",
          "name": "WAGO PFC200 Utility Gateway",
          "sw_version": "SPX"
        }
      }
  _ha_discovery_weather_water_boost_config:
    type: str
    default: |-
      {
        "name": "Weather Water Boost",
        "unique_id": "spx_utility_weather_water_boost",
        "state_topic": "spx/utility/weather_water_boost_l_min",
        "availability_topic": "spx/utility/availability",
        "payload_available": "online",
        "payload_not_available": "offline",
        "unit_of_measurement": "L/min",
        "state_class": "measurement",
        "device": {
          "identifiers": ["wago_pfc200_utility_gateway_1"],
          "manufacturer": "WAGO",
