name: abb_jra_s4_230_5_1__knx
description: |
  ABB JRA/S 4.230.5.1 (Sim) – 4-channel KNX blind / roller shutter actuator.

  Exposes KNX group objects commonly mapped by Home Assistant KNX covers:
  - move_long (up/down, 1-bit)
  - stop (1-bit)
  - position_set (0..100%, DPT 5.001)
  - position_state (0..100%, DPT 5.001)

  Group address plan (3-level):
  - move_long:      2/1/1 .. 2/1/4
  - stop:           2/2/1 .. 2/2/4
  - position_set:   2/3/1 .. 2/3/4
  - position_state: 2/4/1 .. 2/4/4

meta_parameters:
  knx_router_host:
    type: str
    default: knx_gateway
  knx_router_port:
    type: int
    default: 3671
  knx_poll_interval:
    type: float
    default: 0.2
  ga_main:
    type: str
    default: "2"

attributes:
  invert_move_long:
    type: int
    default: 1
  invert_position:
    type: int
    default: 1
  position_tolerance_pct:
    type: float
    default: 0.5
    unit: percent

  k__c1_position_pct:
    type: float
    default: 10.0
    unit: percent
  k__c1_target_pct:
    type: float
    default: 10.0
    unit: percent
  c1_target_active:
    type: int
    default: 0
  c1_moving:
    type: int
    default: 0
  c1_travel_time_s:
    type: float
    default: 42.0
    unit: s
  c1_move_long_cmd:
    type: int
    default: 2
  c1_stop_cmd:
    type: int
    default: 0
  c1_position_set_raw_cmd:
    type: float
    default: -1.0
  c1_position_state_raw:
    type: int
    default: 26

  k__c2_position_pct:
    type: float
    default: 40.0
    unit: percent
  k__c2_target_pct:
    type: float
    default: 40.0
    unit: percent
  c2_target_active:
    type: int
    default: 0
  c2_moving:
    type: int
    default: 0
  c2_travel_time_s:
    type: float
    default: 42.0
    unit: s
  c2_move_long_cmd:
    type: int
    default: 2
  c2_stop_cmd:
    type: int
    default: 0
  c2_position_set_raw_cmd:
    type: float
    default: -1.0
  c2_position_state_raw:
    type: int
    default: 102

  k__c3_position_pct:
    type: float
    default: 70.0
    unit: percent
  k__c3_target_pct:
    type: float
    default: 70.0
    unit: percent
  c3_target_active:
    type: int
    default: 0
  c3_moving:
    type: int
    default: 0
  c3_travel_time_s:
    type: float
    default: 42.0
    unit: s
  c3_move_long_cmd:
    type: int
    default: 2
  c3_stop_cmd:
    type: int
    default: 0
  c3_position_set_raw_cmd:
    type: float
    default: -1.0
  c3_position_state_raw:
    type: int
    default: 178

  k__c4_position_pct:
    type: float
    default: 0.0
    unit: percent
  k__c4_target_pct:
    type: float
    default: 0.0
    unit: percent
  c4_target_active:
    type: int
    default: 0
  c4_moving:
    type: int
    default: 0
  c4_travel_time_s:
    type: float
    default: 42.0
    unit: s
  c4_move_long_cmd:
    type: int
    default: 2
  c4_stop_cmd:
    type: int
    default: 0
  c4_position_set_raw_cmd:
    type: float
    default: -1.0
  c4_position_state_raw:
    type: int
    default: 0
  _cycle_time_s:
    type: float
    default: 0.2
    unit: s
  
actions:
  # ------------------------------------------------------------------
  # Channel 1
  # ------------------------------------------------------------------
  - function: $in(k__c1_target_pct)
    name: latch_target_c1
    params:
      raw_pct: "(max(0.0, min(255.0, $in(c1_position_set_raw_cmd))) / 255.0) * 100.0"
    call: (
          max(
            0.0,
            min(
              100.0,
              (100.0 - raw_pct) if $in(invert_position) == 1 else raw_pct,
            ),
          )
          if $in(c1_position_set_raw_cmd) >= 0.0
          else $in(k__c1_target_pct)
        )

  - function: $in(c1_target_active)
    name: latch_target_active_c1
    call: (
          1 if $in(c1_position_set_raw_cmd) >= 0.0
          else 0 if $in(c1_move_long_cmd) != 2
          else $in(c1_target_active)
        )

  - function: $in(c1_moving)
    name: apply_commands_c1
    call: (
          0
          if $in(c1_stop_cmd) == 1
          else (
            (
              0
              if abs($in(k__c1_target_pct) - $in(k__c1_position_pct)) <= $in(position_tolerance_pct)
              else (1 if $in(k__c1_target_pct) > $in(k__c1_position_pct) else -1)
            )
            if $in(c1_position_set_raw_cmd) >= 0.0
            else (
              (
                1
                if $in(c1_move_long_cmd) == (0 if $in(invert_move_long) == 1 else 1)
                else -1
              )
              if $in(c1_move_long_cmd) != 2
              else $in(c1_moving)
            )
          )
        )

  - function: $in(k__c1_position_pct)
    name: integrate_position_c1
    params:
      delta_pct: "($in(_cycle_time_s) / max(1.0, $in(c1_travel_time_s))) * 100.0"
    call: (
          (
            min(
              100.0,
              (
                min($in(k__c1_target_pct), $in(k__c1_position_pct) + delta_pct)
                if $in(c1_target_active) == 1
                else ($in(k__c1_position_pct) + delta_pct)
              ),
            )
            if $in(c1_moving) == 1
            else (
              max(
                0.0,
                (
                  max($in(k__c1_target_pct), $in(k__c1_position_pct) - delta_pct)
                  if $in(c1_target_active) == 1
                  else ($in(k__c1_position_pct) - delta_pct)
                ),
              )
              if $in(c1_moving) == -1
              else $in(k__c1_position_pct)
            )
          )
        )

  - function: $in(c1_moving)
    name: stop_when_reached_c1
    call: (
          0
          if (
            ($in(c1_moving) == 1 and $in(k__c1_position_pct) >= 99.9)
            or ($in(c1_moving) == -1 and $in(k__c1_position_pct) <= 0.1)
            or ($in(c1_target_active) == 1 and abs($in(k__c1_target_pct) - $in(k__c1_position_pct)) <= $in(position_tolerance_pct))
          )
          else $in(c1_moving)
        )

  - function: $in(c1_move_long_cmd)
    name: clear_move_long_cmd_c1
    call: 2

  - function: $in(c1_stop_cmd)
    name: clear_stop_cmd_c1
    call: 0

  - function: $in(c1_position_state_raw)
    name: encode_position_state_raw_c1
    params:
      pos_pct: "(100.0 - $in(k__c1_position_pct)) if $in(invert_position) == 1 else $in(k__c1_position_pct)"
    call: round(max(0.0, min(100.0, pos_pct)) * 255.0 / 100.0)

  - function: $in(c1_position_set_raw_cmd)
    name: clear_position_set_raw_cmd_c1
    call: -1.0

  # ------------------------------------------------------------------
  # Channel 2
  # ------------------------------------------------------------------
  - function: $in(k__c2_target_pct)
    name: latch_target_c2
    params:
      raw_pct: "(max(0.0, min(255.0, $in(c2_position_set_raw_cmd))) / 255.0) * 100.0"
    call: (
          max(
            0.0,
            min(
              100.0,
              (100.0 - raw_pct) if $in(invert_position) == 1 else raw_pct,
            ),
          )
          if $in(c2_position_set_raw_cmd) >= 0.0
          else $in(k__c2_target_pct)
        )

  - function: $in(c2_target_active)
    name: latch_target_active_c2
    call: (
          1 if $in(c2_position_set_raw_cmd) >= 0.0
          else 0 if $in(c2_move_long_cmd) != 2
          else $in(c2_target_active)
        )

  - function: $in(c2_moving)
    name: apply_commands_c2
    call: (
          0
          if $in(c2_stop_cmd) == 1
          else (
            (
              0
              if abs($in(k__c2_target_pct) - $in(k__c2_position_pct)) <= $in(position_tolerance_pct)
              else (1 if $in(k__c2_target_pct) > $in(k__c2_position_pct) else -1)
            )
            if $in(c2_position_set_raw_cmd) >= 0.0
            else (
              (
                1
                if $in(c2_move_long_cmd) == (0 if $in(invert_move_long) == 1 else 1)
                else -1
              )
              if $in(c2_move_long_cmd) != 2
              else $in(c2_moving)
            )
          )
        )

  - function: $in(k__c2_position_pct)
    name: integrate_position_c2
    params:
      delta_pct: "($in(_cycle_time_s) / max(1.0, $in(c2_travel_time_s))) * 100.0"
    call: (
          (
            min(
              100.0,
              (
                min($in(k__c2_target_pct), $in(k__c2_position_pct) + delta_pct)
                if $in(c2_target_active) == 1
                else ($in(k__c2_position_pct) + delta_pct)
              ),
            )
            if $in(c2_moving) == 1
            else (
              max(
                0.0,
                (
                  max($in(k__c2_target_pct), $in(k__c2_position_pct) - delta_pct)
                  if $in(c2_target_active) == 1
                  else ($in(k__c2_position_pct) - delta_pct)
                ),
              )
              if $in(c2_moving) == -1
              else $in(k__c2_position_pct)
            )
          )
        )

  - function: $in(c2_moving)
    name: stop_when_reached_c2
    call: (
          0
          if (
            ($in(c2_moving) == 1 and $in(k__c2_position_pct) >= 99.9)
            or ($in(c2_moving) == -1 and $in(k__c2_position_pct) <= 0.1)
            or ($in(c2_target_active) == 1 and abs($in(k__c2_target_pct) - $in(k__c2_position_pct)) <= $in(position_tolerance_pct))
          )
          else $in(c2_moving)
        )

  - function: $in(c2_move_long_cmd)
    name: clear_move_long_cmd_c2
    call: 2

  - function: $in(c2_stop_cmd)
    name: clear_stop_cmd_c2
    call: 0

  - function: $in(c2_position_state_raw)
    name: encode_position_state_raw_c2
    params:
      pos_pct: "(100.0 - $in(k__c2_position_pct)) if $in(invert_position) == 1 else $in(k__c2_position_pct)"
    call: round(max(0.0, min(100.0, pos_pct)) * 255.0 / 100.0)

  - function: $in(c2_position_set_raw_cmd)
    name: clear_position_set_raw_cmd_c2
    call: -1.0

  # ------------------------------------------------------------------
  # Channel 3
  # ------------------------------------------------------------------
  - function: $in(k__c3_target_pct)
    name: latch_target_c3
    params:
      raw_pct: "(max(0.0, min(255.0, $in(c3_position_set_raw_cmd))) / 255.0) * 100.0"
    call: (
          max(
            0.0,
            min(
              100.0,
              (100.0 - raw_pct) if $in(invert_position) == 1 else raw_pct,
            ),
          )
          if $in(c3_position_set_raw_cmd) >= 0.0
          else $in(k__c3_target_pct)
        )

  - function: $in(c3_target_active)
    name: latch_target_active_c3
    call: (
          1 if $in(c3_position_set_raw_cmd) >= 0.0
          else 0 if $in(c3_move_long_cmd) != 2
          else $in(c3_target_active)
        )

  - function: $in(c3_moving)
    name: apply_commands_c3
    call: (
          0
          if $in(c3_stop_cmd) == 1
          else (
            (
              0
              if abs($in(k__c3_target_pct) - $in(k__c3_position_pct)) <= $in(position_tolerance_pct)
              else (1 if $in(k__c3_target_pct) > $in(k__c3_position_pct) else -1)
            )
            if $in(c3_position_set_raw_cmd) >= 0.0
            else (
              (
                1
                if $in(c3_move_long_cmd) == (0 if $in(invert_move_long) == 1 else 1)
                else -1
              )
              if $in(c3_move_long_cmd) != 2
              else $in(c3_moving)
            )
          )
        )

  - function: $in(k__c3_position_pct)
    name: integrate_position_c3
    params:
      delta_pct: "($in(_cycle_time_s) / max(1.0, $in(c3_travel_time_s))) * 100.0"
    call: (
          (
            min(
              100.0,
              (
                min($in(k__c3_target_pct), $in(k__c3_position_pct) + delta_pct)
                if $in(c3_target_active) == 1
                else ($in(k__c3_position_pct) + delta_pct)
              ),
            )
            if $in(c3_moving) == 1
            else (
              max(
                0.0,
