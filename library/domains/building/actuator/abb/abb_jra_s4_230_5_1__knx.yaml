  - function: $in(c3_moving)
    name: stop_when_reached_c3
    call: (
          0
          if (
            ($in(c3_moving) == 1 and $in(k__c3_position_pct) >= 99.9)
            or ($in(c3_moving) == -1 and $in(k__c3_position_pct) <= 0.1)
            or ($in(c3_target_active) == 1 and abs($in(k__c3_target_pct) - $in(k__c3_position_pct)) <= $in(position_tolerance_pct))
