# SPDX-License-Identifier: MIT
name: siglent_sdg1032x__scpi
description: |
  Virtual Siglent SDG1000X series function generator (modeled after SDG1032X)
  exposing basic waveform and output SCPI commands over ASCII/TCP.

attributes:
  idn:
    type: str
    default: "SIGLENT,SDG1032X,SDG1X00000000,1.01"

  k__ch1_waveform:
    type: str
    default: "SINE"
  k__ch1_frequency_hz:
    type: float
    default: 1000.0
    unit: Hz
  k__ch1_amplitude_vpp:
    type: float
    default: 2.0
    unit: Vpp
  k__ch1_offset_v:
    type: float
    default: 0.0
    unit: V
  k__ch1_output_state:
    type: str
    default: "OFF"

  k__ch2_waveform:
    type: str
    default: "SINE"
  k__ch2_frequency_hz:
    type: float
    default: 1000.0
    unit: Hz
  k__ch2_amplitude_vpp:
    type: float
    default: 2.0
    unit: Vpp
  k__ch2_offset_v:
    type: float
    default: 0.0
    unit: V
  k__ch2_output_state:
    type: str
    default: "OFF"

  ch1_period_s:
    type: float
    default: 0.001
    unit: s
  ch2_period_s:
    type: float
    default: 0.001
    unit: s
  ch1_basic_wave_status:
    type: str
    default: "C1:BSWV WVTP,SINE,FRQ,1000HZ,PERI,0.001S,AMP,2V,OFST,0V"
  ch2_basic_wave_status:
    type: str
    default: "C2:BSWV WVTP,SINE,FRQ,1000HZ,PERI,0.001S,AMP,2V,OFST,0V"
  ch1_output_status:
    type: str
    default: "C1:OUTP OFF,LOAD,HZ,PLRT,NOR"
  ch2_output_status:
    type: str
    default: "C2:OUTP OFF,LOAD,HZ,PLRT,NOR"

actions:
  - function: $in(ch1_period_s)
    name: update_ch1_period
    description: Convert channel 1 frequency into period for status reporting.
    call: (1.0 / $in(k__ch1_frequency_hz) if $in(k__ch1_frequency_hz) > 0.0 else 0.0)
  - function: $in(ch2_period_s)
    name: update_ch2_period
    description: Convert channel 2 frequency into period for status reporting.
    call: (1.0 / $in(k__ch2_frequency_hz) if $in(k__ch2_frequency_hz) > 0.0 else 0.0)

  - function: $in(ch1_basic_wave_status)
    name: update_ch1_basic_wave_status
    description: Render the channel 1 waveform configuration into the SDG status string.
    call: |
      "C1:BSWV WVTP,{wave},FRQ,{freq}HZ,PERI,{period}S,AMP,{amp}V,OFST,{offset}V".format(
        wave=$in(k__ch1_waveform),
        freq=$in(k__ch1_frequency_hz),
        period=$in(ch1_period_s),
        amp=$in(k__ch1_amplitude_vpp),
        offset=$in(k__ch1_offset_v),
      )
  - function: $in(ch2_basic_wave_status)
    name: update_ch2_basic_wave_status
    description: Render the channel 2 waveform configuration into the SDG status string.
    call: |
      "C2:BSWV WVTP,{wave},FRQ,{freq}HZ,PERI,{period}S,AMP,{amp}V,OFST,{offset}V".format(
        wave=$in(k__ch2_waveform),
        freq=$in(k__ch2_frequency_hz),
        period=$in(ch2_period_s),
        amp=$in(k__ch2_amplitude_vpp),
        offset=$in(k__ch2_offset_v),
      )

  - function: $in(ch1_output_status)
    name: update_ch1_output_status
    description: Mirror the channel 1 output state in the SCPI status response.
    call: |
      "C1:OUTP {state},LOAD,HZ,PLRT,NOR".format(state=$in(k__ch1_output_state))
  - function: $in(ch2_output_status)
    name: update_ch2_output_status
    description: Mirror the channel 2 output state in the SCPI status response.
    call: |
      "C2:OUTP {state},LOAD,HZ,PLRT,NOR".format(state=$in(k__ch2_output_state))

communication:
  - ascii:
      # Port is auto-assigned at runtime (starting from 5025) to avoid collisions.
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?": "#out(idn)"

        "C1:OUTP ON":
          "#attr(k__ch1_output_state)": "ON"
        "C1:OUTP OFF":
          "#attr(k__ch1_output_state)": "OFF"
        "C1:OUTP?": "#out(ch1_output_status)"

        "C2:OUTP ON":
          "#attr(k__ch2_output_state)": "ON"
        "C2:OUTP OFF":
          "#attr(k__ch2_output_state)": "OFF"
        "C2:OUTP?": "#out(ch2_output_status)"

        "C1:BSWV WVTP,{wave}":
          "#attr(k__ch1_waveform)": "wave"
        "C1:BSWV FRQ,{frequency}":
          "#attr(k__ch1_frequency_hz)": "frequency"
        "C1:BSWV AMP,{amplitude}":
          "#attr(k__ch1_amplitude_vpp)": "amplitude"
        "C1:BSWV OFST,{offset}":
          "#attr(k__ch1_offset_v)": "offset"
        "C1:BSWV?": "#out(ch1_basic_wave_status)"

        "C2:BSWV WVTP,{wave}":
          "#attr(k__ch2_waveform)": "wave"
        "C2:BSWV FRQ,{frequency}":
          "#attr(k__ch2_frequency_hz)": "frequency"
        "C2:BSWV AMP,{amplitude}":
          "#attr(k__ch2_amplitude_vpp)": "amplitude"
        "C2:BSWV OFST,{offset}":
          "#attr(k__ch2_offset_v)": "offset"
        "C2:BSWV?": "#out(ch2_basic_wave_status)"
