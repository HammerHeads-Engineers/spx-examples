# SPDX-License-Identifier: MIT
name: multimeter__scpi
description: |
  Virtual SCPI multimeter providing a compact set of measurement and
  configuration commands for integration testing. The model exposes core
  electrical quantities as attributes and maps common SCPI verbs via the
  ASCII protocol.

attributes:
  voltage:
    type: float
    default: 0.0
    unit: V
  current:
    type: float
    default: 0.0
    unit: A
  resistance:
    type: float
    default: 1000.0
    unit: ohm
  frequency:
    type: float
    default: 50.0
    unit: Hz
  measurement_mode:
    type: str
    default: "voltage"

communication:
  ascii:
    # Port is auto-assigned at runtime (starting from 5025) to avoid collisions.
    terminator: "\n"
    response_delay: 0.01
    response_jitter: 0.0
    mappings:
      "MEAS:VOLT?": "#out(voltage)"
      "MEAS:CURR?": "#out(current)"
      "MEAS:RES?": "#out(resistance)"
      "MEAS:FREQ?": "#out(frequency)"
      "CONF:VOLT":
        "#attr(measurement_mode)": voltage
      "CONF:CURR":
        "#attr(measurement_mode)": current
      "CONF:RES":
        "#attr(measurement_mode)": resistance
      "CONF:FREQ":
        "#attr(measurement_mode)": frequency
      "CONF:MODE {mode}":
        "#attr(measurement_mode)": "mode"
        "response": "ACK"

scenarios:
  voltage_static:
    name: Voltage Static
    display_name: "Voltage Static"
    enabled: true
    description: |
      Slews the measured voltage toward a target value using a bounded
      velocity integrator, then injects a tiny dither to emulate ADC noise.
    period: 0.1
    actions:
      - function: $in(voltage)
        call: target_voltage
        target_voltage: 230.0
      - noise: $out(voltage)
        std: 5.0e-3
        mode: proportional

  ascii_disconnect:
    name: ASCII Disconnect
    display_name: "ASCII Disconnect"
    description: Temporarily detaches the ASCII transport to exercise reconnect handling.
    enabled: true
    duration: 2.0
    call:
      path: communication.ascii.detach
      stop_path: communication.ascii.attach

  ascii_response_delay_spike:
    name: ASCII Response Delay Spike
    display_name: "ASCII Response Delay Spike"
    description: Increases response latency to emulate an overloaded instrument.
    enabled: true
    duration: 5.0
    overrides:
      communication.ascii.response_delay: 10.0

  discharge_spike:
    name: Discharge Spike
    display_name: "Discharge Spike"
    description: Forces a one-shot voltage spike to emulate a transient event.
    enabled: true
    run_limit: 1
    overrides:
      $out(voltage): 1000.0
