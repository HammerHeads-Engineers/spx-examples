name: rohde_schwarz_hmc8012__scpi
description: |
  Virtual Rohde & Schwarz HMC8012 digital multimeter with a focused SCPI
  command set for DC voltage/current, resistance, frequency, and period reads.

attributes:
  idn:
    type: str
    default: "Rohde&Schwarz,HMC8012,0000000000,1.00"

  k__mode:
    type: str
    default: "VOLT:DC"
  k__range_v:
    type: float
    default: 10.0
    unit: V
  k__range_a:
    type: float
    default: 1.0
    unit: A
  k__range_ohm:
    type: float
    default: 1000.0
    unit: ohm

  voltage_dc_v:
    type: float
    default: 1.234
    unit: V
  current_dc_a:
    type: float
    default: 0.123
    unit: A
  resistance_ohm:
    type: float
    default: 1000.0
    unit: ohm
  frequency_hz:
    type: float
    default: 1000.0
    unit: Hz
  period_s:
    type: float
    default: 0.001
    unit: s

  readback_value:
    type: float
    default: 1.234
  error_status:
    type: str
    default: "0,No error"

actions:
  - function: $in(readback_value)
    name: update_readback
    description: Select the active measurement register based on the configured function.
    call: |
      (lambda mode, v, i, r, f, p:
        v if mode == "VOLT:DC"
        else i if mode == "CURR:DC"
        else r if mode == "RES"
        else f if mode == "FREQ"
        else p if mode == "PER"
        else v
      )(
        $in(k__mode),
        $in(voltage_dc_v),
        $in(current_dc_a),
        $in(resistance_ohm),
        $in(frequency_hz),
        $in(period_s),
      )

communication:
  - ascii:
      # Port is auto-assigned at runtime (starting from 5025) to avoid collisions.
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?": "#out(idn)"

        "CONF:VOLT:DC":
          "#attr(k__mode)": "VOLT:DC"
        "CONF:VOLT:DC {range}":
          "#attr(k__mode)": "VOLT:DC"
          "#attr(k__range_v)": "range"

        "CONF:CURR:DC":
          "#attr(k__mode)": "CURR:DC"
        "CONF:CURR:DC {range}":
          "#attr(k__mode)": "CURR:DC"
          "#attr(k__range_a)": "range"

        "CONF:RES":
          "#attr(k__mode)": "RES"
        "CONF:RES {range}":
          "#attr(k__mode)": "RES"
          "#attr(k__range_ohm)": "range"

        "CONF:FREQ":
          "#attr(k__mode)": "FREQ"
        "CONF:PER":
          "#attr(k__mode)": "PER"

        "MEAS:VOLT:DC?": "#out(voltage_dc_v)"
        "MEAS:CURR:DC?": "#out(current_dc_a)"
        "MEAS:RES?": "#out(resistance_ohm)"
        "MEAS:FREQ?": "#out(frequency_hz)"
        "MEAS:PER?": "#out(period_s)"
        "READ?": "#out(readback_value)"

        "SYST:ERR?": "#out(error_status)"
