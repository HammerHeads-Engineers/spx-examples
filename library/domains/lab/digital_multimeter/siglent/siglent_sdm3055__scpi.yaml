# SPDX-License-Identifier: MIT
name: siglent_sdm3055__scpi
description: |
  Virtual Siglent SDM3055 digital multimeter exposing a compact SCPI command
  set for DC voltage/current, resistance, frequency, and period measurements.

meta_parameters:
  ascii_port:
    type: int
    default: 0

attributes:
  idn:
    type: str
    default: "SIGLENT,SDM3055,SDM3055S0000000,1.01"

  k__mode:
    type: str
    default: "VOLT:DC"
  k__range_v:
    type: float
    default: 10.0
    unit: V
  k__range_a:
    type: float
    default: 1.0
    unit: A
  k__range_ohm:
    type: float
    default: 1000.0
    unit: ohm

  voltage_dc_v:
    type: float
    default: 1.234
    unit: V
  current_dc_a:
    type: float
    default: 0.123
    unit: A
  resistance_ohm:
    type: float
    default: 1000.0
    unit: ohm
  frequency_hz:
    type: float
    default: 1000.0
    unit: Hz
  period_s:
    type: float
    default: 0.001
    unit: s

  readback_value:
    type: float
    default: 1.234
  error_status:
    type: str
    default: "0,No error"

actions:
  - function: $in(readback_value)
    name: update_readback
    description: Select the active measurement register based on the configured function.
    call: |
      (lambda mode, v, i, r, f, p:
        v if mode == "VOLT:DC"
        else i if mode == "CURR:DC"
        else r if mode == "RES"
        else f if mode == "FREQ"
        else p if mode == "PER"
        else v
      )(
        $in(k__mode),
        $in(voltage_dc_v),
        $in(current_dc_a),
        $in(resistance_ohm),
        $in(frequency_hz),
        $in(period_s),
      )

communication:
  - ascii:
      # Port can be overridden via ascii_port; 0 keeps runtime auto-assignment.
      port: "$param(ascii_port)"
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?":
          name: query_idn
          response: "#out(idn)"

        "CONF:VOLT:DC":
          name: configure_voltage_dc
          "#attr(k__mode)": "VOLT:DC"
        "CONF:VOLT:DC {range}":
          name: configure_voltage_dc_range
          "#attr(k__mode)": "VOLT:DC"
          "#attr(k__range_v)": "range"

        "CONF:CURR:DC":
          name: configure_current_dc
          "#attr(k__mode)": "CURR:DC"
        "CONF:CURR:DC {range}":
          name: configure_current_dc_range
          "#attr(k__mode)": "CURR:DC"
          "#attr(k__range_a)": "range"

        "CONF:RES":
          name: configure_resistance
          "#attr(k__mode)": "RES"
        "CONF:RES {range}":
          name: configure_resistance_range
          "#attr(k__mode)": "RES"
          "#attr(k__range_ohm)": "range"

        "CONF:FREQ":
          name: configure_frequency
          "#attr(k__mode)": "FREQ"
        "CONF:PER":
          name: configure_period
          "#attr(k__mode)": "PER"

        "MEAS:VOLT:DC?":
          name: query_measurement_voltage_dc
          response: "#out(voltage_dc_v)"
        "MEAS:CURR:DC?":
          name: query_measurement_current_dc
          response: "#out(current_dc_a)"
        "MEAS:RES?":
          name: query_measurement_resistance
          response: "#out(resistance_ohm)"
        "MEAS:FREQ?":
          name: query_measurement_frequency
          response: "#out(frequency_hz)"
        "MEAS:PER?":
          name: query_measurement_period
          response: "#out(period_s)"
        "READ?":
          name: query_readback
          response: "#out(readback_value)"

        "SYST:ERR?":
          name: query_system_error
          response: "#out(error_status)"
