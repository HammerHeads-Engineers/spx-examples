# SPDX-License-Identifier: MIT
name: digital_multimeter__scpi
description: |
  Generic SCPI digital multimeter with DC voltage and resistance measurements,
  plus simple configuration commands for ASCII-over-TCP demos.

meta_parameters:
  ascii_port:
    type: int
    default: 0

attributes:
  idn:
    type: str
    default: "SPX,DMM,DMM0001,1.0"

  k__mode:
    type: str
    default: "VOLT:DC"
  k__range_v:
    type: float
    default: 10.0
    unit: V

  voltage_readback_v:
    type: float
    default: 1.234
    unit: V
  resistance_readback_ohm:
    type: float
    default: 1000.0
    unit: ohm
  readback_value:
    type: float
    default: 1.234

  error_status:
    type: str
    default: "0,No error"

actions:
  - function: $in(readback_value)
    name: update_readback
    description: Select the active readback based on the configured DMM mode.
    call: |
      ($in(voltage_readback_v)
       if $in(k__mode) == "VOLT:DC"
       else $in(resistance_readback_ohm))

communication:
  - ascii:
      # Port can be overridden via ascii_port; 0 keeps runtime auto-assignment.
      port: "$param(ascii_port)"
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?":
          name: query_idn
          response: "#out(idn)"

        "CONF:VOLT:DC":
          name: configure_voltage_dc
          "#attr(k__mode)": "VOLT:DC"
        "CONF:VOLT:DC {range}":
          name: configure_voltage_dc_range
          "#attr(k__mode)": "VOLT:DC"
          "#attr(k__range_v)": "range"

        "MEAS:VOLT:DC?":
          name: query_measurement_voltage_dc
          response: "#out(voltage_readback_v)"
        "MEAS:RES?":
          name: query_measurement_resistance
          response: "#out(resistance_readback_ohm)"
        "READ?":
          name: query_readback
          response: "#out(readback_value)"

        "SYST:ERR?":
          name: query_system_error
          response: "#out(error_status)"
