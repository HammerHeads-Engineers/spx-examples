name: digital_multimeter__scpi
description: |
  Generic SCPI digital multimeter with DC voltage and resistance measurements,
  plus simple configuration commands for ASCII-over-TCP demos.

attributes:
  idn:
    type: str
    default: "SPX,DMM,DMM0001,1.0"

  k__mode:
    type: str
    default: "VOLT:DC"
  k__range_v:
    type: float
    default: 10.0
    unit: V

  voltage_readback_v:
    type: float
    default: 1.234
    unit: V
  resistance_readback_ohm:
    type: float
    default: 1000.0
    unit: ohm
  readback_value:
    type: float
    default: 1.234

  error_status:
    type: str
    default: "0,No error"

actions:
  - function: $in(readback_value)
    name: update_readback
    description: Select the active readback based on the configured DMM mode.
    call: |
      ($in(voltage_readback_v)
       if $in(k__mode) == "VOLT:DC"
       else $in(resistance_readback_ohm))

communication:
  - ascii:
      # Port is auto-assigned at runtime (starting from 5025) to avoid collisions.
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?": "#out(idn)"

        "CONF:VOLT:DC":
          "#attr(k__mode)": "VOLT:DC"
        "CONF:VOLT:DC {range}":
          "#attr(k__mode)": "VOLT:DC"
          "#attr(k__range_v)": "range"

        "MEAS:VOLT:DC?": "#out(voltage_readback_v)"
        "MEAS:RES?": "#out(resistance_readback_ohm)"
        "READ?": "#out(readback_value)"

        "SYST:ERR?": "#out(error_status)"
