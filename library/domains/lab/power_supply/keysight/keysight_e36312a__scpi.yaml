# SPDX-License-Identifier: MIT
name: keysight_e36312a__scpi
description: |
  Keysight E36312A triple-output DC power supply model driven by SCPI
  (ASCII/TCP). The model exposes per-channel voltage/current setpoints and
  output state to support lab automation workflows.

meta_parameters:
  ascii_port:
    type: int
    default: 0

attributes:
  idn:
    type: str
    default: "KEYSIGHT TECHNOLOGIES,E36312A,MY00000000,1.0"

  k__selected_output:
    type: int
    default: 1

  k__ch1_voltage_set_v:
    type: float
    default: 5.0
    unit: V
  k__ch1_current_limit_a:
    type: float
    default: 1.0
    unit: A
  k__ch1_output_state:
    type: int
    default: 0
  ch1_voltage_readback_v:
    type: float
    default: 0.0
    unit: V
  ch1_current_readback_a:
    type: float
    default: 0.0
    unit: A

  k__ch2_voltage_set_v:
    type: float
    default: 12.0
    unit: V
  k__ch2_current_limit_a:
    type: float
    default: 0.5
    unit: A
  k__ch2_output_state:
    type: int
    default: 0
  ch2_voltage_readback_v:
    type: float
    default: 0.0
    unit: V
  ch2_current_readback_a:
    type: float
    default: 0.0
    unit: A

  k__ch3_voltage_set_v:
    type: float
    default: 12.0
    unit: V
  k__ch3_current_limit_a:
    type: float
    default: 0.5
    unit: A
  k__ch3_output_state:
    type: int
    default: 0
  ch3_voltage_readback_v:
    type: float
    default: 0.0
    unit: V
  ch3_current_readback_a:
    type: float
    default: 0.0
    unit: A

  error_status:
    type: str
    default: '0,"No error"'

actions:
  - function: $in(ch1_voltage_readback_v)
    name: update_ch1_voltage
    description: Mirror channel 1 set voltage when the output is enabled.
    call: ($in(k__ch1_voltage_set_v) if $in(k__ch1_output_state) == 1 else 0.0)
  - function: $in(ch1_current_readback_a)
    name: update_ch1_current
    description: Mirror channel 1 current limit as measured current when enabled.
    call: ($in(k__ch1_current_limit_a) if $in(k__ch1_output_state) == 1 else 0.0)
  - function: $in(ch2_voltage_readback_v)
    name: update_ch2_voltage
    description: Mirror channel 2 set voltage when the output is enabled.
    call: ($in(k__ch2_voltage_set_v) if $in(k__ch2_output_state) == 1 else 0.0)
  - function: $in(ch2_current_readback_a)
    name: update_ch2_current
    description: Mirror channel 2 current limit as measured current when enabled.
    call: ($in(k__ch2_current_limit_a) if $in(k__ch2_output_state) == 1 else 0.0)
  - function: $in(ch3_voltage_readback_v)
    name: update_ch3_voltage
    description: Mirror channel 3 set voltage when the output is enabled.
    call: ($in(k__ch3_voltage_set_v) if $in(k__ch3_output_state) == 1 else 0.0)
  - function: $in(ch3_current_readback_a)
    name: update_ch3_current
    description: Mirror channel 3 current limit as measured current when enabled.
    call: ($in(k__ch3_current_limit_a) if $in(k__ch3_output_state) == 1 else 0.0)

communication:
  - ascii:
      # Port can be overridden via ascii_port; 0 keeps runtime auto-assignment.
      port: "$param(ascii_port)"
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?":
          name: query_idn
          response: "#out(idn)"
        ":SYSTem:ERRor?":
          name: query_system_error
          response: "#out(error_status)"

        ":INSTrument:NSELect {channel}":
          name: select_channel
          "#attr(k__selected_output)": "channel"
          response: "OK"
        ":INSTrument:NSELect?":
          name: query_selected_channel
          response: "#out(k__selected_output)"

        ":SOURce:VOLTage {voltage}, (@1)":
          name: set_channel_1_voltage
          response: ""
          "#attr(k__ch1_voltage_set_v)": "voltage"
        ":SOURce:CURRent {current}, (@1)":
          name: set_channel_1_current_limit
          response: ""
          "#attr(k__ch1_current_limit_a)": "current"
        ":SOURce:VOLTage? (@1)":
          name: query_channel_1_voltage
          response: "#out(k__ch1_voltage_set_v)"
        ":SOURce:CURRent? (@1)":
          name: query_channel_1_current_limit
          response: "#out(k__ch1_current_limit_a)"

        ":SOURce:VOLTage {voltage}, (@2)":
          name: set_channel_2_voltage
          response: ""
          "#attr(k__ch2_voltage_set_v)": "voltage"
        ":SOURce:CURRent {current}, (@2)":
          name: set_channel_2_current_limit
          response: ""
          "#attr(k__ch2_current_limit_a)": "current"
        ":SOURce:VOLTage? (@2)":
          name: query_channel_2_voltage
          response: "#out(k__ch2_voltage_set_v)"
        ":SOURce:CURRent? (@2)":
          name: query_channel_2_current_limit
          response: "#out(k__ch2_current_limit_a)"

        ":SOURce:VOLTage {voltage}, (@3)":
          name: set_channel_3_voltage
          response: ""
          "#attr(k__ch3_voltage_set_v)": "voltage"
        ":SOURce:CURRent {current}, (@3)":
          name: set_channel_3_current_limit
          response: ""
          "#attr(k__ch3_current_limit_a)": "current"
        ":SOURce:VOLTage? (@3)":
          name: query_channel_3_voltage
          response: "#out(k__ch3_voltage_set_v)"
        ":SOURce:CURRent? (@3)":
          name: query_channel_3_current_limit
          response: "#out(k__ch3_current_limit_a)"

        ":OUTPut ON, (@1)":
          name: enable_channel_1_output
          response: ""
          "#attr(k__ch1_output_state)": 1
        ":OUTPut OFF, (@1)":
          name: disable_channel_1_output
          response: ""
          "#attr(k__ch1_output_state)": 0
        ":OUTPut? (@1)":
          name: query_channel_1_output
          response: "#out(k__ch1_output_state)"

        ":OUTPut ON, (@2)":
          name: enable_channel_2_output
          response: ""
          "#attr(k__ch2_output_state)": 1
        ":OUTPut OFF, (@2)":
          name: disable_channel_2_output
          response: ""
          "#attr(k__ch2_output_state)": 0
        ":OUTPut? (@2)":
          name: query_channel_2_output
          response: "#out(k__ch2_output_state)"

        ":OUTPut ON, (@3)":
          name: enable_channel_3_output
          response: ""
          "#attr(k__ch3_output_state)": 1
        ":OUTPut OFF, (@3)":
          name: disable_channel_3_output
          response: ""
          "#attr(k__ch3_output_state)": 0
        ":OUTPut? (@3)":
          name: query_channel_3_output
          response: "#out(k__ch3_output_state)"

        ":MEASure:VOLTage? CH1":
          name: query_channel_1_voltage_readback
          response: "#out(ch1_voltage_readback_v)"
        ":MEASure:CURRent? CH1":
          name: query_channel_1_current_readback
          response: "#out(ch1_current_readback_a)"
        ":MEASure:VOLTage? CH2":
          name: query_channel_2_voltage_readback
          response: "#out(ch2_voltage_readback_v)"
        ":MEASure:CURRent? CH2":
          name: query_channel_2_current_readback
          response: "#out(ch2_current_readback_a)"
        ":MEASure:VOLTage? CH3":
          name: query_channel_3_voltage_readback
          response: "#out(ch3_voltage_readback_v)"
        ":MEASure:CURRent? CH3":
          name: query_channel_3_current_readback
          response: "#out(ch3_current_readback_a)"
