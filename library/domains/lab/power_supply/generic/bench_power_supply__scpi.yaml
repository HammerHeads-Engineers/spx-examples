# SPDX-License-Identifier: MIT
name: bench_power_supply__scpi
description: |
  Generic bench power supply with a compact SCPI command set for
  ASCII-over-TCP integration tests and demos.

meta_parameters:
  ascii_port:
    type: int
    default: 0

attributes:
  idn:
    type: str
    default: "SPX,BENCH_PSU,PSU0001,1.0"

  k__voltage_set_v:
    type: float
    default: 5.0
    unit: V
  k__current_set_a:
    type: float
    default: 1.0
    unit: A
  k__output_state:
    type: str
    default: "OFF"

  voltage_readback_v:
    type: float
    default: 0.0
    unit: V
  current_readback_a:
    type: float
    default: 0.0
    unit: A

  error_status:
    type: str
    default: "0,No error"

actions:
  - function: $in(voltage_readback_v)
    name: update_voltage_readback
    description: Mirror the programmed voltage when output is enabled, else clamp to zero.
    call: ($in(k__voltage_set_v) if $in(k__output_state) == "ON" else 0.0)
  - function: $in(current_readback_a)
    name: update_current_readback
    description: Mirror the programmed current limit when output is enabled, else clamp to zero.
    call: ($in(k__current_set_a) if $in(k__output_state) == "ON" else 0.0)

communication:
  - ascii:
      # Port can be overridden via ascii_port; 0 keeps runtime auto-assignment.
      port: "$param(ascii_port)"
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?":
          name: query_idn
          response: "#out(idn)"

        "SOUR:VOLT {voltage}":
          name: set_voltage
          response: null
          "#attr(k__voltage_set_v)": "voltage"
        "SOUR:CURR {current}":
          name: set_current
          response: null
          "#attr(k__current_set_a)": "current"

        "SOUR:VOLT?":
          name: query_voltage
          response: "#out(k__voltage_set_v)"
        "SOUR:CURR?":
          name: query_current
          response: "#out(k__current_set_a)"

        "MEAS:VOLT?":
          name: query_voltage_readback
          response: "#out(voltage_readback_v)"
        "MEAS:CURR?":
          name: query_current_readback
          response: "#out(current_readback_a)"

        "OUTP ON":
          name: enable_output
          response: null
          "#attr(k__output_state)": "ON"
        "OUTP OFF":
          name: disable_output
          response: null
          "#attr(k__output_state)": "OFF"
        "OUTP?":
          name: query_output
          response: "#out(k__output_state)"

        "SYST:ERR?":
          name: query_system_error
          response: "#out(error_status)"
