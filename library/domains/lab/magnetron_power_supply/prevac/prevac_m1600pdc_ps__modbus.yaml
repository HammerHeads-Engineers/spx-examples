# SPDX-License-Identifier: MIT

name: prevac_m1600pdc_ps__modbus
description: |
  Prevac M1600PDC-PS pulse DC magnetron power supply with Modbus RTU/TCP register map.
  Mapping follows the user manual register table (rev. 01, Nov 2025).

meta_parameters:
  modbus_port:
    type: int
    default: 5611
  modbus_unit_id:
    type: int
    default: 11

attributes:
  device_state:
    type: int
    default: 0
  status_word_1:
    type: int
    default: 0
  status_word_2:
    type: int
    default: 0
  switch_to_operate_allowed:
    type: int
    default: 17

  magnetron_power_w:
    type: float
    default: 0.0
    unit: W
  magnetron_voltage_v:
    type: float
    default: 0.0
    unit: V
  magnetron_current_ma:
    type: float
    default: 0.0
    unit: mA
  thickness_nm:
    type: float
    default: 0.0
    unit: nm
  rate_nm_s:
    type: float
    default: 0.0
    unit: nm/s
  flow_sccm:
    type: float
    default: 0.0
    unit: sccm

  k__working_mode:
    type: int
    default: 0
  cmd__go_to_operate:
    type: int
    default: 0
  cmd__go_to_standby:
    type: int
    default: 0

  k__power_set_w:
    type: float
    default: 200.0
    unit: W
  k__voltage_set_v:
    type: float
    default: 500.0
    unit: V
  k__current_set_ma:
    type: float
    default: 500.0
    unit: mA
  k__frequency_khz:
    type: float
    default: 100.0
    unit: kHz
  k__pulse_duration_us:
    type: float
    default: 2.0
    unit: us
  k__flow_set_sccm:
    type: float
    default: 10.0
    unit: sccm

  cmd__shutter_1_open:
    type: int
    default: 0
  cmd__shutter_1_close:
    type: int
    default: 0
  cmd__shutter_2_open:
    type: int
    default: 0
  cmd__shutter_2_close:
    type: int
    default: 0
  cmd__shutter_3_open:
    type: int
    default: 0
  cmd__shutter_3_close:
    type: int
    default: 0

  cmd__valve_open:
    type: int
    default: 0
  cmd__valve_close:
    type: int
    default: 0
  cmd__clear_thickness:
    type: int
    default: 0

  k__power_limit_output_1_w:
    type: int
    default: 600
    unit: W
  k__power_limit_output_2_w:
    type: int
    default: 600
    unit: W
  k__power_limit_output_3_w:
    type: int
    default: 600
    unit: W
  k__voltage_limit_output_1_v:
    type: int
    default: 1200
    unit: V
  k__voltage_limit_output_2_v:
    type: int
    default: 1200
    unit: V
  k__voltage_limit_output_3_v:
    type: int
    default: 1200
    unit: V
  k__current_limit_output_1_ma:
    type: int
    default: 3000
    unit: mA
  k__current_limit_output_2_ma:
    type: int
    default: 3000
    unit: mA
  k__current_limit_output_3_ma:
    type: int
    default: 3000
    unit: mA

  k__power_ramp_w_s:
    type: int
    default: 200
    unit: W/s
  k__voltage_ramp_v_s:
    type: int
    default: 200
    unit: V/s
  k__current_ramp_ma_s:
    type: int
    default: 200
    unit: mA/s

  k__vacuum_interlock_mode:
    type: int
    default: 0
  k__arc_detect_enabled:
    type: int
    default: 1
  k__arc_detect_time_us:
    type: int
    default: 50
    unit: us
  k__arc_off_time_ms:
    type: int
    default: 100
    unit: ms
  k__arc_limit_enabled:
    type: int
    default: 0
  k__arc_limit_value:
    type: int
    default: 1000

  k__shutter_control_internal:
    type: int
    default: 1
  k__shutter_1_mode:
    type: int
    default: 1
  k__shutter_1_thickness_setpoint_nm:
    type: float
    default: 0.0
    unit: nm
  k__shutter_1_time_setpoint_s:
    type: int
    default: 0
    unit: s
  shutter_1_remaining_time_s:
    type: int
    default: 0
    unit: s
  k__shutter_2_mode:
    type: int
    default: 1
  k__shutter_2_thickness_setpoint_nm:
    type: float
    default: 0.0
    unit: nm
  k__shutter_2_time_setpoint_s:
    type: int
    default: 0
    unit: s
  shutter_2_remaining_time_s:
    type: int
    default: 0
    unit: s
  k__shutter_3_mode:
    type: int
    default: 1
  k__shutter_3_thickness_setpoint_nm:
    type: float
    default: 0.0
    unit: nm
  k__shutter_3_time_setpoint_s:
    type: int
    default: 0
    unit: s
  shutter_3_remaining_time_s:
    type: int
    default: 0
    unit: s

  k__flow_sensor_enabled:
    type: int
    default: 1
  k__flow_sensor_range:
    type: int
    default: 3
  flow_controller_temp_raw:
    type: int
    default: 0
  flow_controller_drive_level_raw:
    type: int
    default: 0
  k__flow_controller_operate_range:
    type: int
    default: 0

  output_1_work_time_s:
    type: int
    default: 0
    unit: s
  output_2_work_time_s:
    type: int
    default: 0
    unit: s
  output_3_work_time_s:
    type: int
    default: 0
    unit: s
  k__active_output:
    type: int
    default: 1
  active_output:
    type: int
    default: 1
  k__timer_direction:
    type: int
    default: 1
  operate_time_s:
    type: int
    default: 0
    unit: s
  k__operate_time_setpoint_s:
    type: int
    default: 0
    unit: s

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: "$param(modbus_port)"
      unit_id: "$param(modbus_unit_id)"
      zero_fill: true
      mapping:
        device_state: { address: [0,0], group: h_r, type: uint_16 }
        status_word_1: { address: [1,1], group: h_r, type: uint_16 }
        status_word_2: { address: [2,2], group: h_r, type: uint_16 }
        switch_to_operate_allowed: { address: [3,3], group: h_r, type: uint_16 }

        magnetron_power_w: { address: [4,5], group: h_r, type: float }
        magnetron_voltage_v: { address: [6,7], group: h_r, type: float }
        magnetron_current_ma: { address: [8,9], group: h_r, type: float }
        thickness_nm: { address: [17,18], group: h_r, type: float }
        rate_nm_s: { address: [19,20], group: h_r, type: float }
        flow_sccm: { address: [21,22], group: h_r, type: float }

        k__working_mode: { address: [23,23], group: h_r, type: uint_16 }
        cmd__go_to_operate: { address: [24,24], group: h_r, type: uint_16 }
        cmd__go_to_standby: { address: [25,25], group: h_r, type: uint_16 }

        k__power_set_w: { address: [26,27], group: h_r, type: float }
        k__voltage_set_v: { address: [28,29], group: h_r, type: float }
        k__current_set_ma: { address: [30,31], group: h_r, type: float }
        k__frequency_khz: { address: [32,33], group: h_r, type: float }
        k__pulse_duration_us: { address: [34,35], group: h_r, type: float }
        k__flow_set_sccm: { address: [36,37], group: h_r, type: float }

        cmd__shutter_1_open: { address: [38,38], group: h_r, type: uint_16 }
        cmd__shutter_1_close: { address: [39,39], group: h_r, type: uint_16 }
        cmd__shutter_2_open: { address: [40,40], group: h_r, type: uint_16 }
        cmd__shutter_2_close: { address: [41,41], group: h_r, type: uint_16 }
        cmd__shutter_3_open: { address: [42,42], group: h_r, type: uint_16 }
        cmd__shutter_3_close: { address: [43,43], group: h_r, type: uint_16 }

        cmd__valve_open: { address: [44,44], group: h_r, type: uint_16 }
        cmd__valve_close: { address: [45,45], group: h_r, type: uint_16 }
        cmd__clear_thickness: { address: [46,46], group: h_r, type: uint_16 }

        k__power_limit_output_1_w: { address: [47,47], group: h_r, type: uint_16 }
        k__power_limit_output_2_w: { address: [48,48], group: h_r, type: uint_16 }
        k__power_limit_output_3_w: { address: [49,49], group: h_r, type: uint_16 }
        k__voltage_limit_output_1_v: { address: [50,50], group: h_r, type: uint_16 }
        k__voltage_limit_output_2_v: { address: [51,51], group: h_r, type: uint_16 }
        k__voltage_limit_output_3_v: { address: [52,52], group: h_r, type: uint_16 }
        k__current_limit_output_1_ma: { address: [53,53], group: h_r, type: uint_16 }
        k__current_limit_output_2_ma: { address: [54,54], group: h_r, type: uint_16 }
        k__current_limit_output_3_ma: { address: [55,55], group: h_r, type: uint_16 }

        k__power_ramp_w_s: { address: [56,56], group: h_r, type: uint_16 }
        k__voltage_ramp_v_s: { address: [57,57], group: h_r, type: uint_16 }
        k__current_ramp_ma_s: { address: [58,58], group: h_r, type: uint_16 }

        k__vacuum_interlock_mode: { address: [59,59], group: h_r, type: uint_16 }
        k__arc_detect_enabled: { address: [60,60], group: h_r, type: uint_16 }
        k__arc_detect_time_us: { address: [61,61], group: h_r, type: uint_16 }
        k__arc_off_time_ms: { address: [62,62], group: h_r, type: uint_16 }
        k__arc_limit_enabled: { address: [63,63], group: h_r, type: uint_16 }
        k__arc_limit_value: { address: [64,65], group: h_r, type: uint_32 }

        k__shutter_control_internal: { address: [66,66], group: h_r, type: uint_16 }
        k__shutter_1_mode: { address: [67,67], group: h_r, type: uint_16 }
        k__shutter_1_thickness_setpoint_nm: { address: [68,69], group: h_r, type: float }
        k__shutter_1_time_setpoint_s: { address: [70,71], group: h_r, type: uint_32 }
        shutter_1_remaining_time_s: { address: [72,73], group: h_r, type: uint_32 }
        k__shutter_2_mode: { address: [74,74], group: h_r, type: uint_16 }
        k__shutter_2_thickness_setpoint_nm: { address: [75,76], group: h_r, type: float }
        k__shutter_2_time_setpoint_s: { address: [77,78], group: h_r, type: uint_32 }
        shutter_2_remaining_time_s: { address: [79,80], group: h_r, type: uint_32 }
        k__shutter_3_mode: { address: [81,81], group: h_r, type: uint_16 }
        k__shutter_3_thickness_setpoint_nm: { address: [82,83], group: h_r, type: float }
        k__shutter_3_time_setpoint_s: { address: [84,85], group: h_r, type: uint_32 }
        shutter_3_remaining_time_s: { address: [86,87], group: h_r, type: uint_32 }

        k__flow_sensor_enabled: { address: [88,88], group: h_r, type: uint_16 }
        k__flow_sensor_range: { address: [89,89], group: h_r, type: uint_16 }
        flow_controller_temp_raw: { address: [90,90], group: h_r, type: uint_16 }
        flow_controller_drive_level_raw: { address: [91,91], group: h_r, type: uint_16 }
        k__flow_controller_operate_range: { address: [92,92], group: h_r, type: uint_16 }

        output_1_work_time_s: { address: [93,94], group: h_r, type: uint_32 }
        output_2_work_time_s: { address: [95,96], group: h_r, type: uint_32 }
        output_3_work_time_s: { address: [97,98], group: h_r, type: uint_32 }
        k__active_output: { address: [99,99], group: h_r, type: uint_16 }
        active_output: { address: [100,100], group: h_r, type: uint_16 }
        k__timer_direction: { address: [101,101], group: h_r, type: uint_16 }
        operate_time_s: { address: [102,103], group: h_r, type: uint_32 }
        k__operate_time_setpoint_s: { address: [104,105], group: h_r, type: uint_32 }
