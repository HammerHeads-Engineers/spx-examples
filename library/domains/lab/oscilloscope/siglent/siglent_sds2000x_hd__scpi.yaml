name: siglent_sds2000x_hd__scpi
description: |
  Virtual Siglent SDS2000X HD series oscilloscope exposing a subset of the
  SCPI (ASCII/TCP) command set for channel setup and measurement queries.
attributes:
  k__channel_1_scale_v:
    type: float
    default: 1.0
    unit: V
  k__channel_1_offset_v:
    type: float
    default: 0.0
    unit: V
  k__timebase_scale_s:
    type: float
    default: 0.001
    unit: s
  k__trigger_level_v:
    type: float
    default: 0.0
    unit: V
  channel1_vpp_v:
    type: float
    default: 2.0
    unit: V
  channel1_vrms_v:
    type: float
    default: 0.7071
    unit: V
  channel1_vavg_v:
    type: float
    default: 0.0
    unit: V
  channel1_freq_hz:
    type: float
    default: 1000.0
    unit: Hz
  channel1_period_s:
    type: float
    default: 0.001
    unit: s
  idn:
    type: str
    default: "SIGLENT,SDS2000X HD,SDS2HD0000000,1.0"

actions:
  - function: $in(channel1_period_s)
    name: update_period
    description: Recompute period from the current channel 1 frequency.
    params:
      min_freq_hz: 0.1
    call: 1.0 / max($in(channel1_freq_hz), min_freq_hz)
  - function: $in(channel1_vrms_v)
    name: update_vrms
    description: Approximate RMS voltage from the configured channel 1 Vpp amplitude.
    params:
      scale: 0.353553
    call: $in(channel1_vpp_v) * scale

communication:
  - ascii:
      # Port is auto-assigned at runtime (starting from 5025) to avoid collisions.
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?": "#out(idn)"
        "C1:VDIV?": "#out(k__channel_1_scale_v)"
        "C1:VDIV {scale}":
          "#attr(k__channel_1_scale_v)": "scale"
          response: "OK"
        "C1:OFST?": "#out(k__channel_1_offset_v)"
        "C1:OFST {offset}":
          "#attr(k__channel_1_offset_v)": "offset"
          response: "OK"
        "TDIV?": "#out(k__timebase_scale_s)"
        "TDIV {scale}":
          "#attr(k__timebase_scale_s)": "scale"
          response: "OK"
        "TRLV?": "#out(k__trigger_level_v)"
        "TRLV {level}":
          "#attr(k__trigger_level_v)": "level"
          response: "OK"
        "C1:PAVA? PKPK": "#out(channel1_vpp_v)"
        "C1:PAVA? RMS": "#out(channel1_vrms_v)"
        "C1:PAVA? MEAN": "#out(channel1_vavg_v)"
        "C1:PAVA? FREQ": "#out(channel1_freq_hz)"
        "C1:PAVA? PER": "#out(channel1_period_s)"

scenarios:
  amplitude_sweep:
    display_name: "Amplitude Sweep"
    description: "Slowly ramp channel 1 amplitude for lab demos."
    period: 0.2
    actions:
      - function: $in(channel1_vpp_v)
        params:
          min_vpp: 0.5
          max_vpp: 5.0
          step_vpp: 0.1
        call: |
          (lambda v, min_vpp, max_vpp, step_vpp:
            min_vpp if v >= max_vpp else v + step_vpp
          )($in(channel1_vpp_v), min_vpp, max_vpp, step_vpp)
      - function: $in(channel1_vrms_v)
        params:
          scale: 0.353553
        call: $in(channel1_vpp_v) * scale
