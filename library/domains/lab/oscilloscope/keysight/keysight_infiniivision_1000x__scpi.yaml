name: keysight_infiniivision_1000x__scpi
description: |
  Keysight InfiniiVision 1000 X-Series oscilloscope model driven by SCPI
  (ASCII/TCP). Provides channel scale/offset control and basic measurement
  queries for lab automation and CI harnesses.

attributes:
  k__channel_1_scale_v:
    type: float
    default: 0.5
    unit: V
  k__channel_1_offset_v:
    type: float
    default: 0.0
    unit: V
  k__timebase_scale_s:
    type: float
    default: 0.001
    unit: s
  k__trigger_level_v:
    type: float
    default: 0.0
    unit: V
  k__measurement_source:
    type: str
    default: CHAN1
  vpp_v:
    type: float
    default: 1.0
    unit: V
  vrms_v:
    type: float
    default: 0.707
    unit: V
  vavg_v:
    type: float
    default: 0.0
    unit: V
  frequency_hz:
    type: float
    default: 1000.0
    unit: Hz
  last_error:
    type: str
    default: '0,"No error"'

communication:
  - ascii:
      # Port is auto-assigned at runtime (starting from 5025) to avoid collisions.
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?":
          name: query_idn
          response: "KEYSIGHT TECHNOLOGIES,DSOX1000X,MY00000000,01.20.0000"
        ":SYSTem:ERRor?":
          name: query_system_error
          response: "#out(last_error)"
        ":MEASure:VPP?":
          name: query_channel_1_vpp
          response: "#out(vpp_v)"
        ":MEASure:VRMS?":
          name: query_channel_1_vrms
          response: "#out(vrms_v)"
        ":MEASure:VAVerage?":
          name: query_channel_1_vavg
          response: "#out(vavg_v)"
        ":MEASure:FREQuency?":
          name: query_channel_1_frequency
          response: "#out(frequency_hz)"
        ":MEASure:SOURce?":
          name: query_measurement_source
          response: "#out(k__measurement_source)"
        ":MEASure:SOURce {source}":
          name: set_measurement_source
          "#attr(k__measurement_source)": "source"
          response: "OK"
        ":CHANnel1:SCALe?":
          name: query_channel_1_scale
          response: "#out(k__channel_1_scale_v)"
        ":CHANnel1:SCALe {scale}":
          name: set_channel_1_scale
          "#attr(k__channel_1_scale_v)": "scale"
        ":CHANnel1:OFFSet?":
          name: query_channel_1_offset
          response: "#out(k__channel_1_offset_v)"
        ":CHANnel1:OFFSet {offset}":
          name: set_channel_1_offset
          "#attr(k__channel_1_offset_v)": "offset"
        ":TIMebase:SCALe?":
          name: query_timebase_scale
          response: "#out(k__timebase_scale_s)"
        ":TIMebase:SCALe {scale}":
          name: set_timebase_scale
          "#attr(k__timebase_scale_s)": "scale"
        ":TRIGger:LEVel?":
          name: query_trigger_level
          response: "#out(k__trigger_level_v)"
        ":TRIGger:LEVel {level}":
          name: set_trigger_level
          "#attr(k__trigger_level_v)": "level"

scenarios:
  calibration_tone:
    display_name: "Calibration Tone"
    description: "Stable 1 kHz, 2 Vpp signal for lab calibration."
    overrides:
      $out(vpp_v): 2.0
      $out(vrms_v): 0.707
      $out(vavg_v): 0.0
      $out(frequency_hz): 1000.0
  transient_spike:
    display_name: "Transient Spike"
    description: "Short 5 Vpp excursion to validate limit triggers."
    duration: 1.0
    overrides:
      $out(vpp_v): 5.0
