# SPDX-License-Identifier: MIT
name: rohde_schwarz_hmc8015__scpi
description: |
  Virtual Rohde & Schwarz HMC8015 power analyzer with SCPI measurements for
  RMS voltage/current plus active/reactive/apparent power metrics.

meta_parameters:
  ascii_port:
    type: int
    default: 0

attributes:
  idn:
    type: str
    default: "Rohde&Schwarz,HMC8015,0000000000,1.00"

  k__measurement_functions:
    type: str
    default: "URMS,IRMS,P,S,Q,LAMB,PHI,EPS,ETA"

  voltage_rms_v:
    type: float
    default: 230.0
    unit: V
  current_rms_a:
    type: float
    default: 1.25
    unit: A
  lambda_pf:
    type: float
    default: 0.98
    unit: ratio
  phase_deg:
    type: float
    default: 11.5
    unit: deg

  apparent_power_va:
    type: float
    default: 287.5
    unit: VA
  active_power_w:
    type: float
    default: 281.75
    unit: W
  reactive_power_var:
    type: float
    default: 57.2
    unit: var
  energy_wh:
    type: float
    default: 0.5
    unit: Wh
  efficiency_pct:
    type: float
    default: 96.5
    unit: percent

  measurement_data:
    type: str
    default: "230.0,1.25,281.75,287.5,57.2,0.98,11.5,0.5,96.5"
  error_status:
    type: str
    default: "0,No error"

actions:
  - function: $in(apparent_power_va)
    name: update_apparent_power
    description: Compute apparent power from RMS voltage and RMS current.
    call: $in(voltage_rms_v) * $in(current_rms_a)
  - function: $in(active_power_w)
    name: update_active_power
    description: Derive active power from apparent power and the power factor.
    call: $in(apparent_power_va) * $in(lambda_pf)
  - function: $in(reactive_power_var)
    name: update_reactive_power
    description: Derive reactive power from apparent and active power components.
    imports: {math: math}
    call: |
      (lambda s, p:
        math.sqrt(max(0.0, s * s - p * p))
      )($in(apparent_power_va), $in(active_power_w))
  - function: $in(measurement_data)
    name: update_measurement_data
    description: Render the configured measurement function list into a CSV-style SCPI reply.
    params:
      default_functions: "URMS,IRMS,P,S,Q,LAMB,PHI,EPS,ETA"
    call: |
      (lambda functions, urms, irms, p, s, q, lamb, phi, eps, eta:
        ",".join(
          str({
            "URMS": urms,
            "IRMS": irms,
            "P": p,
            "S": s,
            "Q": q,
            "LAMB": lamb,
            "PHI": phi,
            "EPS": eps,
            "ETA": eta,
          }.get(f.strip().upper(), 0.0))
          for f in (functions or default_functions).split(",")
          if f.strip()
        )
      )(
        $in(k__measurement_functions),
        $in(voltage_rms_v),
        $in(current_rms_a),
        $in(active_power_w),
        $in(apparent_power_va),
        $in(reactive_power_var),
        $in(lambda_pf),
        $in(phase_deg),
        $in(energy_wh),
        $in(efficiency_pct),
      )

communication:
  - ascii:
      # Port can be overridden via ascii_port; 0 keeps runtime auto-assignment.
      port: "$param(ascii_port)"
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?":
          name: query_idn
          response: "#out(idn)"
        "SYST:ERR?":
          name: query_system_error
          response: "#out(error_status)"
        "CHAN:MEAS:DATA?":
          name: query_measurement_data
          response: "#out(measurement_data)"
        "CHAN:MEAS:FUNC {functions}":
          name: set_measurement_functions
          "#attr(k__measurement_functions)": "functions"
        "CHAN:MEAS:FUNC?":
          name: query_measurement_functions
          response: "#out(k__measurement_functions)"
