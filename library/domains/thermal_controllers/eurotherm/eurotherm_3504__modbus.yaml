# SPDX-License-Identifier: MIT

name: eurotherm_3504__modbus
description: |
  Eurotherm 3504 process controller (Sim) configured as a pressure loop with a
  minimal Modbus SCADA table for demo-grade control. Uses Modbus TCP slave with 0.1
  resolution (scaled integer). Addresses follow the Eurotherm SCADA table
  (Modbus index starts at 1).

  Implemented registers:
    - 1   Loop.1.Main.PV
    - 2   Loop.1.Main.TargetSP
    - 3   Loop.1.OP.ManualOutVal
    - 4   Loop.1.Main.ActiveOut
    - 5   Loop.1.Main.WorkingSP
    - 85  Loop.1.OP.Ch1Out
    - 273 Loop.1.Main.AutoMan (0=Auto, 1=Manual)
    - 556 Loop.1.OP.ManualMode (0=track, 1=step, 2=lastMOP)

attributes:
  pressure_bar: 1.0
  pressure_sp_bar: 1.5
  pressure_sp_working_bar: 1.5
  control_out_pct: 0.0
  manual_out_pct: 0.0
  ch1_out_pct: 0.0
  auto_man: 0
  manual_mode: 0

  ambient_pressure_bar: 1.0
  pressurize_coeff: 0.25
  leak_coeff: 0.03
  power_gain: 1.5
  power_integral: 0.0
  power_integral_gain: 0.2
  power_integral_leak: 0.05
  power_derivative: 0.0
  power_derivative_gain: 0.8
  power_error_prev: 0.0

  pressure_min_bar: 0.0
  pressure_max_bar: 10.0
  sp_min_bar: 0.0
  sp_max_bar: 10.0
  out_min: 0.0
  out_max: 100.0
  scale_0p1: 10.0

  pv_raw: 250
  target_sp_raw: 300
  working_sp_raw: 300
  active_out_raw: 0
  manual_out_raw: 0
  ch1_out_raw: 0
  auto_man_raw: 0
  manual_mode_raw: 0

actions:
  - function: $in(auto_man)
    name: sync_auto_man
    description: Resolve auto/manual mode from the SCADA register.
    call: 1 if $in(auto_man_raw) else 0

  - function: $in(manual_mode)
    name: sync_manual_mode
    description: Clamp the manual mode selector to documented options.
    call: max(0, min(2, int($in(manual_mode_raw))))

  - function: $in(pressure_sp_bar)
    name: sync_target_sp
    description: Decode Target SP (0.1 resolution scaled integer).
    call: max($in(sp_min_bar), min($in(sp_max_bar), $in(target_sp_raw) / $in(scale_0p1)))

  - function: $in(manual_out_pct)
    name: sync_manual_out
    description: Decode Manual Output (0.1 resolution scaled integer).
    call: max($in(out_min), min($in(out_max), $in(manual_out_raw) / $in(scale_0p1)))

  - function: $in(pressure_sp_working_bar)
    name: sync_working_sp
    description: Use Target SP as Working SP for the minimal simulation.
    call: $in(pressure_sp_bar)

  - function: $in(power_derivative)
    name: update_derivative
    description: Derivative contribution based on PV error slope.
    call: 0.0 if $in(auto_man) == 1
          else $in(power_derivative_gain)
            * (($in(pressure_sp_bar) - $in(pressure_bar)) - $in(power_error_prev))

  - function: $in(power_error_prev)
    name: update_error_prev
    call: 0.0 if $in(auto_man) == 1 else ($in(pressure_sp_bar) - $in(pressure_bar))

  - function: $in(power_integral)
    name: update_integral
    description: Integrator bias to offset steady-state error.
    call: 0.0 if $in(auto_man) == 1
          else (
            max(0, $in(power_integral) * (1 - $in(power_integral_leak)))
            if ($in(pressure_sp_bar) - $in(pressure_bar) <= 0)
            else max(
              0,
              min(
                $in(out_max),
                $in(power_integral)
                + $in(power_integral_gain) * ($in(pressure_sp_bar) - $in(pressure_bar))
              )
            )
          )

  - function: $in(control_out_pct)
    name: compute_active_out
    description: Use PID output in auto, manual out value in manual.
    call: (
          max(
            $in(out_min),
            min(
              $in(out_max),
              $in(power_gain) * ($in(pressure_sp_bar) - $in(pressure_bar))
              + $in(power_integral)
              + $in(power_derivative)
            )
          )
          if $in(auto_man) == 0
          else max($in(out_min), min($in(out_max), $in(manual_out_pct)))
        )

  - function: $in(ch1_out_pct)
    name: sync_ch1_out
    description: Mirror active output on channel 1.
    call: $in(control_out_pct)

  - function: $in(pressure_bar)
    name: update_pv
    description: First-order pressure response toward the setpoint.
    call: max(
          $in(pressure_min_bar),
          min(
            $in(pressure_max_bar),
            $in(pressure_bar)
            + 0.2
              * (
                $in(pressurize_coeff) * $in(control_out_pct)
                - $in(leak_coeff) * ($in(pressure_bar) - $in(ambient_pressure_bar))
              )
          )
        )

  - function: $in(pv_raw)
    name: encode_pv_raw
    description: Encode PV into 0.1 resolution register.
    call: int(round($in(pressure_bar) * $in(scale_0p1)))

  - function: $in(target_sp_raw)
    name: encode_target_sp_raw
    description: Clamp and encode Target SP.
    call: int(round($in(pressure_sp_bar) * $in(scale_0p1)))

  - function: $in(working_sp_raw)
    name: encode_working_sp_raw
    call: int(round($in(pressure_sp_working_bar) * $in(scale_0p1)))

  - function: $in(active_out_raw)
    name: encode_active_out_raw
    call: int(round($in(control_out_pct) * $in(scale_0p1)))

  - function: $in(manual_out_raw)
    name: encode_manual_out_raw
    call: int(round($in(manual_out_pct) * $in(scale_0p1)))

  - function: $in(ch1_out_raw)
    name: encode_ch1_out_raw
    call: int(round($in(ch1_out_pct) * $in(scale_0p1)))

  - function: $in(auto_man_raw)
    name: encode_auto_man_raw
    call: 1 if $in(auto_man) == 1 else 0

  - function: $in(manual_mode_raw)
    name: encode_manual_mode_raw
    call: max(0, min(2, int($in(manual_mode))))

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: 5027
      unit_id: 1
      zero_fill: true
      mapping:
        pv_raw:          { address: [1,1],   group: h_r, type: uint_16 }
        target_sp_raw:   { address: [2,2],   group: h_r, type: uint_16 }
        manual_out_raw:  { address: [3,3],   group: h_r, type: uint_16 }
        active_out_raw:  { address: [4,4],   group: h_r, type: uint_16 }
        working_sp_raw:  { address: [5,5],   group: h_r, type: uint_16 }
        ch1_out_raw:     { address: [85,85], group: h_r, type: uint_16 }
        auto_man_raw:    { address: [273,273], group: h_r, type: uint_16 }
        manual_mode_raw: { address: [556,556], group: h_r, type: uint_16 }

scenarios:
  auto_pressurize:
    enabled: true
    duration: 20.0
    overrides:
      $in(auto_man_raw): 0
      $in(target_sp_raw): 25
      $in(manual_out_raw): 0

  auto_depressurize:
    enabled: true
    duration: 18.0
    overrides:
      $in(auto_man_raw): 0
      $in(target_sp_raw): 8

  manual_hold_40:
    enabled: true
    duration: 15.0
    overrides:
      $in(auto_man_raw): 1
      $in(manual_out_raw): 400
