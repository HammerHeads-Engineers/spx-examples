# SPDX-License-Identifier: MIT

name: iiot_line_counter__mqtt
description: |
  Virtual production line counter publishing piece counts and line speed over MQTT.
  The model is suitable for testing OEE-style dashboards and simple MES consumers.

meta_parameters:
  mqtt_broker_host:
    type: str
    default: "host.docker.internal"
  mqtt_broker_port:
    type: int
    default: 1883
  mqtt_topic_prefix:
    type: str
    default: "spx/examples/line_counter"
  mqtt_publish_interval:
    type: float
    default: 1.0
  mqtt_default_qos:
    type: int
    default: 1

attributes:
  count_total:
    type: float
    default: 0.0
    unit: count
  count_good:
    type: float
    default: 0.0
    unit: count
  count_bad:
    type: float
    default: 0.0
    unit: count
  line_speed_mpm:
    type: float
    default: 0.0
    unit: m/min
  target_speed_mpm:
    type: float
    default: 30.0
    unit: m/min
  pulse_per_meter:
    type: float
    default: 10.0
    unit: pulse/m
  scrap_rate_percent:
    type: float
    default: 2.0
    unit: percent
  running:
    type: int
    default: 1
  jam_alarm:
    type: int
    default: 0
  state_text:
    type: str
    default: "STOPPED"

  cycle_time_s:
    type: float
    default: 1.0
    unit: s

actions:
  - function: $in(line_speed_mpm)
    name: track_line_speed
    description: Slew actual speed toward the target when running.
    accel: 5.0
    decel: 8.0
    call: (
          0.0 if $in(running) == 0
          else (
            $in(line_speed_mpm)
            + (
                min(accel, $in(target_speed_mpm) - $in(line_speed_mpm))
                if $in(target_speed_mpm) > $in(line_speed_mpm)
                else max(-decel, $in(target_speed_mpm) - $in(line_speed_mpm))
              )
          )
        )

  - function: $in(count_total)
    name: integrate_counts
    description: Increment counters based on line speed and scrap rate.
    call: (
          $in(count_total)
          + (
              0.0
              if $in(running) == 0
              else max(0.0, $in(line_speed_mpm) * cycle_time_s * $in(pulse_per_meter) / 60.0)
            )
        )

  - function: $in(count_good)
    name: update_good_count
    description: Derive good piece count from total count and scrap rate.
    call: max(0.0, $in(count_total) * (1.0 - $in(scrap_rate_percent) / 100.0))

  - function: $in(count_bad)
    name: update_bad_count
    description: Derive scrap count as the remainder between total and good pieces.
    call: max(0.0, $in(count_total) - $in(count_good))

  - function: $in(jam_alarm)
    name: detect_jam
    description: Raise jam alarm when running at non-zero speed but no progress is made.
    threshold: 0.5
    call: (
          1 if $in(running) == 1 and $in(line_speed_mpm) < threshold else 0
        )

  - function: $in(state_text)
    name: update_state_text
    description: Simple RUN/STOP/FAULT state mapping.
    call: (
          "FAULT" if $in(jam_alarm) == 1
          else ("RUN" if $in(running) == 1 else "STOPPED")
        )

communication:
  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: "$param(mqtt_topic_prefix)"
      default_qos: "$param(mqtt_default_qos)"
      default_retain: false
      bindings:
        - name: publish_count_total
          attribute: $ext(count_total)
          topic: telemetry/count_total
          direction: publish
        - name: publish_count_good
          attribute: $ext(count_good)
          topic: telemetry/count_good
          direction: publish
        - name: publish_count_bad
          attribute: $ext(count_bad)
          topic: telemetry/count_bad
          direction: publish
        - name: publish_line_speed_mpm
          attribute: $ext(line_speed_mpm)
          topic: telemetry/line_speed_mpm
          direction: publish
        - name: publish_jam_alarm
          attribute: $ext(jam_alarm)
          topic: telemetry/alarms/jam
          direction: publish
        - name: publish_state_text
          attribute: $ext(state_text)
          topic: telemetry/state
          direction: publish
        - name: subscribe_target_speed_mpm
          attribute: $attr(target_speed_mpm)
          topic: command/target_speed_mpm
          direction: subscribe
        - name: subscribe_running
          attribute: $attr(running)
          topic: command/running
          direction: subscribe

scenarios:
  start_line:
    enabled: true
    display_name: "Start Line"
    description: |
      Bring the line from stopped state to the nominal target speed and let the
      counter integrate pieces for a short window.
    duration: 30.0
    overrides:
      $in(running): 1
      $in(target_speed_mpm): 30.0

  line_jam:
    enabled: true
    display_name: "Line Jam"
    description: |
      Simulate a temporary jam: the line remains commanded to run but the
      effective speed drops near zero, raising the jam_alarm for dashboards.
    duration: 10.0
    overrides:
      $in(running): 1
      $in(line_speed_mpm): 0.0
