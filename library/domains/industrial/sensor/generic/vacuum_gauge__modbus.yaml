name: vacuum_gauge__modbus
description: >
  Two-channel vacuum gauge simulation with roughing and high-vacuum readings,
  ionizer interlocks, relay thresholds, and discharge/leak disturbances exposed
  over Modbus TCP.

meta_parameters:
  modbus_port:
    type: int
    default: 5021
  modbus_unit_id:
    type: int
    default: 1

attributes:
  # Measured pressures [mbar]
  rough_pressure:
    type: float
    default: 1.0
    unit: mbar
  high_pressure:
    type: float
    default: 5.0e-1
    unit: mbar

  # Ionizer state
  ionizer_enabled:
    type: int
    default: 0
  ionizer_available:
    type: int
    default: 0
  ionizer_interlock:
    type: int
    default: 0

  # Disturbance flags
  leak_event:
    type: int
    default: 0

  # Pressure targets [mbar]
  pumpdown_target:
    type: float
    default: 3.0e-9
    unit: mbar
  upset_target:
    type: float
    default: 2.0e-2
    unit: mbar

  # Dynamics gains
  rough_pump_gain:
    type: float
    default: 0.12
  rough_upset_gain:
    type: float
    default: 0.5
  hv_pump_gain:
    type: float
    default: 0.08
  hv_upset_gain:
    type: float
    default: 0.55

  # Interlock thresholds [mbar]
  hv_threshold_enable:
    type: float
    default: 5.0e-6
    unit: mbar
  hv_threshold_disable:
    type: float
    default: 5.0e-5
    unit: mbar

  # Internal target helpers [mbar]
  active_target_pressure:
    type: float
    default: 5.0e-1
    unit: mbar
  rough_target_pressure:
    type: float
    default: 1.0e-3
    unit: mbar
  high_target_pressure:
    type: float
    default: 5.0e-1
    unit: mbar

  discharge_event:
    type: int
    default: 0
  discharge_decay:
    type: float
    default: 0.95
  discharge_active:
    type: int
    default: 0

  # Relay thresholds [mbar]
  relay_setpoint_1:
    type: float
    default: 5.0e-2
    unit: mbar
  relay_setpoint_2:
    type: float
    default: 1.0e-3
    unit: mbar
  relay_setpoint_3:
    type: float
    default: 1.0e-4
    unit: mbar
  relay_setpoint_4:
    type: float
    default: 1.0e-5
    unit: mbar
  relay_setpoint_5:
    type: float
    default: 1.0e-6
    unit: mbar

  # Relay outputs
  relay_output_1:
    type: int
    default: 0
  relay_output_2:
    type: int
    default: 0
  relay_output_3:
    type: int
    default: 0
  relay_output_4:
    type: int
    default: 0
  relay_output_5:
    type: int
    default: 0

actions:
  # Choose between pump-down or upset target pressures.
  - function: $in(active_target_pressure)
    name: Active Target Selector
    description: Routes the active target pressure to either pump-down or upset values.
    call: $in(upset_target) if $in(leak_event) else $in(pumpdown_target)

  # Discharge event instantaneously elevates pressures and arms decay.
  - function: $in(discharge_active)
    name: Discharge Latch
    description: Arms decay behaviour during discharge spikes and releases it once complete.
    release_target_margin: 1.05
    release_floor_margin: 1.1
    hv_floor: 1.0e-9
    call: 1 if $in(discharge_event)
         else (0 if $in(discharge_active)
                   and $in(high_pressure) <= max($in(high_target_pressure) * release_target_margin, hv_floor * release_floor_margin)
               else $in(discharge_active))

  - function: $in(rough_pressure)
    name: Rough Gauge Discharge Clamp
    description: Ensures the rough gauge reflects the discharge spike before resuming.
    discharge_pressure: 5.0e-2
    call: max($in(rough_pressure), discharge_pressure) if $in(discharge_event) else $in(rough_pressure)

  - function: $in(high_pressure)
    name: High-Vacuum Gauge Reading
    description: Simulated high-vacuum gauge reading with discharge spike handling.
    discharge_pressure: 5.0e-2
    call: max($in(high_pressure), discharge_pressure) if $in(discharge_event) else $in(high_pressure)

  # Clear the discharge trigger; decay happens in main loop when discharge_active is latched.
  - set: $in(discharge_event)
    name: Discharge Trigger Reset
    description: Clears the manual discharge trigger after processing.
    value: 0

  # Clamp targets to instrument ranges.
  - function: $in(rough_target_pressure)
    name: Rough Target Clamp
    description: Constrains the rough gauge target to the instrument range.
    rough_floor: 1.0e-3
    rough_ceiling: 1.2
    call: max(rough_floor, min(rough_ceiling, $in(active_target_pressure)))

  - function: $in(high_target_pressure)
    name: High-Vacuum Target Clamp
    description: Constrains the high-vacuum target to the instrument range.
    hv_floor: 1.0e-9
    hv_ceiling: 1.0
    call: max(hv_floor, min(hv_ceiling, $in(active_target_pressure)))

  # Exponential approach of the roughing gauge reading.
  - function: $in(rough_pressure)
    name: Rough Gauge Dynamics
    description: Drives the rough gauge toward its target with upset/discharge behaviour.
    rough_floor: 1.0e-3
    rough_ceiling: 1.2
    call: max(
          rough_floor,
          min(
            rough_ceiling,
            (
              $in(rough_pressure) * ($in(discharge_decay) if $in(discharge_active) else 1.0)
              + ($in(rough_target_pressure) - $in(rough_pressure))
                * ($in(rough_upset_gain) if $in(leak_event) else $in(rough_pump_gain))
            )
          )
        )

  # Exponential approach of the high-vacuum gauge reading.
  - function: $in(high_pressure)
    name: High-Vacuum Gauge Dynamics
    description: Drives the high-vacuum gauge toward its target with upset/discharge behaviour.
    hv_floor: 1.0e-9
    hv_ceiling: 1.0
    call: max(
          hv_floor,
          min(
            hv_ceiling,
            (
              $in(high_pressure) * ($in(discharge_decay) if $in(discharge_active) else 1.0)
              + ($in(high_target_pressure) - $in(high_pressure))
                * ($in(hv_upset_gain) if $in(leak_event) else $in(hv_pump_gain))
            )
          )
        )

  # Ioniser interlock hysteresis.
  - function: $in(ionizer_available)
    name: Ionizer Interlock Window
    description: Enables or disables the ioniser based on hysteresis thresholds.
    call: 1 if $in(high_pressure) <= $in(hv_threshold_enable)
         else (0 if $in(high_pressure) >= $in(hv_threshold_disable) else $in(ionizer_available))

  - function: $in(ionizer_interlock)
    name: Ionizer Safety Output
    description: Raises an alarm when the ioniser request violates the interlock.
    call: 1 if $in(ionizer_enabled) and $in(ionizer_available) == 0 else 0

  # Relay closures when high-vacuum pressure is below thresholds.
  - function: $in(relay_output_1)
    name: Relay 1 Threshold
    description: Energises relay output 1 when high-vacuum pressure is below setpoint 1.
    call: 1 if $in(high_pressure) <= $in(relay_setpoint_1) else 0

  - function: $in(relay_output_2)
    name: Relay 2 Threshold
    description: Energises relay output 2 when high-vacuum pressure is below setpoint 2.
    call: 1 if $in(high_pressure) <= $in(relay_setpoint_2) else 0

  - function: $in(relay_output_3)
    name: Relay 3 Threshold
    description: Energises relay output 3 when high-vacuum pressure is below setpoint 3.
    call: 1 if $in(high_pressure) <= $in(relay_setpoint_3) else 0

  - function: $in(relay_output_4)
    name: Relay 4 Threshold
    description: Energises relay output 4 when high-vacuum pressure is below setpoint 4.
    call: 1 if $in(high_pressure) <= $in(relay_setpoint_4) else 0

  - function: $in(relay_output_5)
    name: Relay 5 Threshold
    description: Energises relay output 5 when high-vacuum pressure is below setpoint 5.
    call: 1 if $in(high_pressure) <= $in(relay_setpoint_5) else 0

  - noise: $out(rough_pressure)
    name: Rough Gauge Noise
    description: Adds proportional drift to the rough gauge output.
    std: 5.0e-4
    mode: proportional
  - noise: $out(high_pressure)
    name: High-Vacuum Gauge Noise
    description: Adds proportional drift to the high-vacuum gauge output.
    std: 5.0e-5
    mode: proportional

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: "$param(modbus_port)"
      unit_id: "$param(modbus_unit_id)"
      zero_fill: true
      # poll_interval: 0.2
      mapping:
        rough_pressure:        { address: [0,1],  group: h_r, type: float }
        high_pressure:         { address: [2,3],  group: h_r, type: float }
        ionizer_enabled:       { address: [4,4],  group: c_o, type: uint_16 }
        ionizer_available:     { address: [5,5],  group: h_r, type: uint_16 }
        ionizer_interlock:     { address: [6,6],  group: h_r, type: uint_16 }
        leak_event:            { address: [7,7],  group: c_o, type: uint_16 }
        pumpdown_target:       { address: [8,9],  group: h_r, type: float }
        upset_target:          { address: [10,11], group: h_r, type: float }
        relay_setpoint_1:      { address: [12,13], group: h_r, type: float }
        relay_setpoint_2:      { address: [14,15], group: h_r, type: float }
        relay_setpoint_3:      { address: [16,17], group: h_r, type: float }
        relay_setpoint_4:      { address: [18,19], group: h_r, type: float }
        relay_setpoint_5:      { address: [20,21], group: h_r, type: float }
        relay_output_1:        { address: [22,22], group: h_r, type: uint_16 }
        relay_output_2:        { address: [23,23], group: h_r, type: uint_16 }
        relay_output_3:        { address: [24,24], group: h_r, type: uint_16 }
        relay_output_4:        { address: [25,25], group: h_r, type: uint_16 }
        relay_output_5:        { address: [26,26], group: h_r, type: uint_16 }
        # discharge_event:       { address: [27,27], group: c_o, type: uint_16 }
        # discharge_decay:       { address: [30,31], group: h_r, type: float }

scenarios:
  discharge_spike:
    name: Discharge Spike
    display_name: "Discharge Spike"
    enabled: true
    description: Injects a brief discharge event that spikes both pressure channels.
    duration: 0.1
    overrides:
      $in(discharge_event): 1

  slow_leak:
    name: Slow Leak
    display_name: "Slow Leak"
    enabled: true
    description: Holds the leak flag active long enough to raise pressures gradually.
    duration: 15.0
    overrides:
      $in(leak_event): 1
      $in(rough_upset_gain): 0.05
      $in(hv_upset_gain): 0.04

  ionizer_trip:
    name: Ionizer Trip
    display_name: "Ionizer Trip"
    enabled: true
    description: Requests the ioniser while nudging thresholds so the interlock triggers.
    duration: 5.0
    overrides:
      $in(ionizer_enabled): 1
      $in(hv_threshold_disable): 5.0e-6

  modbus_disconnect:
    name: Modbus Disconnect
    display_name: "Modbus Disconnect"
    enabled: true
    duration: 2.0
    description: Temporarily detaches the Modbus slave endpoint to exercise reconnect handling.
    call:
      path: communication.modbus_slave.detach
      stop_path: communication.modbus_slave.attach

  relay_sweep:
    name: Relay Sweep
    display_name: "Relay Sweep"
    enabled: true
    duration: 6.0
    description: Sweeps relay setpoints to exercise output transitions.
    overrides:
      relay_setpoint_1: 5.0e-1
      relay_setpoint_2: 1.0e-2
      relay_setpoint_3: 5.0e-4
      relay_setpoint_4: 1.0e-5
      relay_setpoint_5: 5.0e-7

  sensor_drift:
    name: Sensor Drift
    display_name: "Sensor Drift"
    enabled: true
    duration: 12.0
    description: Simulates slower sensor dynamics by reducing pump gains and adding decay.
    overrides:
      $in(discharge_decay): 0.9
      $in(rough_pump_gain): 0.02
      $in(hv_pump_gain): 0.015
