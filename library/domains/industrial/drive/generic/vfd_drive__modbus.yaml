# SPDX-License-Identifier: MIT

name: vfd_drive__modbus
description: |
  Virtual VFD (variable frequency drive) model exposing speed, torque and status
  via Modbus registers. Suitable for testing drive commissioning tools and
  simple PLC integrations.

attributes:
  enable:
    type: int
    default: 1
  speed_set_rpm:
    type: float
    default: 1500.0
    unit: rpm
  speed_actual_rpm:
    type: float
    default: 0.0
    unit: rpm
  torque_percent:
    type: float
    default: 0.0
    unit: percent
  torque_limit_percent:
    type: float
    default: 120.0
    unit: percent

  accel_ramp_s:
    type: float
    default: 2.0
    unit: s
  decel_ramp_s:
    type: float
    default: 3.0
    unit: s

  alarm_overload:
    type: int
    default: 0
  alarm_drive_fault:
    type: int
    default: 0
  status_word:
    type: int
    default: 0

  cycle_time_s:
    type: float
    default: 0.1
    unit: s

  _elapsed_step_s:
    type: float
    default: 0.0
    unit: s
  _previous_time_s:
    type: float
    default: 0.0
    unit: s

actions:
  - function: $in(_elapsed_step_s)
    name: measure_elapsed_step
    call: max(0.0, $in(__timer) - $in(_previous_time_s))

  - function: $in(_previous_time_s)
    name: capture_elapsed_time
    call: $in(__timer)

  - function: $in(speed_actual_rpm)
    name: track_speed
    description: First-order speed tracking with independent accel/decel ramps.
    call: (
          0.0 if $in(..enable) == 0
          else (
            $in(speed_actual_rpm)
            + (
                ( $in(speed_set_rpm) - $in(speed_actual_rpm) )
                * min(1.0, $in(_elapsed_step_s) / max(0.1, ($in(accel_ramp_s) if $in(speed_set_rpm) > $in(speed_actual_rpm) else $in(decel_ramp_s))))
              )
          )
        )

  - function: $in(torque_percent)
    name: compute_torque
    description: Torque rises with relative speed, saturating near limit.
    call: 0.0 if $in(..enable) == 0 else min(
          $in(torque_limit_percent),
          max(0.0, 10.0 + 0.06 * abs($in(speed_actual_rpm)))
        )

  - function: $in(alarm_overload)
    name: detect_overload
    description: Detect requested torque above the configured limit or nominal rating.
    call: 1 if (10.0 + 0.06 * abs($in(speed_actual_rpm)) > $in(torque_limit_percent) or $in(torque_percent) > 100.0) and $in(..enable) == 1 else 0

  - function: $in(alarm_drive_fault)
    name: detect_drive_fault
    description: Flag drive fault when slip between command and feedback stays excessive.
    slip_limit_rpm: 200.0
    call: 1 if ($in(..enable) == 1 and abs($in(speed_set_rpm) - $in(speed_actual_rpm)) > slip_limit_rpm) else 0

  - function: $in(status_word)
    name: build_status_word
    description: Encode basic RUN/FAULT bits into a status word.
    call: >-
          (
            0
            + (1 if $in(..enable) == 1 else 0)
            + (2 if $in(speed_actual_rpm) > 10.0 else 0)
            + (4 if $in(alarm_overload) == 1 else 0)
            + (8 if $in(alarm_drive_fault) == 1 else 0)
          )

communication:
  - modbus_tcp:
      poll_interval: 0.1
      mapping:
        enable:             { address: [0,0],  group: c_o, type: uint_16 }
        speed_set_rpm:      { address: [1,2],  group: h_r, type: float }
        speed_actual_rpm:   { address: [3,4],  group: h_r, type: float }
        torque_percent:     { address: [5,6],  group: h_r, type: float }
        torque_limit_percent: { address: [7,8], group: h_r, type: float }
        accel_ramp_s:       { address: [9,10], group: h_r, type: float }
        decel_ramp_s:       { address: [11,12], group: h_r, type: float }
        alarm_overload:     { address: [13,13], group: h_r, type: uint_16 }
        alarm_drive_fault:  { address: [14,14], group: h_r, type: uint_16 }
        status_word:        { address: [15,15], group: h_r, type: uint_16 }

scenarios:
  speed_step_profile:
    display_name: "Speed Step Profile"
    description: Apply a higher speed command with quicker ramps for commissioning checks.
    duration: 25.0
    overrides:
      $in(..enable): 1
      $in(speed_set_rpm): 1800.0
      $in(accel_ramp_s): 1.2
      $in(decel_ramp_s): 1.5

  torque_overload:
    display_name: "Torque Overload"
    description: Increase speed while reducing torque headroom to trigger overload handling.
    duration: 15.0
    overrides:
      $in(..enable): 1
      $in(speed_set_rpm): 2200.0
      $in(torque_limit_percent): 90.0

  emergency_stop_fault:
    display_name: "Emergency Stop Fault"
    description: Force a rapid deceleration that mimics an emergency-stop event.
    duration: 10.0
    overrides:
      $in(..enable): 1
      $in(speed_set_rpm): 0.0
      $in(decel_ramp_s): 0.2
      $in(accel_ramp_s): 0.5
