# SPDX-License-Identifier: MIT

name: vision_quality_station__http
description: |
  Simple vision and quality inspection station. Exposes HTTP endpoints for
  fetching inspection statistics and simulating new inspection results for
  Industry 4.0 dashboards and scrap analysis.

meta_parameters:
  http_host:
    type: str
    default: "0.0.0.0"
  http_port:
    type: int
    default: 8093

attributes:
  ok_count:
    type: int
    default: 0
    unit: count
  nok_count:
    type: int
    default: 0
    unit: count
  last_result:
    type: str
    default: "ok"
  last_defect_code:
    type: str
    default: "none"
  last_part_id:
    type: str
    default: ""
  sample_queued:
    type: int
    default: 0

  defect_count_none:
    type: int
    default: 0
    unit: count
  defect_count_scratch:
    type: int
    default: 0
    unit: count
  defect_count_dent:
    type: int
    default: 0
    unit: count
  defect_count_offset:
    type: int
    default: 0
    unit: count

actions:
  - function: $in(ok_count)
    name: update_ok_count
    call: (
          $in(ok_count)
          if $in(sample_queued) == 0 or $in(last_result) != "ok"
          else $in(ok_count) + 1
        )

  - function: $in(nok_count)
    name: update_nok_count
    call: (
          $in(nok_count)
          if $in(sample_queued) == 0 or $in(last_result) != "nok"
          else $in(nok_count) + 1
        )

  - function: $in(defect_count_none)
    name: update_defect_none
    call: (
          $in(defect_count_none)
          if $in(sample_queued) == 0 or $in(last_result) != "nok" or $in(last_defect_code) != "none"
          else $in(defect_count_none) + 1
        )

  - function: $in(defect_count_scratch)
    name: update_defect_scratch
    call: (
          $in(defect_count_scratch)
          if $in(sample_queued) == 0 or $in(last_result) != "nok" or $in(last_defect_code) != "scratch"
          else $in(defect_count_scratch) + 1
        )

  - function: $in(defect_count_dent)
    name: update_defect_dent
    call: (
          $in(defect_count_dent)
          if $in(sample_queued) == 0 or $in(last_result) != "nok" or $in(last_defect_code) != "dent"
          else $in(defect_count_dent) + 1
        )

  - function: $in(defect_count_offset)
    name: update_defect_offset
    call: (
          $in(defect_count_offset)
          if $in(sample_queued) == 0 or $in(last_result) != "nok" or $in(last_defect_code) != "offset"
          else $in(defect_count_offset) + 1
        )

  - function: $in(sample_queued)
    name: reset_sample_queue
    call: 0
          if $in(sample_queued) == 0
          else 0

communication:
  - http_endpoint:
      host: "$param(http_host)"
      port: "$param(http_port)"
      endpoints:
        "/v1/inspection/stats":
          method: GET
          response:
            ok_count: "#attr(ok_count)"
            nok_count: "#attr(nok_count)"
            last_result: "#attr(last_result)"
            last_defect_code: "#attr(last_defect_code)"
            last_part_id: "#attr(last_part_id)"
            defect_histogram:
              none: "#attr(defect_count_none)"
              scratch: "#attr(defect_count_scratch)"
              dent: "#attr(defect_count_dent)"
              offset: "#attr(defect_count_offset)"

        "/v1/inspection/sample":
          method: POST
          alias:
            - "#attr(last_part_id) = #param(__body__.part_id)"
            - "#attr(last_result) = #param(__body__.result)"
            - "#attr(last_defect_code) = #param(__body__.defect_code)"
            - "#attr(sample_queued) = 1"
          response:
            status: "ok"
            part_id: "#attr(last_part_id)"
            result: "#attr(last_result)"
            defect_code: "#attr(last_defect_code)"

scenarios:
  steady_ok_run:
    enabled: true
    display_name: "Steady OK Run"
    description: Continuously queue accepted parts without defects.
    duration: 20.0
    overrides:
      $in(sample_queued): 1
      $in(last_result): ok
      $in(last_defect_code): none

  defect_burst:
    enabled: true
    display_name: "Defect Burst"
    description: Queue a burst of NOK parts with scratch defects.
    duration: 12.0
    overrides:
      $in(sample_queued): 1
      $in(last_result): nok
      $in(last_defect_code): scratch
      $in(last_part_id): "PART-DEF-001"

  maintenance_pause:
    enabled: true
    display_name: "Maintenance Pause"
    description: Pause sample intake while clearing back to a nominal OK state.
    duration: 15.0
    overrides:
      $in(sample_queued): 0
      $in(last_result): ok
      $in(last_defect_code): none
