# SPDX-License-Identifier: MIT

name: pid_process_controller__modbus
description: |
  Generic PID process controller for a single-loop process variable exposed
  via Modbus. Represents typical industrial temperature, pressure, or level loops.

attributes:
  pv:
    type: float
    default: 0.0
  sp:
    type: float
    default: 1.0
  cv:
    type: float
    default: 0.0
    unit: percent

  k_p:
    type: float
    default: 2.0
  k_i:
    type: float
    default: 0.5
  k_d:
    type: float
    default: 0.0

  i_term:
    type: float
    default: 0.0
  d_term:
    type: float
    default: 0.0
  error_prev:
    type: float
    default: 0.0

  output_min:
    type: float
    default: 0.0
    unit: percent
  output_max:
    type: float
    default: 100.0
    unit: percent

  mode_auto:
    type: int
    default: 1
  manual_cv:
    type: float
    default: 0.0
    unit: percent

  alarm_high:
    type: int
    default: 0
  alarm_low:
    type: int
    default: 0
  alarm_high_limit:
    type: float
    default: 1.2
  alarm_low_limit:
    type: float
    default: -0.2

  cycle_time_s:
    type: float
    default: 0.5
    unit: s

actions:
  - function: $in(i_term)
    name: integrate_error
    description: Integrate error when in auto mode.
    call: (
          $in(i_term)
          if $in(mode_auto) == 0
          else $in(i_term) + $in(k_i) * ($in(sp) - $in(pv)) * cycle_time_s
        )

  - function: $in(d_term)
    name: differentiate_error
    description: Derivative action based on error slope.
    call: $in(k_d) * (($in(sp) - $in(pv)) - $in(error_prev)) / max(1e-3, cycle_time_s)

  - function: $in(error_prev)
    name: capture_error
    call: $in(sp) - $in(pv)

  - function: $in(cv)
    name: compute_output
    description: PID output with clamping and manual override.
    call: >-
          (
            $in(manual_cv)
            if $in(mode_auto) == 0
            else max(
              $in(output_min),
              min(
                $in(output_max),
                $in(k_p) * ($in(sp) - $in(pv)) + $in(i_term) + $in(d_term)
              )
            )
          )

  - function: $in(alarm_high)
    name: detect_high
    call: 1 if $in(pv) >= $in(alarm_high_limit) else 0

  - function: $in(alarm_low)
    name: detect_low
    call: 1 if $in(pv) <= $in(alarm_low_limit) else 0

communication:
  - modbus_tcp:
      poll_interval: 0.25
      mapping:
        pv:              { address: [0,1], group: h_r, type: float }
        sp:              { address: [2,3], group: h_r, type: float }
        cv:              { address: [4,5], group: h_r, type: float }
        k_p:             { address: [6,7], group: h_r, type: float }
        k_i:             { address: [8,9], group: h_r, type: float }
        k_d:             { address: [10,11], group: h_r, type: float }
        mode_auto:       { address: [12,12], group: c_o, type: uint_16 }
        manual_cv:       { address: [13,14], group: h_r, type: float }
        alarm_high:      { address: [15,15], group: h_r, type: uint_16 }
        alarm_low:       { address: [16,16], group: h_r, type: uint_16 }
        alarm_high_limit: { address: [17,18], group: h_r, type: float }
        alarm_low_limit: { address: [19,20], group: h_r, type: float }

scenarios:
  setpoint_step_up:
    enabled: true
    display_name: "Setpoint Step Up"
    description: Apply a positive setpoint step while staying in auto mode.
    duration: 12.0
    overrides:
      $in(sp): 3.0
      $in(mode_auto): 1

  load_disturbance:
    enabled: true
    display_name: "Load Disturbance"
    description: Push the process variable away from the setpoint to test disturbance rejection.
    duration: 10.0
    overrides:
      $in(pv): 1.6
      $in(sp): 1.0
      $in(mode_auto): 1

  manual_bump_test:
    enabled: true
    display_name: "Manual Bump Test"
    description: Switch to manual mode and hold a fixed controller output.
    duration: 8.0
    overrides:
      $in(mode_auto): 0
      $in(manual_cv): 65.0
