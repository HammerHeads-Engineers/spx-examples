name: thermal_controller__modbus
description: |
  Thermal controller with safety features and a simple Modbus register map for
  temperature-loop demos. The model exposes temperature, setpoint, power, and
  overload-related state without changing the legacy public attribute names.

attributes:
  temperature:
    type: float
    default: 25.0
    unit: degC
  setpoint:
    type: float
    default: 30.0
    unit: degC
  heating_power:
    type: float
    default: 0.0
    unit: percent
  power_on:
    type: int
    default: 1
  ambient:
    type: float
    default: 22.0
    unit: degC
  heat_coeff:
    type: float
    default: 0.25
  cool_coeff:
    type: float
    default: 0.03
  power_gain:
    type: float
    default: 1.5
  power_integral:
    type: float
    default: 0.0
  power_integral_gain:
    type: float
    default: 0.2
  power_integral_leak:
    type: float
    default: 0.05
  power_derivative:
    type: float
    default: 0.0
  power_derivative_gain:
    type: float
    default: 0.8
  power_error_prev:
    type: float
    default: 0.0

  overload:
    type: int
    default: 0
  overload_threshold:
    type: float
    default: 70.0
    unit: degC
  overload_hyst:
    type: float
    default: 2.0
    unit: degC

conditions:
  - if: $in(temperature) >= $in(overload_threshold)
    actions:
      - set: $in(overload)
        value: 1

  - if: $in(temperature) <= ($in(overload_threshold) - $in(overload_hyst))
    actions:
      - set: $in(overload)
        value: 0

actions:
  - function: $in(power_derivative)
    call: 0.0 if ($in(power_on) == 0 or $in(overload) == 1)
          else $in(power_derivative_gain) * (($in(setpoint) - $in(temperature)) - $in(power_error_prev))

  - function: $in(power_error_prev)
    call: 0.0 if ($in(power_on) == 0 or $in(overload) == 1)
          else ($in(setpoint) - $in(temperature))

  - function: $in(power_integral)
    call: 0.0 if ($in(power_on) == 0 or $in(overload) == 1)
          else (
            max(0, $in(power_integral) * (1 - $in(power_integral_leak)))
            if ($in(setpoint) - $in(temperature) <= 0)
            else max(
              0,
              min(100, $in(power_integral) + $in(power_integral_gain) * ($in(setpoint) - $in(temperature)))
            )
          )

  - function: $in(heating_power)
    call: 0.0 if ($in(power_on) == 0 or $in(overload) == 1)
          else max(
            0,
            min(
              100,
              $in(power_gain) * ($in(setpoint) - $in(temperature))
              + $in(power_integral)
              + $in(power_derivative)
            ),
          )

  - function: $in(temperature)
    call: $in(temperature) + 0.2 * ($in(heat_coeff) * $in(heating_power) - $in(cool_coeff) * ($in(temperature) - $in(ambient)))

communication:
  - modbus_tcp:
      poll_interval: 0.25
      mapping:
        temperature:        { address: [0,1], group: h_r, type: float }
        setpoint:           { address: [2,3], group: h_r, type: float }
        heating_power:      { address: [4,5], group: h_r, type: float }
        power_on:           { address: [6,6], group: c_o, type: uint_16 }
        ambient:            { address: [7,8], group: h_r, type: float }
        overload:           { address: [9,9], group: h_r, type: uint_16 }
        overload_threshold: { address: [10,11], group: h_r, type: float }
        overload_hyst:      { address: [12,13], group: h_r, type: float }
        power_gain:         { address: [14,15], group: h_r, type: float }
        power_integral:     { address: [16,17], group: h_r, type: float }
        power_integral_gain: { address: [18,19], group: h_r, type: float }
        power_derivative:   { address: [20,21], group: h_r, type: float }
        power_derivative_gain: { address: [22,23], group: h_r, type: float }
        power_error_prev:   { address: [24,25], group: h_r, type: float }
        power_integral_leak: { address: [26,27], group: h_r, type: float }

scenarios:
  heatup_nominal:
    enabled: true
    display_name: "Heatup Nominal"
    description: Run a nominal heat-up profile with a higher setpoint and gain.
    duration: 40.0
    overrides:
      $in(power_on): 1
      $in(setpoint): 80.0
      $in(ambient): 24.0
      $in(power_gain): 1.8

  overload_trip_test:
    enabled: true
    display_name: "Overload Trip Test"
    description: Force the controller toward an overload trip condition.
    duration: 20.0
    overrides:
      $in(power_on): 1
      $in(setpoint): 130.0
      $in(overload_threshold): 90.0
      $in(overload_hyst): 3.0

  powered_cooldown:
    enabled: true
    display_name: "Powered Cooldown"
    description: Turn power off and let the thermal mass cool toward ambient.
    duration: 25.0
    overrides:
      $in(power_on): 0
      $in(setpoint): 0.0
      $in(ambient): 18.0
      $in(power_integral): 0.0
      $in(power_derivative_gain): 0.0
