# SPDX-License-Identifier: MIT

name: wago_750_8000__modbus
description: |
  WAGO 750-8000 I/O system (sim) exposing a minimal Modbus TCP slave process image
  for digital inputs/outputs and analog inputs. Use it to validate PLC I/O
  mappings and edge gateways.

attributes:
  di_1: 0
  di_2: 0
  di_3: 0
  di_4: 0
  do_1: 0
  do_2: 0
  do_3: 0
  do_4: 0

  ai_1: 0.0   # e.g., 4-20 mA scaled engineering value
  ai_2: 0.0
  ai_3: 0.0
  ai_4: 0.0

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: 5024
      unit_id: 1
      zero_fill: true
      mapping:
        di_1: { address: [0,0], group: h_r, type: uint_16 }
        di_2: { address: [1,1], group: h_r, type: uint_16 }
        di_3: { address: [2,2], group: h_r, type: uint_16 }
        di_4: { address: [3,3], group: h_r, type: uint_16 }
        do_1: { address: [0,0], group: c_o, type: uint_16 }
        do_2: { address: [1,1], group: c_o, type: uint_16 }
        do_3: { address: [2,2], group: c_o, type: uint_16 }
        do_4: { address: [3,3], group: c_o, type: uint_16 }
        ai_1: { address: [0,1], group: i_r, type: float }
        ai_2: { address: [2,3], group: i_r, type: float }
        ai_3: { address: [4,5], group: i_r, type: float }
        ai_4: { address: [6,7], group: i_r, type: float }

scenarios:
  all_clear:
    enabled: true
    duration: 15.0
    overrides:
      $in(di_1): 0
      $in(di_2): 0
      $in(di_3): 0
      $in(di_4): 0
      $in(do_1): 0
      $in(do_2): 0
      $in(do_3): 0
      $in(do_4): 0
      $in(ai_1): 4.0
      $in(ai_2): 4.5
      $in(ai_3): 5.0
      $in(ai_4): 5.5

  alarm_trip:
    enabled: true
    duration: 8.0
    overrides:
      $in(di_1): 1
      $in(di_2): 1
      $in(di_3): 0
      $in(di_4): 0
      $in(do_1): 1
      $in(do_2): 1
      $in(do_3): 0
      $in(do_4): 0
      $in(ai_1): 18.5
      $in(ai_2): 19.0
      $in(ai_3): 2.0
      $in(ai_4): 2.2

  analog_ramp_high:
    enabled: true
    duration: 20.0
    overrides:
      $in(di_1): 0
      $in(di_2): 1
      $in(di_3): 0
      $in(di_4): 1
      $in(do_1): 0
      $in(do_2): 0
      $in(do_3): 1
      $in(do_4): 1
      $in(ai_1): 15.0
      $in(ai_2): 12.0
      $in(ai_3): 8.0
      $in(ai_4): 6.0

  maintenance_loopback:
    enabled: true
    duration: 25.0
    overrides:
      $in(di_1): 1
      $in(di_2): 0
      $in(di_3): 1
      $in(di_4): 0
      $in(do_1): 1
      $in(do_2): 0
      $in(do_3): 1
      $in(do_4): 0
      $in(ai_1): 10.0
      $in(ai_2): 10.0
      $in(ai_3): 10.0
      $in(ai_4): 10.0
