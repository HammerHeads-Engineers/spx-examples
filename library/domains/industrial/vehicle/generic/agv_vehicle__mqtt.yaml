# SPDX-License-Identifier: MIT

name: agv_vehicle__mqtt
description: |
  Autonomous guided vehicle (AGV) model for intralogistics scenarios. Publishes
  position, battery state, mission status and load information over MQTT.

meta_parameters:
  mqtt_broker_host:
    type: str
    default: "host.docker.internal"
  mqtt_broker_port:
    type: int
    default: 1883
  mqtt_topic_prefix:
    type: str
    default: "spx/examples/agv"
  mqtt_publish_interval:
    type: float
    default: 0.5
  mqtt_default_qos:
    type: int
    default: 1

attributes:
  pos_x_m:
    type: float
    default: 0.0
    unit: m
  pos_y_m:
    type: float
    default: 0.0
    unit: m
  heading_deg:
    type: float
    default: 0.0
    unit: deg
  speed_mps:
    type: float
    default: 0.0
    unit: m/s
  target_x_m:
    type: float
    default: 10.0
    unit: m
  target_y_m:
    type: float
    default: 0.0
    unit: m
  target_speed_mps:
    type: float
    default: 1.0
    unit: m/s

  battery_soc_percent:
    type: float
    default: 100.0
    unit: percent
  battery_discharge_rate:
    type: float
    default: 0.02
    unit: percent/s

  mission_state:
    type: str
    default: "idle"
  load_present:
    type: int
    default: 0
  alarm_obstacle:
    type: int
    default: 0

  cycle_time_s:
    type: float
    default: 0.5
    unit: s

actions:
  - function: $in(speed_mps)
    name: track_speed
    description: Slew actual speed toward target when navigating.
    accel: 0.4
    decel: 0.7
    call: (
          0.0 if $in(mission_state) != "navigating"
          else (
            $in(speed_mps)
            + (
                min(accel, $in(target_speed_mps) - $in(speed_mps))
                if $in(target_speed_mps) > $in(speed_mps)
                else max(-decel, $in(target_speed_mps) - $in(speed_mps))
              )
          )
        )

  - function: $in(pos_x_m)
    name: integrate_position_x
    description: Simple kinematics update in X assuming heading defines direction.
    call: $in(pos_x_m) + $in(speed_mps) * cycle_time_s * cos($in(heading_deg) * 3.14159 / 180.0)

  - function: $in(pos_y_m)
    name: integrate_position_y
    description: Simple kinematics update in Y assuming heading defines direction.
    call: $in(pos_y_m) + $in(speed_mps) * cycle_time_s * sin($in(heading_deg) * 3.14159 / 180.0)

  - function: $in(battery_soc_percent)
    name: discharge_battery
    description: Discharge battery in proportion to speed.
    call: max(
          0.0,
          $in(battery_soc_percent)
          - $in(battery_discharge_rate) * cycle_time_s * max(0.2, abs($in(speed_mps)))
        )

  - function: $in(mission_state)
    name: update_mission_state
    description: Switch mission state based on speed and waypoint proximity.
    tolerance_m: 0.3
    call: (
          "error" if $in(alarm_obstacle) == 1
          else (
            "idle" if $in(target_speed_mps) <= 0.01
            else (
              "waiting" if sqrt(($in(target_x_m) - $in(pos_x_m)) ** 2 + ($in(target_y_m) - $in(pos_y_m)) ** 2) <= tolerance_m
              else "navigating"
            )
          )
        )

communication:
  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: "$param(mqtt_topic_prefix)"
      default_qos: "$param(mqtt_default_qos)"
      default_retain: false
      bindings:
        - name: publish_pos_x_m
          attribute: $ext(pos_x_m)
          topic: telemetry/pos_x_m
          direction: publish
        - name: publish_pos_y_m
          attribute: $ext(pos_y_m)
          topic: telemetry/pos_y_m
          direction: publish
        - name: publish_heading_deg
          attribute: $ext(heading_deg)
          topic: telemetry/heading_deg
          direction: publish
        - name: publish_speed_mps
          attribute: $ext(speed_mps)
          topic: telemetry/speed_mps
          direction: publish
        - name: publish_battery_soc_percent
          attribute: $ext(battery_soc_percent)
          topic: telemetry/battery_soc_percent
          direction: publish
        - name: publish_mission_state
          attribute: $ext(mission_state)
          topic: telemetry/mission_state
          direction: publish
        - name: publish_load_present
          attribute: $ext(load_present)
          topic: telemetry/load_present
          direction: publish
        - name: publish_alarm_obstacle
          attribute: $ext(alarm_obstacle)
          topic: telemetry/alarms/obstacle
          direction: publish
        - name: subscribe_target_x_m
          attribute: $attr(target_x_m)
          topic: command/target_x_m
          direction: subscribe
        - name: subscribe_target_y_m
          attribute: $attr(target_y_m)
          topic: command/target_y_m
          direction: subscribe
        - name: subscribe_target_speed_mps
          attribute: $attr(target_speed_mps)
          topic: command/target_speed_mps
          direction: subscribe
        - name: subscribe_heading_deg
          attribute: $attr(heading_deg)
          topic: command/heading_deg
          direction: subscribe
        - name: subscribe_load_present
          attribute: $attr(load_present)
          topic: command/load_present
          direction: subscribe
        - name: subscribe_alarm_obstacle
          attribute: $attr(alarm_obstacle)
          topic: command/obstacle
          direction: subscribe

scenarios:
  mission_run:
    enabled: true
    display_name: "Mission Run"
    description: Drive toward a waypoint with cargo on board at nominal mission speed.
    duration: 30.0
    overrides:
      $in(target_x_m): 25.0
      $in(target_y_m): 12.0
      $in(target_speed_mps): 1.4
      $in(heading_deg): 25.0
      $in(load_present): 1

  obstacle_stop:
    enabled: true
    display_name: "Obstacle Stop"
    description: Force an obstacle alarm and halt the mission.
    duration: 10.0
    overrides:
      $in(target_speed_mps): 0.0
      $in(alarm_obstacle): 1
      $in(mission_state): error

  battery_service_window:
    enabled: true
    display_name: "Battery Service Window"
    description: Slow the AGV and drop battery state into a maintenance window.
    duration: 20.0
    overrides:
      $in(target_speed_mps): 0.3
      $in(battery_soc_percent): 18.0
      $in(load_present): 0
