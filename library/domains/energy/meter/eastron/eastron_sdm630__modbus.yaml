# SPDX-License-Identifier: MIT

name: eastron_sdm630__modbus
description: |
  Eastron SDM630 Modbus smart meter modeled as a Modbus TCP slave.
  Input register addresses follow the SDM630 Modbus Protocol (V1.8) for
  line voltages, currents, power, and energy totals.

meta_parameters:
  modbus_port:
    type: int
    default: 5033
  modbus_unit_id:
    type: int
    default: 1

attributes:
  # Phase-to-neutral voltages (V)
  k__voltage_l1_n_v:
    type: float
    default: 230.0
    unit: V
  k__voltage_l2_n_v:
    type: float
    default: 231.0
    unit: V
  k__voltage_l3_n_v:
    type: float
    default: 229.5
    unit: V
  k__current_l1_a:
    type: float
    default: 8.5
    unit: A
  k__current_l2_a:
    type: float
    default: 8.1
    unit: A
  k__current_l3_a:
    type: float
    default: 8.3
    unit: A
  k__power_factor_l1:
    type: float
    default: 0.96
  k__power_factor_l2:
    type: float
    default: 0.95
  k__power_factor_l3:
    type: float
    default: 0.97
  k__frequency_hz:
    type: float
    default: 50.0
    unit: Hz
  voltage_l1_l2_v:
    type: float
    default: 0.0
    unit: V
  voltage_l2_l3_v:
    type: float
    default: 0.0
    unit: V
  voltage_l3_l1_v:
    type: float
    default: 0.0
    unit: V
  voltage_ln_avg_v:
    type: float
    default: 0.0
    unit: V
  voltage_ll_avg_v:
    type: float
    default: 0.0
    unit: V
  current_avg_a:
    type: float
    default: 0.0
    unit: A
  current_sum_a:
    type: float
    default: 0.0
    unit: A
  active_power_l1_w:
    type: float
    default: 0.0
    unit: W
  active_power_l2_w:
    type: float
    default: 0.0
    unit: W
  active_power_l3_w:
    type: float
    default: 0.0
    unit: W
  active_power_total_w:
    type: float
    default: 0.0
    unit: W
  apparent_power_l1_va:
    type: float
    default: 0.0
    unit: VA
  apparent_power_l2_va:
    type: float
    default: 0.0
    unit: VA
  apparent_power_l3_va:
    type: float
    default: 0.0
    unit: VA
  apparent_power_total_va:
    type: float
    default: 0.0
    unit: VA
  reactive_power_l1_var:
    type: float
    default: 0.0
    unit: var
  reactive_power_l2_var:
    type: float
    default: 0.0
    unit: var
  reactive_power_l3_var:
    type: float
    default: 0.0
    unit: var
  reactive_power_total_var:
    type: float
    default: 0.0
    unit: var
  power_factor_total:
    type: float
    default: 0.0
  energy_import_total_kwh:
    type: float
    default: 0.0
    unit: kWh
  energy_export_total_kwh:
    type: float
    default: 0.0
    unit: kWh
  _cycle_time_s:
    type: float
    default: 1.0
    unit: s
actions:
  - function: $in(voltage_l1_l2_v)
    name: compute_voltage_l1_l2
    description: Approximate L1-L2 voltage from phase-to-neutral values.
    call: 1.7320508075688772 * (($in(k__voltage_l1_n_v) + $in(k__voltage_l2_n_v)) / 2.0)

  - function: $in(voltage_l2_l3_v)
    name: compute_voltage_l2_l3
    description: Approximate L2-L3 voltage from phase-to-neutral values.
    call: 1.7320508075688772 * (($in(k__voltage_l2_n_v) + $in(k__voltage_l3_n_v)) / 2.0)

  - function: $in(voltage_l3_l1_v)
    name: compute_voltage_l3_l1
    description: Approximate L3-L1 voltage from phase-to-neutral values.
    call: 1.7320508075688772 * (($in(k__voltage_l3_n_v) + $in(k__voltage_l1_n_v)) / 2.0)

  - function: $in(voltage_ln_avg_v)
    name: compute_voltage_ln_avg
    description: Average phase-to-neutral voltage.
    call: ($in(k__voltage_l1_n_v) + $in(k__voltage_l2_n_v) + $in(k__voltage_l3_n_v)) / 3.0

  - function: $in(voltage_ll_avg_v)
    name: compute_voltage_ll_avg
    description: Average line-to-line voltage.
    call: ($in(voltage_l1_l2_v) + $in(voltage_l2_l3_v) + $in(voltage_l3_l1_v)) / 3.0

  - function: $in(current_avg_a)
    name: compute_current_avg
    description: Average phase current.
    call: ($in(k__current_l1_a) + $in(k__current_l2_a) + $in(k__current_l3_a)) / 3.0

  - function: $in(current_sum_a)
    name: compute_current_sum
    description: Sum of line currents.
    call: $in(k__current_l1_a) + $in(k__current_l2_a) + $in(k__current_l3_a)

  - function: $in(apparent_power_l1_va)
    name: compute_apparent_power_l1
    description: Phase L1 apparent power (VA).
    call: abs($in(k__voltage_l1_n_v) * $in(k__current_l1_a))

  - function: $in(apparent_power_l2_va)
    name: compute_apparent_power_l2
    description: Phase L2 apparent power (VA).
    call: abs($in(k__voltage_l2_n_v) * $in(k__current_l2_a))

  - function: $in(apparent_power_l3_va)
    name: compute_apparent_power_l3
    description: Phase L3 apparent power (VA).
    call: abs($in(k__voltage_l3_n_v) * $in(k__current_l3_a))

  - function: $in(active_power_l1_w)
    name: compute_active_power_l1
    description: Phase L1 active power (W).
    call: $in(k__voltage_l1_n_v) * $in(k__current_l1_a) * $in(k__power_factor_l1)

  - function: $in(active_power_l2_w)
    name: compute_active_power_l2
    description: Phase L2 active power (W).
    call: $in(k__voltage_l2_n_v) * $in(k__current_l2_a) * $in(k__power_factor_l2)

  - function: $in(active_power_l3_w)
    name: compute_active_power_l3
    description: Phase L3 active power (W).
    call: $in(k__voltage_l3_n_v) * $in(k__current_l3_a) * $in(k__power_factor_l3)

  - function: $in(reactive_power_l1_var)
    name: compute_reactive_power_l1
    description: Phase L1 reactive power (VAr).
    call: ( max(0.0, ($in(apparent_power_l1_va) ** 2) - ($in(active_power_l1_w) ** 2)) ** 0.5 ) * (-1.0 if $in(k__power_factor_l1) < 0 else 1.0)

  - function: $in(reactive_power_l2_var)
    name: compute_reactive_power_l2
    description: Phase L2 reactive power (VAr).
    call: ( max(0.0, ($in(apparent_power_l2_va) ** 2) - ($in(active_power_l2_w) ** 2)) ** 0.5 ) * (-1.0 if $in(k__power_factor_l2) < 0 else 1.0)

  - function: $in(reactive_power_l3_var)
    name: compute_reactive_power_l3
    description: Phase L3 reactive power (VAr).
    call: ( max(0.0, ($in(apparent_power_l3_va) ** 2) - ($in(active_power_l3_w) ** 2)) ** 0.5 ) * (-1.0 if $in(k__power_factor_l3) < 0 else 1.0)

  - function: $in(active_power_total_w)
    name: compute_active_power_total
    description: Total active power (W).
    call: $in(active_power_l1_w) + $in(active_power_l2_w) + $in(active_power_l3_w)

  - function: $in(apparent_power_total_va)
    name: compute_apparent_power_total
    description: Total apparent power (VA).
    call: $in(apparent_power_l1_va) + $in(apparent_power_l2_va) + $in(apparent_power_l3_va)

  - function: $in(reactive_power_total_var)
    name: compute_reactive_power_total
    description: Total reactive power (VAr).
    call: $in(reactive_power_l1_var) + $in(reactive_power_l2_var) + $in(reactive_power_l3_var)

  - function: $in(power_factor_total)
    name: compute_power_factor_total
    description: Total power factor derived from active/apparent power.
    call: ( $in(active_power_total_w) / $in(apparent_power_total_va) if abs($in(apparent_power_total_va)) > 0.0001 else 0.0 )

  - function: $in(energy_import_total_kwh)
    name: integrate_energy_import
    description: Integrate imported energy (kWh) from total active power (W).
    call: $in(energy_import_total_kwh) + max(0.0, $in(active_power_total_w)) * $in(_cycle_time_s) / 3600000.0

  - function: $in(energy_export_total_kwh)
    name: integrate_energy_export
    description: Integrate exported energy (kWh) from total active power (W).
    call: $in(energy_export_total_kwh) + max(0.0, -$in(active_power_total_w)) * $in(_cycle_time_s) / 3600000.0

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: "$param(modbus_port)"
      unit_id: "$param(modbus_unit_id)"
      zero_fill: true
      mapping:
        # Phase-to-neutral voltages (V)
        k__voltage_l1_n_v: {address: [0, 1], group: i_r, type: float}
        k__voltage_l2_n_v: {address: [2, 3], group: i_r, type: float}
        k__voltage_l3_n_v: {address: [4, 5], group: i_r, type: float}

        # Phase currents (A)
        k__current_l1_a: {address: [6, 7], group: i_r, type: float}
        k__current_l2_a: {address: [8, 9], group: i_r, type: float}
        k__current_l3_a: {address: [10, 11], group: i_r, type: float}

        # Per-phase power (W/VA/VAR)
        active_power_l1_w: {address: [12, 13], group: i_r, type: float}
        active_power_l2_w: {address: [14, 15], group: i_r, type: float}
        active_power_l3_w: {address: [16, 17], group: i_r, type: float}
        apparent_power_l1_va: {address: [18, 19], group: i_r, type: float}
        apparent_power_l2_va: {address: [20, 21], group: i_r, type: float}
        apparent_power_l3_va: {address: [22, 23], group: i_r, type: float}
        reactive_power_l1_var: {address: [24, 25], group: i_r, type: float}
        reactive_power_l2_var: {address: [26, 27], group: i_r, type: float}
        reactive_power_l3_var: {address: [28, 29], group: i_r, type: float}

        # Per-phase power factor
        k__power_factor_l1: {address: [30, 31], group: i_r, type: float}
        k__power_factor_l2: {address: [32, 33], group: i_r, type: float}
        k__power_factor_l3: {address: [34, 35], group: i_r, type: float}

        # Averages and totals
        voltage_ln_avg_v: {address: [42, 43], group: i_r, type: float}
        current_avg_a: {address: [46, 47], group: i_r, type: float}
        current_sum_a: {address: [48, 49], group: i_r, type: float}
        active_power_total_w: {address: [52, 53], group: i_r, type: float}
        apparent_power_total_va: {address: [56, 57], group: i_r, type: float}
        reactive_power_total_var: {address: [60, 61], group: i_r, type: float}
        power_factor_total: {address: [62, 63], group: i_r, type: float}

        # Frequency and energy totals
        k__frequency_hz: {address: [70, 71], group: i_r, type: float}
        energy_import_total_kwh: {address: [72, 73], group: i_r, type: float}
        energy_export_total_kwh: {address: [74, 75], group: i_r, type: float}

        # Line-to-line voltages (V)
        voltage_l1_l2_v: {address: [200, 201], group: i_r, type: float}
        voltage_l2_l3_v: {address: [202, 203], group: i_r, type: float}
        voltage_l3_l1_v: {address: [204, 205], group: i_r, type: float}
        voltage_ll_avg_v: {address: [206, 207], group: i_r, type: float}

scenarios:
  balanced_load:
    display_name: Balanced Load
    description: Balanced three-phase load near nominal voltage.
    duration: 30.0
    overrides:
      $in(k__voltage_l1_n_v): 230.0
      $in(k__voltage_l2_n_v): 230.0
      $in(k__voltage_l3_n_v): 230.0
      $in(k__current_l1_a): 12.0
      $in(k__current_l2_a): 12.0
      $in(k__current_l3_a): 12.0
      $in(k__power_factor_l1): 0.98
      $in(k__power_factor_l2): 0.98
      $in(k__power_factor_l3): 0.98

  inductive_load:
    display_name: Inductive Load
    description: Lower power factor across all phases to mimic inductive loads.
    duration: 30.0
    overrides:
      $in(k__power_factor_l1): 0.7
      $in(k__power_factor_l2): 0.68
      $in(k__power_factor_l3): 0.72

  pv_export:
    display_name: PV Export
    description: Negative phase currents to simulate PV export.
    duration: 30.0
    overrides:
      $in(k__current_l1_a): -6.0
      $in(k__current_l2_a): -5.5
      $in(k__current_l3_a): -5.8
      $in(k__power_factor_l1): 0.99
      $in(k__power_factor_l2): 0.99
      $in(k__power_factor_l3): 0.99

  voltage_sag:
    display_name: Voltage Sag
    description: Phase-to-neutral voltage sag across all phases.
    duration: 30.0
    overrides:
      $in(k__voltage_l1_n_v): 205.0
      $in(k__voltage_l2_n_v): 208.0
      $in(k__voltage_l3_n_v): 210.0

  frequency_drift:
    display_name: Frequency Drift
    description: Off-nominal grid frequency condition.
    duration: 20.0
    overrides:
      $in(k__frequency_hz): 49.2
