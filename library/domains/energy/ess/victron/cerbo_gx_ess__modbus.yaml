# SPDX-License-Identifier: MIT

name: cerbo_gx_ess__modbus
description: |
  Victron Cerbo GX / Venus OS ESS aggregate exposed as a Modbus TCP slave for
  Smart Building Pack demos. The model represents the Cerbo GX as the LAN-facing
  gateway for a MultiPlus-II or Quattro inverter/charger, PV source, battery/BMS,
  grid meter, and household load. It is intentionally focused on the core values
  used by Home Assistant and BMS dashboards rather than the full Victron register
  list.

meta_parameters:
  modbus_port:
    type: int
    default: 5035
  modbus_unit_id:
    type: int
    default: 1

attributes:
  k__ess_mode:
    type: int
    default: 1
  k__grid_setpoint_w:
    type: float
    default: 0.0
    unit: W
  k__battery_min_soc_pct:
    type: float
    default: 20.0
    unit: "%"
  k__battery_max_soc_pct:
    type: float
    default: 95.0
    unit: "%"
  k__battery_power_setpoint_w:
    type: float
    default: 0.0
    unit: W
  k__charge_enable:
    type: int
    default: 1
  k__discharge_enable:
    type: int
    default: 1

  pv_available_power_w:
    type: float
    default: 4200.0
    unit: W
  pv_derate_pct:
    type: float
    default: 100.0
    unit: "%"
  pv_power_w:
    type: float
    default: 0.0
    unit: W
  home_base_load_w:
    type: float
    default: 2100.0
    unit: W
  hvac_load_w:
    type: float
    default: 650.0
    unit: W
  ev_load_w:
    type: float
    default: 0.0
    unit: W
  load_power_w:
    type: float
    default: 0.0
    unit: W
  grid_power_w:
    type: float
    default: 0.0
    unit: W
  battery_power_w:
    type: float
    default: 0.0
    unit: W
  battery_soc_pct:
    type: float
    default: 72.0
    unit: "%"
  battery_voltage_v:
    type: float
    default: 52.0
    unit: V
  battery_current_a:
    type: float
    default: 0.0
    unit: A
  battery_capacity_kwh:
    type: float
    default: 15.0
    unit: kWh
  max_charge_power_w:
    type: float
    default: 5000.0
    unit: W
  max_discharge_power_w:
    type: float
    default: 5000.0
    unit: W
  inverter_ac_power_w:
    type: float
    default: 0.0
    unit: W
  inverter_state:
    type: int
    default: 3
  charger_state:
    type: int
    default: 3
  grid_lost:
    type: int
    default: 0
  low_battery_alarm:
    type: int
    default: 0
  overload_alarm:
    type: int
    default: 0
  grid_energy_import_kwh:
    type: float
    default: 0.0
    unit: kWh
  grid_energy_export_kwh:
    type: float
    default: 0.0
    unit: kWh
  pv_energy_total_kwh:
    type: float
    default: 0.0
    unit: kWh
  battery_charge_energy_kwh:
    type: float
    default: 0.0
    unit: kWh
  battery_discharge_energy_kwh:
    type: float
    default: 0.0
    unit: kWh
  cycle_time_s:
    type: float
    default: 1.0
    unit: s

  _net_load_before_battery_w:
    type: float
    default: 0.0
    unit: W

actions:
  - function: $in(pv_power_w)
    name: compute_pv_power
    description: Apply a simple derating factor to available PV power.
    call: max(0.0, $in(pv_available_power_w)) * max(0.0, min(100.0, $in(pv_derate_pct))) / 100.0

  - function: $in(load_power_w)
    name: compute_load_power
    description: Aggregate household, HVAC, and optional EV demand.
    call: max(0.0, $in(home_base_load_w)) + max(0.0, $in(hvac_load_w)) + max(0.0, $in(ev_load_w))

  - function: $in(_net_load_before_battery_w)
    name: compute_net_load_before_battery
    description: Positive values need grid or battery support; negative values are PV surplus.
    call: $in(load_power_w) - $in(pv_power_w)

  - function: $in(battery_power_w)
    name: compute_battery_power
    description: |
      Positive battery power means discharge to support the home. Negative power
      means charging. Mode 3 uses the external battery power setpoint; other modes
      follow the grid setpoint like a simple ESS self-consumption controller.
    call: (
          0.0
          if (
            (
              (
                $in(k__battery_power_setpoint_w)
                if $in(k__ess_mode) == 3
                else $in(_net_load_before_battery_w) - $in(k__grid_setpoint_w)
              ) > 0.0
              and (
                $in(k__discharge_enable) == 0
                or $in(battery_soc_pct) <= $in(k__battery_min_soc_pct)
              )
            )
            or (
              (
                $in(k__battery_power_setpoint_w)
                if $in(k__ess_mode) == 3
                else $in(_net_load_before_battery_w) - $in(k__grid_setpoint_w)
              ) < 0.0
              and (
                $in(k__charge_enable) == 0
                or $in(battery_soc_pct) >= $in(k__battery_max_soc_pct)
              )
            )
          )
          else max(
            -$in(max_charge_power_w),
            min(
              $in(max_discharge_power_w),
              (
                $in(k__battery_power_setpoint_w)
                if $in(k__ess_mode) == 3
                else $in(_net_load_before_battery_w) - $in(k__grid_setpoint_w)
              )
            )
          )
        )

  - function: $in(grid_power_w)
    name: compute_grid_power
    description: Positive grid power is import; negative grid power is export.
    call: 0.0 if $in(grid_lost) else $in(_net_load_before_battery_w) - $in(battery_power_w)

  - function: $in(battery_soc_pct)
    name: integrate_battery_soc
    description: Integrate battery SOC from charge/discharge power.
    call: max(
          0.0,
          min(
            100.0,
            $in(battery_soc_pct)
            - ($in(battery_power_w) * $in(cycle_time_s) / 3600.0)
              / max(0.1, $in(battery_capacity_kwh) * 1000.0)
              * 100.0
          )
        )

  - function: $in(battery_current_a)
    name: compute_battery_current
    description: Positive current means battery discharge.
    call: $in(battery_power_w) / max(1.0, $in(battery_voltage_v))

  - function: $in(inverter_ac_power_w)
    name: compute_inverter_ac_power
    description: Approximate MultiPlus/Quattro AC inverter output from battery discharge.
    call: max(0.0, $in(battery_power_w))

  - function: $in(charger_state)
    name: compute_charger_state
    description: 3=bulk/active charging, 4=float/idle for demo purposes.
    call: 3 if $in(battery_power_w) < -25.0 else 4

  - function: $in(low_battery_alarm)
    name: compute_low_battery_alarm
    description: Raise alarm below configured minimum SOC.
    call: 1 if $in(battery_soc_pct) <= $in(k__battery_min_soc_pct) else 0

  - function: $in(overload_alarm)
    name: compute_overload_alarm
    description: Raise alarm when aggregate load exceeds inverter discharge capability.
    call: 1 if $in(load_power_w) > $in(max_discharge_power_w) + max(0.0, $in(pv_power_w)) else 0

  - function: $in(grid_energy_import_kwh)
    name: integrate_grid_import
    description: Integrate imported energy.
    call: $in(grid_energy_import_kwh) + max(0.0, $in(grid_power_w)) * $in(cycle_time_s) / 3600000.0

  - function: $in(grid_energy_export_kwh)
    name: integrate_grid_export
    description: Integrate exported energy.
    call: $in(grid_energy_export_kwh) + max(0.0, -$in(grid_power_w)) * $in(cycle_time_s) / 3600000.0

  - function: $in(pv_energy_total_kwh)
    name: integrate_pv_energy
    description: Integrate PV production.
    call: $in(pv_energy_total_kwh) + max(0.0, $in(pv_power_w)) * $in(cycle_time_s) / 3600000.0

  - function: $in(battery_charge_energy_kwh)
    name: integrate_battery_charge_energy
    description: Integrate battery charge energy.
    call: $in(battery_charge_energy_kwh) + max(0.0, -$in(battery_power_w)) * $in(cycle_time_s) / 3600000.0

  - function: $in(battery_discharge_energy_kwh)
    name: integrate_battery_discharge_energy
    description: Integrate battery discharge energy.
    call: $in(battery_discharge_energy_kwh) + max(0.0, $in(battery_power_w)) * $in(cycle_time_s) / 3600000.0

communication:
  - modbus_slave:
      host: 0.0.0.0
      port: "$param(modbus_port)"
      unit_id: "$param(modbus_unit_id)"
      zero_fill: true
      mapping:
        battery_soc_pct: {address: [840, 841], group: h_r, type: float}
        battery_power_w: {address: [842, 843], group: h_r, type: float}
        battery_voltage_v: {address: [844, 845], group: h_r, type: float}
        battery_current_a: {address: [846, 847], group: h_r, type: float}
        pv_power_w: {address: [850, 851], group: h_r, type: float}
        grid_power_w: {address: [852, 853], group: h_r, type: float}
        load_power_w: {address: [854, 855], group: h_r, type: float}
        inverter_ac_power_w: {address: [856, 857], group: h_r, type: float}
        grid_energy_import_kwh: {address: [858, 859], group: h_r, type: float}
        grid_energy_export_kwh: {address: [860, 861], group: h_r, type: float}
        pv_energy_total_kwh: {address: [862, 863], group: h_r, type: float}
        battery_charge_energy_kwh: {address: [864, 865], group: h_r, type: float}
        battery_discharge_energy_kwh: {address: [866, 867], group: h_r, type: float}
        k__ess_mode: {address: [870, 870], group: h_r, type: uint_16}
        inverter_state: {address: [871, 871], group: h_r, type: uint_16}
        charger_state: {address: [872, 872], group: h_r, type: uint_16}
        grid_lost: {address: [873, 873], group: h_r, type: uint_16}
        low_battery_alarm: {address: [874, 874], group: h_r, type: uint_16}
        overload_alarm: {address: [875, 875], group: h_r, type: uint_16}
        k__grid_setpoint_w: {address: [876, 877], group: h_r, type: float}
        k__battery_min_soc_pct: {address: [878, 879], group: h_r, type: float}
        k__battery_max_soc_pct: {address: [880, 881], group: h_r, type: float}
        k__battery_power_setpoint_w: {address: [882, 883], group: h_r, type: float}
        pv_available_power_w: {address: [884, 885], group: h_r, type: float}
        pv_derate_pct: {address: [886, 887], group: h_r, type: float}
        home_base_load_w: {address: [888, 889], group: h_r, type: float}
        hvac_load_w: {address: [890, 891], group: h_r, type: float}
        ev_load_w: {address: [892, 893], group: h_r, type: float}
        k__charge_enable: {address: [894, 894], group: h_r, type: uint_16}
        k__discharge_enable: {address: [895, 895], group: h_r, type: uint_16}

scenarios:
  solar_midday_export:
    display_name: Solar Midday Export
    description: Strong PV production charges the battery and exports surplus energy.
    duration: 30.0
    overrides:
      $in(pv_available_power_w): 7200.0
      $in(home_base_load_w): 1800.0
      $in(hvac_load_w): 450.0
      $in(k__grid_setpoint_w): 0.0

  evening_peak_shaving:
    display_name: Evening Peak Shaving
    description: Higher household load is covered by battery discharge to reduce grid import.
    duration: 30.0
    overrides:
      $in(pv_available_power_w): 300.0
      $in(home_base_load_w): 3600.0
      $in(hvac_load_w): 1100.0
      $in(k__grid_setpoint_w): 0.0

  grid_outage_backup:
    display_name: Grid Outage Backup
    description: Grid is unavailable; battery supports critical household load.
    duration: 20.0
    overrides:
      $in(grid_lost): 1
      $in(pv_available_power_w): 1200.0
      $in(home_base_load_w): 1800.0
      $in(hvac_load_w): 350.0
