name: weather_gateway_wago_pfc200__vaisala_wxt530__mqtt
description: |
  Enterprise-style weather station telemetry published by WAGO PFC200 gateway from Vaisala WXT530 (sim), using HA MQTT Discovery.

meta_parameters:
  mqtt_broker_host:
    type: str
    default: mosquitto-server
  mqtt_broker_port:
    type: int
    default: 1883
  mqtt_client_id:
    type: str
    default: spx_weather_gateway_1
  mqtt_discovery_client_id:
    type: str
    default: spx_weather_gateway_1_discovery
  mqtt_publish_interval:
    type: float
    default: 1.0

