timer:
  time_step: 1.0

actions:
  - function: $in(k__dew_point_c)
    name: Dew Point Estimate
    description: Approximate dew point from ambient temperature and relative humidity.
    call: |
      (lambda rh:
        $in(k__outdoor_temperature_c) - (100.0 - rh) / 5.0
      )(max(0.0, min(100.0, $in(k__humidity_percent))))
        $in(k__outdoor_temperature_c) - (100.0 - rh) / 5.0
      )(max(0.0, min(100.0, $in(k__humidity_percent))))

  - function: $in(k__wind_chill_c)
    name: Wind Chill Estimate
    description: Compute wind chill for cold/windy conditions; otherwise use ambient temperature.
    call: |
      (lambda t, v_kmh:
        (13.12 + 0.6215 * t - 11.37 * (v_kmh ** 0.16) + 0.3965 * t * (v_kmh ** 0.16))
        if (t <= 10.0 and v_kmh >= 4.68)
        else t
      )($in(k__outdoor_temperature_c), $in(k__wind_speed_ms) * 3.6)
      )($in(k__outdoor_temperature_c), $in(k__wind_speed_ms) * 3.6)

communication:
  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      client_id: "$param(mqtt_client_id)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: spx/weather
      default_qos: 1
      default_retain: false
      birth_topic: availability
      birth_payload: online
      birth_retain: true
      will_topic: availability
      will_payload: offline
      will_retain: true
      bindings:
        - name: k__outdoor_temperature_c
          attribute: $ext(k__outdoor_temperature_c)
          topic: outdoor_temperature_c
          direction: publish
          publish_on_change: false
        - name: k__humidity_percent
          attribute: $ext(k__humidity_percent)
          topic: humidity_percent
          direction: publish
          publish_on_change: false
        - name: k__pressure_hpa
          attribute: $ext(k__pressure_hpa)
          topic: pressure_hpa
          direction: publish
          publish_on_change: false
        - name: k__wind_speed_ms
          attribute: $ext(k__wind_speed_ms)
          topic: wind_speed_ms
          direction: publish
          publish_on_change: false
        - name: k__wind_gust_ms
          attribute: $ext(k__wind_gust_ms)
          topic: wind_gust_ms
          direction: publish
          publish_on_change: false
        - name: k__brightness_lux
          attribute: $ext(k__brightness_lux)
          topic: brightness_lux
          direction: publish
          publish_on_change: false
        - name: k__rain
          attribute: $ext(k__rain)
          topic: rain
          direction: publish
          publish_on_change: false
        - name: k__rain_rate_mm_h
          attribute: $ext(k__rain_rate_mm_h)
          topic: rain_rate_mm_h
          direction: publish
          publish_on_change: false
        - name: k__wind_direction_deg
          attribute: $ext(k__wind_direction_deg)
          topic: wind_direction_deg
          direction: publish
          publish_on_change: false
        - name: availability
          attribute: $ext(availability)
          topic: availability
          direction: publish
          retain: true
          publish_on_change: false

  - mqtt:
      broker: "$param(mqtt_broker_host)"
      port: "$param(mqtt_broker_port)"
      client_id: "$param(mqtt_discovery_client_id)"
      publish_interval: "$param(mqtt_publish_interval)"
      topic_prefix: homeassistant
      default_qos: 1
      default_retain: true
      bindings:
        - name: _ha_discovery_outdoor_temperature_config
          attribute: $ext(_ha_discovery_outdoor_temperature_config)
          topic: sensor/spx_weather_outdoor_temperature/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_humidity_config
          attribute: $ext(_ha_discovery_humidity_config)
          topic: sensor/spx_weather_humidity/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_pressure_config
          attribute: $ext(_ha_discovery_pressure_config)
          topic: sensor/spx_weather_pressure/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_gateway_availability_config
          attribute: $ext(_ha_discovery_gateway_availability_config)
          topic: sensor/spx_weather_gateway_availability/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_wind_speed_config
          attribute: $ext(_ha_discovery_wind_speed_config)
          topic: sensor/spx_weather_wind_speed/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_wind_gust_config
          attribute: $ext(_ha_discovery_wind_gust_config)
          topic: sensor/spx_weather_wind_gust/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_brightness_config
          attribute: $ext(_ha_discovery_brightness_config)
          topic: sensor/spx_weather_brightness/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_rain_config
          attribute: $ext(_ha_discovery_rain_config)
          topic: binary_sensor/spx_weather_rain/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_rain_rate_config
          attribute: $ext(_ha_discovery_rain_rate_config)
          topic: sensor/spx_weather_rain_rate/config
          direction: publish
          retain: true
          publish_on_change: true
        - name: _ha_discovery_wind_direction_config
          attribute: $ext(_ha_discovery_wind_direction_config)
          topic: sensor/spx_weather_wind_direction/config
          direction: publish
          retain: true
          publish_on_change: true

