name: weather_gateway_wago_pfc200__vaisala_wxt530__mqtt
description: |
  Enterprise-style weather station telemetry published by WAGO PFC200 gateway from Vaisala WXT530 (sim), using HA MQTT Discovery.

attributes:
  outdoor_temperature_c: 5.0
  wind_speed_ms: 3.0
  wind_gust_ms: 6.0
  brightness_lux: 20000.0
  rain:
    type: int
    default: 0
  wind_direction_deg:
    type: int
    default: 180

  availability: "online"

  _ha_discovery_outdoor_temperature_config: |-
    {
      "name": "Outdoor Temperature",
      "unique_id": "spx_weather_outdoor_temperature",
      "state_topic": "spx/weather/outdoor_temperature_c",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "unit_of_measurement": "°C",
      "device_class": "temperature",
      "state_class": "measurement",
      "device": {
        "identifiers": ["vaisala_wxt530_1"],
        "manufacturer": "Vaisala",
        "model": "WXT530 (Sim)",
        "name": "Vaisala WXT530 Weather Transmitter",
        "via_device": "wago_pfc200_gateway_1"
      }
    }

  _ha_discovery_gateway_availability_config: |-
    {
      "name": "Weather Gateway Availability",
      "unique_id": "spx_weather_gateway_availability",
      "state_topic": "spx/weather/availability",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "entity_category": "diagnostic",
      "enabled_by_default": false,
      "device": {
        "identifiers": ["wago_pfc200_gateway_1"],
        "manufacturer": "WAGO",
        "model": "PFC200 (Sim)",
        "name": "Weather Gateway",
        "sw_version": "SPX"
      }
    }

  _ha_discovery_wind_speed_config: |-
    {
      "name": "Wind Speed",
      "unique_id": "spx_weather_wind_speed",
      "state_topic": "spx/weather/wind_speed_ms",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "unit_of_measurement": "m/s",
      "device_class": "wind_speed",
      "state_class": "measurement",
      "device": {
        "identifiers": ["vaisala_wxt530_1"],
        "manufacturer": "Vaisala",
        "model": "WXT530 (Sim)",
        "name": "Vaisala WXT530 Weather Transmitter",
        "via_device": "wago_pfc200_gateway_1"
      }
    }

  _ha_discovery_wind_gust_config: |-
    {
      "name": "Wind Gust",
      "unique_id": "spx_weather_wind_gust",
      "state_topic": "spx/weather/wind_gust_ms",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "unit_of_measurement": "m/s",
      "device_class": "wind_speed",
      "state_class": "measurement",
      "device": {
        "identifiers": ["vaisala_wxt530_1"],
        "manufacturer": "Vaisala",
        "model": "WXT530 (Sim)",
        "name": "Vaisala WXT530 Weather Transmitter",
        "via_device": "wago_pfc200_gateway_1"
      }
    }

  _ha_discovery_brightness_config: |-
    {
      "name": "Brightness",
      "unique_id": "spx_weather_brightness",
      "state_topic": "spx/weather/brightness_lux",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "unit_of_measurement": "lx",
      "device_class": "illuminance",
      "state_class": "measurement",
      "device": {
        "identifiers": ["vaisala_wxt530_1"],
        "manufacturer": "Vaisala",
        "model": "WXT530 (Sim)",
        "name": "Vaisala WXT530 Weather Transmitter",
        "via_device": "wago_pfc200_gateway_1"
      }
    }

  _ha_discovery_rain_config: |-
    {
      "name": "Rain",
      "unique_id": "spx_weather_rain",
      "state_topic": "spx/weather/rain",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "payload_on": "1",
      "payload_off": "0",
      "device_class": "moisture",
      "device": {
        "identifiers": ["vaisala_wxt530_1"],
        "manufacturer": "Vaisala",
        "model": "WXT530 (Sim)",
        "name": "Vaisala WXT530 Weather Transmitter",
        "via_device": "wago_pfc200_gateway_1"
      }
    }

  _ha_discovery_wind_direction_config: |-
    {
      "name": "Wind Direction",
      "unique_id": "spx_weather_wind_direction",
      "state_topic": "spx/weather/wind_direction_deg",
      "availability_topic": "spx/weather/availability",
      "payload_available": "online",
      "payload_not_available": "offline",
      "unit_of_measurement": "°",
      "state_class": "measurement",
      "device": {
        "identifiers": ["vaisala_wxt530_1"],
        "manufacturer": "Vaisala",
        "model": "WXT530 (Sim)",
        "name": "Vaisala WXT530 Weather Transmitter",
        "via_device": "wago_pfc200_gateway_1"
      }
    }

actions: []

communication:
  - mqtt:
      broker: mosquitto-server
      port: 1883
      client_id: spx_weather_gateway_1
      publish_interval: 1.0
      topic_prefix: spx/weather
      default_qos: 1
      default_retain: false
      birth_topic: availability
      birth_payload: online
      birth_retain: true
      will_topic: availability
      will_payload: offline
      will_retain: true
      bindings:
        - attribute: $ext(outdoor_temperature_c)
          topic: outdoor_temperature_c
          direction: publish
          publish_on_change: false
        - attribute: $ext(wind_speed_ms)
          topic: wind_speed_ms
          direction: publish
          publish_on_change: false
        - attribute: $ext(wind_gust_ms)
          topic: wind_gust_ms
          direction: publish
          publish_on_change: false
        - attribute: $ext(brightness_lux)
          topic: brightness_lux
          direction: publish
          publish_on_change: false
        - attribute: $ext(rain)
          topic: rain
          direction: publish
          publish_on_change: false
        - attribute: $ext(wind_direction_deg)
          topic: wind_direction_deg
          direction: publish
          publish_on_change: false
        - attribute: $ext(availability)
          topic: availability
          direction: publish
          retain: true
          publish_on_change: false

  - mqtt:
      broker: mosquitto-server
      port: 1883
      client_id: spx_weather_gateway_1_discovery
      publish_interval: 1.0
      topic_prefix: homeassistant
      default_qos: 1
      default_retain: true
      bindings:
        - attribute: $ext(_ha_discovery_outdoor_temperature_config)
          topic: sensor/spx_weather_outdoor_temperature/config
          direction: publish
          retain: true
          publish_on_change: true
        - attribute: $ext(_ha_discovery_gateway_availability_config)
          topic: sensor/spx_weather_gateway_availability/config
          direction: publish
          retain: true
          publish_on_change: true
        - attribute: $ext(_ha_discovery_wind_speed_config)
          topic: sensor/spx_weather_wind_speed/config
          direction: publish
          retain: true
          publish_on_change: true
        - attribute: $ext(_ha_discovery_wind_gust_config)
          topic: sensor/spx_weather_wind_gust/config
          direction: publish
          retain: true
          publish_on_change: true
        - attribute: $ext(_ha_discovery_brightness_config)
          topic: sensor/spx_weather_brightness/config
          direction: publish
          retain: true
          publish_on_change: true
        - attribute: $ext(_ha_discovery_rain_config)
          topic: binary_sensor/spx_weather_rain/config
          direction: publish
          retain: true
          publish_on_change: true
        - attribute: $ext(_ha_discovery_wind_direction_config)
          topic: sensor/spx_weather_wind_direction/config
          direction: publish
          retain: true
          publish_on_change: true

scenarios:
  clear_day:
    enabled: true
    duration: 20.0
    overrides:
      $in(outdoor_temperature_c): 22.0
      $in(wind_speed_ms): 2.5
      $in(wind_gust_ms): 5.0
      $in(brightness_lux): 48000.0
      $in(rain): 0
      $in(wind_direction_deg): 190

  overcast_cool:
    enabled: true
    duration: 20.0
    overrides:
      $in(outdoor_temperature_c): 9.0
      $in(wind_speed_ms): 4.0
      $in(wind_gust_ms): 7.0
      $in(brightness_lux): 12000.0
      $in(rain): 0
      $in(wind_direction_deg): 230

  rainy_breeze:
    enabled: true
    duration: 20.0
    overrides:
      $in(outdoor_temperature_c): 11.5
      $in(wind_speed_ms): 5.0
      $in(wind_gust_ms): 9.0
      $in(brightness_lux): 8000.0
      $in(rain): 1
      $in(wind_direction_deg): 210

  summer_storm:
    enabled: true
    duration: 20.0
    overrides:
      $in(outdoor_temperature_c): 18.0
      $in(wind_speed_ms): 12.0
      $in(wind_gust_ms): 22.0
      $in(brightness_lux): 4500.0
      $in(rain): 1
      $in(wind_direction_deg): 265

  cold_night:
    enabled: true
    duration: 20.0
    overrides:
      $in(outdoor_temperature_c): -3.0
      $in(wind_speed_ms): 1.5
      $in(wind_gust_ms): 3.5
      $in(brightness_lux): 0.0
      $in(rain): 0
      $in(wind_direction_deg): 140

  wind_sensor_noise:
    actions:
      - noise: $out(wind_speed_ms)
        name: Wind Speed Noise
        description: Adds small proportional jitter to wind speed.
        std: 3.0e-2
        mode: proportional
      - noise: $out(wind_direction_deg)
        name: Wind Direction Noise
        description: Adds small proportional jitter to wind direction.
        std: 2.0e-2
        mode: proportional
      - noise: $out(brightness_lux)
        name: Brightness Noise
        description: Adds small proportional jitter to brightness.
        std: 1.0e-2
        mode: proportional
