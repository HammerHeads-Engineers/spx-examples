# Generic SCPI multimeter model for demonstration purposes.
# name: generic_scpi_multimeter
# description: |
#   Virtual bench multimeter exposing SCPI commands to measure voltage,
#   current, resistance, and frequency. Supports simulated readings across
#   several scenarios that mimic dynamic measurements (static value,
#   ramping signal, and noisy sine wave).

# Core attributes exposed by the instrument. These can be mapped to
# SCPI responses via the ascii protocol configuration below.
attributes:
  voltage: 0.0
  current: 0.0
  resistance: 1000.0
  frequency: 0.0
  # error_queue: []
  # measurement_mode: "voltage"

communication:
  - ascii:
      port: 5025
      terminator: "\n"
      response_delay: 0.05
      response_jitter: 0.02
      # Basic SCPI command mappings
      mappings:
        # Query commands
        "MEAS:VOLT?": "#attr(voltage)"
        "MEAS:CURR?": "#attr(current)"
        "MEAS:RES?": "#attr(resistance)"
        "MEAS:FREQ?": "#attr(frequency)"
        # "SYST:VERS?": "2025.1"
        # # Configuration / state commands
        # "CONF:VOLT":
        #   alias:
        #     - "#attr(measurement_mode) = voltage"
        #   response: "CONF:VOLT"
        # "CONF:CURR":
        #   alias:
        #     - "#attr(measurement_mode) = current"
        #   response: "CONF:CURR"
        # "CONF:RES":
        #   alias:
        #     - "#attr(measurement_mode) = resistance"
        #   response: "CONF:RES"
        # "CONF:FREQ":
        #   alias:
        #     - "#attr(measurement_mode) = frequency"
        #   response: "CONF:FREQ"
        # "CONF:VOLT {value}":
        #   alias: "#attr(voltage) = value"
        #   response: "ACK"
        # "CONF:CURR {value}":
        #   alias: "#attr(current) = value"
        #   response: "ACK"
        # "CONF:RES {value}":
        #   alias: "#attr(resistance) = value"
        #   response: "ACK"
        # "CONF:FREQ {value}":
        #   alias: "#attr(frequency) = value"
        #   response: "ACK"
        # "SYST:ERR?":
        #   response: "#param(__error__)"

