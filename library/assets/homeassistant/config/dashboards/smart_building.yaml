# SPDX-License-Identifier: MIT
title: Smart Building Pack
views:
  - title: Overview
    path: overview
    icon: mdi:office-building-cog
    cards:
      - type: thermostat
        entity: climate.hvac_flexit_nordic
        name: Flexit Nordic

      - type: entities
        title: Flexit Nordic Climate Control
        show_header_toggle: false
        entities:
          - entity: sensor.hvac_flexit_nordic_room_temperature
            name: Room temperature
          - entity: sensor.hvac_flexit_nordic_supply_air_temperature
            name: Supply air
          - entity: sensor.hvac_flexit_nordic_outside_air_temperature
            name: Outside air
          - entity: switch.hvac_flexit_nordic_electric_heater
            name: Electric heater

      - type: grid
        title: Vaisala Weather Sensor
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.vaisala_wxt530_weather_transmitter_outdoor_temperature
            name: Outdoor temp
            graph: line
          - type: sensor
            entity: sensor.vaisala_wxt530_weather_transmitter_humidity
            name: Humidity
            graph: line
          - type: sensor
            entity: sensor.vaisala_wxt530_weather_transmitter_pressure
            name: Pressure
            graph: line
          - type: sensor
            entity: sensor.vaisala_wxt530_weather_transmitter_brightness
            name: Brightness
            graph: line

      - type: grid
        title: Schneider iEM3000 Main Meter
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.spx_iem3000_active_power_total
            name: Active power
            graph: line
          - type: sensor
            entity: sensor.spx_iem3000_current_avg
            name: Average current
            graph: line
          - type: sensor
            entity: sensor.spx_iem3000_voltage_ln_avg
            name: Average L-N voltage
            graph: line
          - type: sensor
            entity: sensor.spx_iem3000_power_factor
            name: Power factor
            graph: line

      - type: grid
        title: Victron Cerbo GX Energy Control
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.spx_victron_cerbo_pv_power
            name: PV production
            graph: line
          - type: sensor
            entity: sensor.spx_victron_cerbo_load_power
            name: Home load
            graph: line
          - type: sensor
            entity: sensor.spx_victron_cerbo_battery_soc
            name: Battery SOC
            graph: line
          - type: sensor
            entity: sensor.spx_victron_cerbo_grid_power
            name: Grid power
            graph: line

      - type: entities
        title: WAGO Utilities
        show_header_toggle: false
        entities:
          - entity: sensor.wago_pfc200_utility_gateway_water_flow
            name: Water flow
          - entity: sensor.wago_pfc200_utility_gateway_water_total
            name: Water total
          - entity: sensor.wago_pfc200_utility_gateway_gas_flow
            name: Gas flow
          - entity: sensor.wago_pfc200_utility_gateway_gas_total
            name: Gas total

      - type: grid
        title: ABB KNX Exterior Lighting
        columns: 2
        square: false
        cards:
          - type: button
            entity: switch.abb_sa_s_ch01
            name: Garden
            icon: mdi:tree
            show_state: true
            tap_action:
              action: toggle
          - type: button
            entity: switch.abb_sa_s_ch02
            name: Garage
            icon: mdi:garage
            show_state: true
            tap_action:
              action: toggle
          - type: button
            entity: switch.abb_sa_s_ch03
            name: Front Porch
            icon: mdi:door
            show_state: true
            tap_action:
              action: toggle
          - type: button
            entity: switch.abb_sa_s_ch04
            name: Driveway
            icon: mdi:car-side
            show_state: true
            tap_action:
              action: toggle

      - type: grid
        title: ABB KNX Blinds
        columns: 2
        square: false
        cards:
          - type: tile
            entity: cover.blind_1
            name: Blind 1
            icon: mdi:blinds
          - type: tile
            entity: cover.blind_2
            name: Blind 2
            icon: mdi:blinds
          - type: tile
            entity: cover.blind_3
            name: Blind 3
            icon: mdi:blinds
          - type: tile
            entity: cover.blind_4
            name: Blind 4
            icon: mdi:blinds

  - title: HVAC
    path: hvac
    icon: mdi:hvac
    cards:
      - type: thermostat
        entity: climate.hvac_flexit_nordic
        name: Flexit Nordic

      - type: entities
        title: Flexit Air Temperatures
        show_header_toggle: false
        entities:
          - entity: sensor.hvac_flexit_nordic_room_temperature
            name: Room
          - entity: sensor.hvac_flexit_nordic_supply_air_temperature
            name: Supply air
          - entity: sensor.hvac_flexit_nordic_extract_air_temperature
            name: Extract air
          - entity: sensor.hvac_flexit_nordic_exhaust_air_temperature
            name: Exhaust air
          - entity: sensor.hvac_flexit_nordic_outside_air_temperature
            name: Outside air

      - type: entities
        title: Flexit Control
        show_header_toggle: false
        entities:
          - entity: switch.hvac_flexit_nordic_electric_heater
            name: Electric heater
          - entity: switch.hvac_flexit_nordic_cooker_hood_mode
            name: Cooker hood mode
          - entity: number.hvac_flexit_nordic_home_supply_fan_setpoint
            name: Home supply fan
          - entity: number.hvac_flexit_nordic_home_extract_fan_setpoint
            name: Home extract fan
          - entity: number.hvac_flexit_nordic_high_supply_fan_setpoint
            name: High supply fan
          - entity: number.hvac_flexit_nordic_high_extract_fan_setpoint
            name: High extract fan

      - type: entities
        title: Fan Setpoints
        show_header_toggle: false
        entities:
          - number.hvac_flexit_nordic_home_supply_fan_setpoint
          - number.hvac_flexit_nordic_home_extract_fan_setpoint
          - number.hvac_flexit_nordic_away_supply_fan_setpoint
          - number.hvac_flexit_nordic_away_extract_fan_setpoint
          - number.hvac_flexit_nordic_high_supply_fan_setpoint
          - number.hvac_flexit_nordic_high_extract_fan_setpoint
          - number.hvac_flexit_nordic_fireplace_supply_fan_setpoint
          - number.hvac_flexit_nordic_fireplace_extract_fan_setpoint

      - type: entities
        title: Diagnostics
        show_header_toggle: false
        entities:
          - binary_sensor.hvac_flexit_nordic_air_filter_polluted
          - sensor.hvac_flexit_nordic_air_filter_operating_time
          - sensor.hvac_flexit_nordic_electric_heater_power
          - sensor.hvac_flexit_nordic_heat_exchanger_efficiency
          - sensor.hvac_flexit_nordic_heat_exchanger_speed
          - sensor.hvac_flexit_nordic_supply_air_fan
          - sensor.hvac_flexit_nordic_exhaust_air_fan

      - type: history-graph
        title: Comfort Trend
        hours_to_show: 6
        entities:
          - entity: sensor.hvac_flexit_nordic_room_temperature
            name: Room
          - entity: sensor.vaisala_wxt530_weather_transmitter_outdoor_temperature
            name: Outdoor
          - entity: sensor.hvac_flexit_nordic_supply_air_temperature
            name: Supply

  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    cards:
