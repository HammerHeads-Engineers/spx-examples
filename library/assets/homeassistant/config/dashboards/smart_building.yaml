      - type: entities
        title: Vaisala Wind And Rain
        show_header_toggle: false
        entities:
          - entity: sensor.vaisala_wxt530_weather_transmitter_wind_speed
            name: Wind speed
          - entity: sensor.vaisala_wxt530_weather_transmitter_wind_gust
            name: Wind gust
          - entity: sensor.vaisala_wxt530_weather_transmitter_wind_direction
            name: Wind direction
          - entity: sensor.vaisala_wxt530_weather_transmitter_rain_rate
            name: Rain rate
          - entity: binary_sensor.vaisala_wxt530_weather_transmitter_rain
            name: Rain

      - type: entities
        title: Vaisala WXT530
        show_header_toggle: false
        entities:
          - sensor.vaisala_wxt530_weather_transmitter_outdoor_temperature
          - sensor.vaisala_wxt530_weather_transmitter_humidity
          - sensor.vaisala_wxt530_weather_transmitter_pressure
          - sensor.vaisala_wxt530_weather_transmitter_brightness
          - sensor.vaisala_wxt530_weather_transmitter_wind_speed
          - sensor.vaisala_wxt530_weather_transmitter_wind_gust
          - sensor.vaisala_wxt530_weather_transmitter_wind_direction
          - sensor.vaisala_wxt530_weather_transmitter_rain_rate
          - binary_sensor.vaisala_wxt530_weather_transmitter_rain

      - type: history-graph
        title: Weather Trend
        hours_to_show: 12
        entities:
          - sensor.vaisala_wxt530_weather_transmitter_outdoor_temperature
          - sensor.vaisala_wxt530_weather_transmitter_humidity
          - sensor.vaisala_wxt530_weather_transmitter_pressure
          - sensor.vaisala_wxt530_weather_transmitter_wind_speed

