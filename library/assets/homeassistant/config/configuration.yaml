# SPDX-License-Identifier: MIT

# Loads default set of integrations. Do not remove.
default_config:

# Keep recorder writes off the installer asset bind mount. The config directory
# is a seeded demo asset; SQLite WAL/SHM writes are more reliable on the
# container filesystem, especially on Docker Desktop bind mounts.
recorder:
  db_url: sqlite:////tmp/home-assistant_v2.db

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    smart-building-pack:
      mode: yaml
      title: Smart Building
      icon: mdi:office-building-cog
      show_in_sidebar: true
      filename: dashboards/smart_building.yaml

# SPX demo integrations -------------------------------------------------------
# NOTE: This file is bundled into installer builds via `library/assets/homeassistant/config`.
modbus:
  - name: spx_iem3000
    type: tcp
    host: spx-server   # <-- IP SPX
    port: 5023
    timeout: 5

    sensors:
      # ===== INPUT REGISTERS (i_r): 3000..3111 =====
      # Float32 = 2 rejestry na wartość

      # Currents (A)
      - name: "SPX iEM3000 Current L1"
        slave: 1
        address: 3000
        input_type: input
        data_type: float32
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      - name: "SPX iEM3000 Current L2"
        slave: 1
        address: 3002
        input_type: input
        data_type: float32
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      - name: "SPX iEM3000 Current L3"
        slave: 1
        address: 3004
        input_type: input
        data_type: float32
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      - name: "SPX iEM3000 Current Avg"
        slave: 1
        address: 3010
        input_type: input
        data_type: float32
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      # Voltages (V) L-N
      - name: "SPX iEM3000 Voltage L1-N"
        slave: 1
        address: 3028
        input_type: input
        data_type: float32
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement

      - name: "SPX iEM3000 Voltage L2-N"
        slave: 1
        address: 3030
        input_type: input
        data_type: float32
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement

      - name: "SPX iEM3000 Voltage L3-N"
        slave: 1
        address: 3032
        input_type: input
        data_type: float32
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement

      - name: "SPX iEM3000 Voltage LN Avg"
        slave: 1
        address: 3036
        input_type: input
        data_type: float32
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement

      # Power (kW / kVA / kVAR)
      - name: "SPX iEM3000 Active Power Total"
        slave: 1
        address: 3060
        input_type: input
        data_type: float32
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement

      - name: "SPX iEM3000 Reactive Power Total"
        slave: 1
        address: 3068
        input_type: input
        data_type: float32
        unit_of_measurement: "kvar"
        state_class: measurement

      - name: "SPX iEM3000 Apparent Power Total"
        slave: 1
        address: 3076
        input_type: input
        data_type: float32
        unit_of_measurement: "kVA"
        state_class: measurement

      # PF + Frequency
      - name: "SPX iEM3000 Power Factor"
        slave: 1
        address: 3084
        input_type: input
        data_type: float32
        device_class: power_factor
        state_class: measurement

      - name: "SPX iEM3000 Frequency"
        slave: 1
        address: 3110
        input_type: input
        data_type: float32
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement

      # ===== HOLDING REGISTERS (h_r): 45100.. =====
      - name: "SPX iEM3000 Energy Import Total"
        slave: 1
        address: 45100
        input_type: holding
        data_type: float32
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "SPX iEM3000 Energy Export Total"
        slave: 1
        address: 45102
        input_type: holding
        data_type: float32
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

