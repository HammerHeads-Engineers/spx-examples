

# knxd.ini — konfiguracja dla trybu "dummy" (wirtualna magistrala)
# Ten plik uruchamia knxd jako serwer KNXnet/IP (tunnel + router) oraz serwer TCP knxd,
# z backendem "dummy" zamiast fizycznego interfejsu KNX. Idealne do testów/SPX.

[main]
# Adres fizyczny knxd (routera/serwera)
addr = 1.1.200
# Zakres adresów dla klientów tunelujących (ETS/SPX)
client-addrs = 1.1.201:16
# Połączenia aktywne: serwer KNXnet/IP, serwer TCP knxd, sterownik dummy
connections =   knxip,api,dummy
# (opcjonalnie) poziom logów: trace|debug|info|notice|warn|error
# loglevel = info

[knxip]
server = ets_router
# Nazwa widoczna w ETS / skanach multicast
name = knxd-dummy
# Umożliwia wykrywanie przez ETS (multicast 224.0.23.12:3671)
discover = true
# Włącz tunneling (liczba równoczesnych sesji)
tunnel = 36
# Włącz funkcję routera multicast (nie jest wymagane dla samego tunelowania)
router = true
port = 3671
interface = eth0  

[api]
server = knxd_tcp
# Port TCP (protokół knxd/eibd) – domyślnie 6720

[dummy]
driver = dummy