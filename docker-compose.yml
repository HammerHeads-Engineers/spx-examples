  spx-server:
    image: simplephysx/spx-server:v1.0.0-rc.42
    container_name: spx-server
    ports:
      - "8000:8000"
      - "8091:8091"
      - "8092:8092" 
      - "502:502"
      - "5025:5025"      # SCPI/ASCII instrument #1 (multimeter)
      - "5026:5026"      # SCPI/ASCII instrument #2 (future use)
      - "${BACNET_BIND_ADDR:-127.0.0.1}:47808:47808/udp" # BACnet fire panel example
      - "${BACNET_BIND_ADDR:-127.0.0.1}:47818:47818/udp" # BACnet security example
    environment:
      SPX_PRODUCT_KEY: ${SPX_PRODUCT_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./extensions:/app/extensions
    command:
      ["--address", "0.0.0.0", "--product-key", "${SPX_PRODUCT_KEY}", "--extensions", "/app/extensions"]

