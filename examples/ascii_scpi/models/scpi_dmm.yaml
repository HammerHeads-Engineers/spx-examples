# SPDX-License-Identifier: MIT
name: scpi_dmm
description: |
  Example SCPI digital multimeter model for ASCII/TCP demos.

attributes:
  idn: "SPX,SCPI_DMM,DMM0001,1.0"

  k__mode: "VOLT:DC"
  k__range_v: 10.0

  voltage_readback_v: 1.234
  resistance_readback_ohm: 1000.0
  readback_value: 1.234

  error_status: "0,No error"

actions:
  - function: $in(readback_value)
    name: update_readback
    call: |
      ($in(voltage_readback_v)
       if $in(k__mode) == "VOLT:DC"
       else $in(resistance_readback_ohm))

communication:
  - ascii:
      terminator: "\n"
      response_delay: 0.01
      response_jitter: 0.0
      mappings:
        "*IDN?": "#out(idn)"

        "CONF:VOLT:DC":
          "#attr(k__mode)": "VOLT:DC"
        "CONF:VOLT:DC {range}":
          "#attr(k__mode)": "VOLT:DC"
          "#attr(k__range_v)": "range"

        "MEAS:VOLT:DC?": "#out(voltage_readback_v)"
        "MEAS:RES?": "#out(resistance_readback_ohm)"
        "READ?": "#out(readback_value)"

        "SYST:ERR?": "#out(error_status)"
