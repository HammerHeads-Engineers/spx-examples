name: bms_quickstart
description: |
  Minimal smart-building baseline containing environmental telemetry, HVAC control
  and weather backhaul so installers can validate MQTT/Modbus wiring quickly.
models:
  - library/domains/iot/generic/environment_sensor__mqtt.yaml
  - library/domains/iot/generic/environment_sensor__lwm2m.yaml
  - library/domains/iot/generic/air_quality_station__http.yaml
  - library/domains/thermal_controllers/generic/thermal_controller__modbus.yaml
  - library/domains/iot/generic/hvac_flexit_nordic__bacnet.yaml
  - library/domains/iot/generic/energy_meter_iem3000__modbus.yaml
  - library/domains/iot/abb/abb_d13_15__modbus.yaml
  - library/domains/weather/weather_forecast__http.yaml
  - library/domains/weather/weather_gateway_wago_pfc200__vaisala_wxt530__mqtt.yaml
  - library/domains/iot/generic/bms_controller__opcua.yaml
  - library/domains/iot/generic/lighting_panel__opcua.yaml
  - library/domains/iot/generic/room_controller__knx.yaml
  - library/domains/iot/generic/lighting_zone__knx.yaml
  - library/domains/iot/abb/abb_sa_s12_16_5_1__knx.yaml
  - library/domains/iot/abb/abb_jra_s4_230_5_1__knx.yaml
  - library/domains/iot/generic/thermostat__matter.yaml
  - library/domains/iot/generic/smart_plug__matter.yaml
  - library/domains/iot/generic/fire_alarm_panel__bacnet.yaml
  - library/domains/iot/generic/security_access_controller__bacnet.yaml
services:
  - mqtt_broker
  - modbus_tcp_gateway
  - bacnet_gateway
  - lwm2m_server
  - http_gateway
  - opcua_server
  - knx_gateway
  - homeassistant_bridge
  - matter_server
