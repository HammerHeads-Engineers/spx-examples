  BLE health wearable regression profile pairing the vital signs monitor with
  temperature probes to exercise btvirt-driven CI pipelines.
models:
  - library/domains/lab/monitor/generic/vital_signs_monitor__ble_gatt.yaml
  - library/domains/lab/sensor/generic/temperature_sensor__ble_gatt.yaml
services:
  - btvirt_adapter
  - mqtt_broker
