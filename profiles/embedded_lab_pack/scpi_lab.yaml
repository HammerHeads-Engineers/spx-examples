name: scpi_lab
description: |
  SCPI-focused lab harness bundling the virtual multimeter, oscilloscope, and
  DP800 power supply so VISA/TCP test benches can run deterministically.
models:
  - library/domains/measurement_instruments/generic/multimeter__scpi.yaml
  - library/domains/measurement_instruments/generic/digital_multimeter__scpi.yaml
  - library/domains/measurement_instruments/generic/bench_power_supply__scpi.yaml
  - library/domains/measurement_instruments/siglent/siglent_sdm3055__scpi.yaml
  - library/domains/measurement_instruments/siglent/siglent_sdg1032x__scpi.yaml
  - library/domains/measurement_instruments/siglent/siglent_sds1000x_e__scpi.yaml
  - library/domains/measurement_instruments/keysight/keysight_infiniivision_1000x__scpi.yaml
  - library/domains/measurement_instruments/tektronix/tektronix_mdo3000__scpi.yaml
  - library/domains/measurement_instruments/rigol/rigol_ds1000z__scpi.yaml
  - library/domains/measurement_instruments/rigol/rigol_dp800__scpi.yaml
  - library/domains/vacuum_systems/generic/vacuum_gauge__modbus.yaml
  - library/domains/iot/prevac/prevac_m600dc_ps__modbus.yaml
  - library/domains/iot/prevac/prevac_m1600pdc_ps__modbus.yaml
  - library/domains/iot/prevac/prevac_tsp04_ps__modbus.yaml
  - library/domains/iot/prevac/prevac_xr40b_ec__modbus.yaml
  - library/domains/thermal_controllers/prevac/prevac_bcu14__modbus.yaml
services:
  - scpi_tcp_stack
  - modbus_tcp_gateway
