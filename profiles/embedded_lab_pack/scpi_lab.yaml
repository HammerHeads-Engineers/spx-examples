name: scpi_lab
description: |
  SCPI-focused lab harness bundling the virtual multimeter, oscilloscope, and
  DP800 power supply so VISA/TCP test benches can run deterministically.
models:
  - library/domains/lab/instrument/generic/multimeter__scpi.yaml
  - library/domains/lab/digital_multimeter/generic/digital_multimeter__scpi.yaml
  - library/domains/lab/power_supply/generic/bench_power_supply__scpi.yaml
  - library/domains/lab/power_supply/keysight/keysight_e36312a__scpi.yaml
  - library/domains/lab/digital_multimeter/siglent/siglent_sdm3055__scpi.yaml
  - library/domains/lab/digital_multimeter/tektronix/tektronix_dmm4050__scpi.yaml
  - library/domains/lab/digital_multimeter/rohde_schwarz/rohde_schwarz_hmc8012__scpi.yaml
  - library/domains/lab/power_analyzer/rohde_schwarz/rohde_schwarz_hmc8015__scpi.yaml
  - library/domains/lab/power_supply/rohde_schwarz/rohde_schwarz_hmp4040__scpi.yaml
  - library/domains/lab/function_generator/siglent/siglent_sdg1032x__scpi.yaml
  - library/domains/lab/electronic_load/siglent/siglent_sdl1000x__scpi.yaml
  - library/domains/lab/power_supply/siglent/siglent_spd1000x__scpi.yaml
  - library/domains/lab/oscilloscope/siglent/siglent_sds1000x_e__scpi.yaml
  - library/domains/lab/oscilloscope/siglent/siglent_sds2000x_hd__scpi.yaml
  - library/domains/lab/spectrum_analyzer/siglent/siglent_ssa3000x__scpi.yaml
  - library/domains/lab/oscilloscope/keysight/keysight_infiniivision_1000x__scpi.yaml
  - library/domains/lab/oscilloscope/rohde_schwarz/rohde_schwarz_hmo1002__scpi.yaml
  - library/domains/lab/oscilloscope/tektronix/tektronix_mdo3000__scpi.yaml
  - library/domains/lab/oscilloscope/rigol/rigol_ds1000z__scpi.yaml
  - library/domains/lab/oscilloscope/rigol/rigol_mso5000__scpi.yaml
  - library/domains/lab/power_supply/rigol/rigol_dp800__scpi.yaml
  - library/domains/industrial/sensor/generic/vacuum_gauge__modbus.yaml
  - library/domains/lab/magnetron_power_supply/prevac/prevac_m600dc_ps__modbus.yaml
  - library/domains/lab/magnetron_power_supply/prevac/prevac_m1600pdc_ps__modbus.yaml
  - library/domains/lab/sublimation_pump_power_supply/prevac/prevac_tsp04_ps__modbus.yaml
  - library/domains/lab/xray_source_emission_controller/prevac/prevac_xr40b_ec__modbus.yaml
  - library/domains/lab/controller/prevac/prevac_bcu14__modbus.yaml
services:
  - scpi_tcp_stack
  - modbus_tcp_gateway
