# SPDX-License-Identifier: MIT
name: ev_csms_demo
description: |
  Minimal EV/DER orchestration profile showcasing the built-in OCPP 1.6 handshake
  between a simulated charge point and central system (BootNotification + Heartbeat +
  StatusNotification/MeterValues).
models:
  - library/domains/energy/csms/generic/csms__ocpp.yaml
  - library/domains/energy/evse/generic/evse__ocpp.yaml
  - library/domains/energy/meter/schneider/schneider_pm5560__modbus.yaml
  - library/domains/energy/evse/siemens/siemens_versicharge_ac__modbus.yaml
services:
  - ocpp_central_system
  - modbus_tcp_gateway
