[tool.poetry]
name = "spx-examples"
version = "1.1.0-rc.56"
description = "Runnable SPX examples and smoke tests using the Python client against SPX Server."
authors = ["Aleksander Stanik <aleksander.stanik@hammerheadsengineers.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "installer" },
    { include = "spx_mcp" },
    { include = "tools" },
]

[tool.poetry.dependencies]
python = "^3.9"
spx-python = "1.0.0-rc.3"           # SPX Python client for talking to the server
mcp = {version = "^1.26.0", python = ">=3.10,<4.0"}  # Official MCP SDK (optional for the local MCP tool)
numpy = "*"      # Py3.9-compatible upper bound
plotly = "*"
scipy = "*"      # Py3.9-compatible upper bound
pyyaml = "*"
modbus_tk = "*"
pymodbus = "*"
paho-mqtt = "^2.1.0"
bleak = "^1.1.1"
colorama = "^0.4.6"
bacpypes = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
coverage = "^7.3.1"
black = "*"
isort = "*"
flake8 = "*"
commitizen = "*"
gitpython = "<3.1.60"  # semantic-release currently uses Actor.name_email_regex
python-semantic-release = "*"  # keep versioning & changelog automation


[tool.poetry.scripts]
spx-mcp = "spx_mcp.cli:main"


[tool.semantic_release]
# Use pyproject version as the single source of truth
version_toml = [
    "pyproject.toml:tool.poetry.version"
]
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.branches.alpha]
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
