[tool.poetry]
name = "spx-examples"
version = "0.1.0"
description = "Runnable SPX examples and smoke tests using the Python client against SPX Server."
authors = ["Aleksander Stanik <aleksander.stanik@hammerheadsengineers.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "spx_mcp" },
    { include = "tools" },
]

[tool.poetry.dependencies]
certifi = ">=2026.10.19"
python = "^3.9"
spx-python = "1.0.0-rc.3"           # SPX Python client for talking to the server
mcp = {version = "^1.26.0", python = ">=3.10,<4.0"}  # Official MCP SDK (optional for the local MCP tool)
numpy = [
  { version = "<2.1", python = "<3.13" },
  { version = ">=2.1,<2.2", python = ">=3.13" },
]  # Python 3.13 wheels for the security-fixed bundled runtime
plotly = "*"
scipy = [
  { version = "<1.14", python = "<3.13" },
  { version = ">=1.14,<1.15", python = ">=3.13" },
]
pyyaml = "*"
modbus_tk = "*"
pymodbus = "*"
paho-mqtt = "^2.1.0"
bleak = "^1.1.1"
colorama = "^0.4.6"
bacpypes = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
coverage = "^7.3.1"
black = "*"
isort = "*"
flake8 = "*"


[tool.poetry.scripts]
spx-mcp = "spx_mcp.cli:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
