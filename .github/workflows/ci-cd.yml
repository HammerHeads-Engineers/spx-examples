name: CI

on:
  push:
    branches:
      - main
      - develop
      - feat/**
      - feature/**
      - fix/**
      - perf/**
      - performance/**
      - ci/**
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SPX_PRODUCT_KEY: ${{ secrets.SPX_PRODUCT_KEY }}
      SPX_BASE_URL: http://localhost:8000
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9.19, 3.10.14, 3.11.9, 3.12.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with=dev --no-root --no-interaction --no-ansi

      - name: Validate model definitions
        run: poetry run python tools/validate_models.py

      - name: Start SPX server (Docker Compose)
        if: ${{ env.SPX_PRODUCT_KEY != '' }}
        run: docker compose up -d

      - name: Wait for SPX server health
        if: ${{ env.SPX_PRODUCT_KEY != '' }}
        shell: bash
        run: |
          for i in {1..24}; do
            if curl -fsS http://localhost:8000/ > /dev/null; then
              echo "SPX server is healthy"; exit 0; fi
            echo "Waiting for SPX server to be healthy... ($i/24)"; sleep 5;
          done
          echo "SPX server failed to become healthy"; docker compose logs --no-color; exit 1

      - name: Run unit tests
        shell: bash
        run: |
          if [ -f pytest.ini ] || [ -d tests ] || grep -q "\[tool.pytest.ini_options\]" pyproject.toml 2>/dev/null; then
            poetry run pytest -q
          else
            poetry run python -m unittest discover -s tests -p "test_*.py"
          fi

      - name: Show server logs on failure
        if: ${{ failure() && env.SPX_PRODUCT_KEY != '' }}
        run: docker compose logs --no-color

      - name: Stop SPX server
        if: always()
        run: docker compose down --remove-orphans

  pack-tests:
    needs: tests
    runs-on: ubuntu-latest
    env:
      SPX_PRODUCT_KEY: ${{ secrets.SPX_PRODUCT_KEY }}
      SPX_BASE_URL: http://localhost:8000
      MQTT_TEST_BROKER_HOST_CONTAINER: mqtt_broker
      OPEN_METEO_TEST_HOST: 127.0.0.1
      AIR_QUALITY_TEST_HOST: 127.0.0.1
    strategy:
      fail-fast: false
      matrix:
        pack:
          - industrial_iiot_pack
          - embedded_lab_pack
          - energy_pack
          - smart_building_pack

    steps:
      - name: Gate pack tests on SPX_PRODUCT_KEY
        id: gate
        shell: bash
        run: |
          if [ -n "${SPX_PRODUCT_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SPX_PRODUCT_KEY is not set; skipping pack tests."
          fi

      - name: Checkout repository
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.14

      - name: Install Poetry
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: pipx install poetry

      - name: Install dependencies
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: poetry install --with=dev --no-root --no-interaction --no-ansi

      - name: Generate installer artifacts (non-interactive)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          mkdir -p "${OUT_DIR}"
          poetry run python -m installer generate \
            --packages "${{ matrix.pack }}" \
            --output "${OUT_DIR}" \
            --product-key "${SPX_PRODUCT_KEY}" \
            --no-start \
            --print-selection json > "${OUT_DIR}/selection.json"

      - name: Start stack (generated spx-start.sh)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          export PYTHON_BIN="$(poetry run python -c 'import sys; print(sys.executable)')"
          export NPM_CONFIG_PREFIX="${HOME}/.npm-global"
          mkdir -p "${NPM_CONFIG_PREFIX}"
          export PATH="${NPM_CONFIG_PREFIX}/bin:${PATH}"
          "${OUT_DIR}/spx-start.sh"

      - name: Wait for SPX server health
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          for i in {1..36}; do
            if curl -fsS http://localhost:8000/ > /dev/null; then
              echo "SPX server is healthy"; exit 0; fi
            echo "Waiting for SPX server to be healthy... ($i/36)"; sleep 5;
          done
          echo "SPX server failed to become healthy"; exit 1

      - name: Wait for MQTT broker port
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1; then
              echo "MQTT broker is reachable"; exit 0; fi
            echo "Waiting for MQTT broker... ($i/30)"; sleep 2;
          done
          echo "MQTT broker did not become reachable on 127.0.0.1:1883"; exit 1

      - name: Run pack tests
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          poetry run pytest -q "tests/packs/${{ matrix.pack }}"

      - name: Show stack logs on failure
        if: ${{ failure() && steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          docker compose -f "${OUT_DIR}/docker-compose.generated.yml" --env-file "${OUT_DIR}/.env" logs --no-color

      - name: Stop stack
        if: ${{ always() && steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          "${OUT_DIR}/spx-stop.sh"

  build-installer:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build installer package
        run: |
          chmod +x scripts/build_installer_package.sh scripts/build_self_extractors.sh
          scripts/build_installer_package.sh --package-name "spx-installer"
          scripts/build_self_extractors.sh --version "${{ github.ref_name }}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: SPX Installer ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset (.tgz)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/spx-installer.tgz
          asset_name: spx-installer-${{ github.ref_name }}.tgz
          asset_content_type: application/gzip

      - name: Upload Release Asset (.run)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/spx-installer-${{ github.ref_name }}.run
          asset_name: spx-installer-${{ github.ref_name }}.run
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (.ps1)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/spx-installer-${{ github.ref_name }}.ps1
          asset_name: spx-installer-${{ github.ref_name }}.ps1
          asset_content_type: text/plain

      - name: Publish generic package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME="spx-installer"
          VERSION="${{ github.ref_name }}"
          upload_pkg() {
            local file="$1"
            curl -L \
              -X PUT \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${file}" \
              "https://uploads.github.com/repos/${{ github.repository }}/packages/generic/${PKG_NAME}/${VERSION}/$(basename "${file}")"
          }
          upload_pkg "dist/spx-installer.tgz"
          upload_pkg "dist/spx-installer-${VERSION}.run"
          upload_pkg "dist/spx-installer-${VERSION}.ps1"
