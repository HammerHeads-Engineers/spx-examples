# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches:
      - main
      - develop
      - feat/**
      - feature/**
      - fix/**
      - perf/**
      - performance/**
      - ci/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  pr-title-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "PR title must follow Conventional Commits."
            echo "Expected: type(scope): subject"
            echo "Examples:"
            echo "  feat(models): add abb m1m modbus smoke coverage"
            echo "  fix(ci): skip semantic release when no releasable commits"
            echo "Current title: ${PR_TITLE}"
            exit 1
          fi

      - name: Skip PR title validation for non-PR events
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Skipping PR title validation for event '${{ github.event_name }}'."

  tests:
    needs: pr-title-gate
    runs-on: ubuntu-latest
    env:
      SPX_PRODUCT_KEY: ${{ secrets.SPX_PRODUCT_KEY }}
      SPX_BASE_URL: http://localhost:8000
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9.19, 3.10.14, 3.11.9, 3.12.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with=dev --no-root --no-interaction --no-ansi

      - name: Fetch develop baseline
        run: git fetch origin develop

      - name: Guard model-yaml branch against duplicate/replay additions
        run: poetry run python tools/check_model_branch_guard.py --base-ref origin/develop

      - name: Validate model definitions
        run: poetry run python tools/validate_models.py

      - name: Start SPX server (Docker Compose)
        if: ${{ env.SPX_PRODUCT_KEY != '' }}
        run: docker compose up -d

      - name: Wait for SPX server health
        if: ${{ env.SPX_PRODUCT_KEY != '' }}
        shell: bash
        run: |
          for i in {1..24}; do
            if curl -fsS http://localhost:8000/ > /dev/null; then
              echo "SPX server is healthy"; exit 0; fi
            echo "Waiting for SPX server to be healthy... ($i/24)"; sleep 5;
          done
          echo "SPX server failed to become healthy"; docker compose logs --no-color; exit 1

      - name: Run unit tests
        shell: bash
        run: |
          if [ -f pytest.ini ] || [ -d tests ] || grep -q "\[tool.pytest.ini_options\]" pyproject.toml 2>/dev/null; then
            poetry run pytest -q
          else
            poetry run python -m unittest discover -s tests -p "test_*.py"
          fi

      - name: Show server logs on failure
        if: ${{ failure() && env.SPX_PRODUCT_KEY != '' }}
        run: docker compose logs --no-color

      - name: Stop SPX server
        if: always()
        run: docker compose down --remove-orphans

  pack-tests:
    needs: tests
    runs-on: ubuntu-latest
    env:
      SPX_PRODUCT_KEY: ${{ secrets.SPX_PRODUCT_KEY }}
      SPX_BASE_URL: http://localhost:8000
      MQTT_TEST_BROKER_HOST_CONTAINER: mqtt_broker
      OPEN_METEO_TEST_HOST: 127.0.0.1
      AIR_QUALITY_TEST_HOST: 127.0.0.1
    strategy:
      fail-fast: false
      matrix:
        pack:
          - industrial_iiot_pack
          - embedded_lab_pack
          - energy_pack
          - smart_building_pack

    steps:
      - name: Gate pack tests on SPX_PRODUCT_KEY
        id: gate
        shell: bash
        run: |
          if [ -n "${SPX_PRODUCT_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SPX_PRODUCT_KEY is required for pack tests."
            exit 1
          fi

      - name: Checkout repository
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.14

      - name: Install Poetry
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: pipx install poetry

      - name: Install dependencies
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: poetry install --with=dev --no-root --no-interaction --no-ansi

      - name: Generate installer artifacts (non-interactive)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          mkdir -p "${OUT_DIR}"
          poetry run python -m installer generate \
            --packages "${{ matrix.pack }}" \
            --output "${OUT_DIR}" \
            --product-key "${SPX_PRODUCT_KEY}" \
            --no-start \
            --print-selection json > "${OUT_DIR}/selection.json"

      - name: Start stack (generated spx-start.sh)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          PYTHON_BIN="$(poetry run python -c 'import sys; print(sys.executable)')"
          export PYTHON_BIN
          export NPM_CONFIG_PREFIX="${HOME}/.npm-global"
          mkdir -p "${NPM_CONFIG_PREFIX}"
          export PATH="${NPM_CONFIG_PREFIX}/bin:${PATH}"
          "${OUT_DIR}/spx-start.sh"

      - name: Wait for SPX server health
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          for i in {1..36}; do
            if curl -fsS http://localhost:8000/ > /dev/null; then
              echo "SPX server is healthy"; exit 0; fi
            echo "Waiting for SPX server to be healthy... ($i/36)"; sleep 5;
          done
          echo "SPX server failed to become healthy"; exit 1

      - name: Wait for MQTT broker port
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1; then
              echo "MQTT broker is reachable"; exit 0; fi
            echo "Waiting for MQTT broker... ($i/30)"; sleep 2;
          done
          echo "MQTT broker did not become reachable on 127.0.0.1:1883"; exit 1

      - name: Wait for Home Assistant
        if: ${{ steps.gate.outputs.enabled == 'true' && matrix.pack == 'smart_building_pack' }}
        shell: bash
        run: |
          for i in {1..60}; do
            status="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8123/api/ || true)"
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then
              echo "Home Assistant API is reachable (HTTP ${status})"; exit 0; fi
            echo "Waiting for Home Assistant... ($i/60)"; sleep 2;
          done
          echo "Home Assistant did not become reachable on http://localhost:8123/api/"; exit 1

      - name: Run pack tests
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          poetry run pytest -q "tests/packs/${{ matrix.pack }}"

      - name: Show stack logs on failure
        if: ${{ failure() && steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          docker compose -f "${OUT_DIR}/docker-compose.generated.yml" --env-file "${OUT_DIR}/.env" logs --no-color

      - name: Stop stack
        if: ${{ always() && steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          OUT_DIR: build/ci/${{ matrix.pack }}
        run: |
          "${OUT_DIR}/spx-stop.sh"

  release:
    outputs:
      released: ${{ steps.release_result.outputs.released }}
      tag: ${{ steps.release_result.outputs.tag }}
    runs-on: ubuntu-latest
    concurrency: release
    needs: pack-tests
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    env:
      SPX_RELEASE_TOKEN: ${{ secrets.SPX_RELEASE_TOKEN }}
    steps:
      - name: Setup | Checkout Repository at workflow sha
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SPX_RELEASE_TOKEN }}
          ref: ${{ github.sha }}

      - name: Setup | Force correct release branch on workflow sha
        run: |
          git checkout -B ${{ github.ref_name }} ${{ github.sha }}

      - name: Install Poetry
        shell: bash
        run: pipx install poetry

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: poetry install --with=dev --no-root --no-interaction --no-ansi

      - name: Precheck releasable commits
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "${last_tag}" ]; then
            range="${last_tag}..HEAD"
          else
            root="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            range="${root}..HEAD"
          fi

          echo "Checking releasable commits in range: ${range}"
          if git log --format='%s%n%b' "${range}" | grep -Eiq '^(feat|fix|perf)(\([^)]+\))?!?: |BREAKING CHANGE:'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Detected releasable commit."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commit found (feat/fix/perf/BREAKING CHANGE)."
          fi

      - name: Skip release (no releasable commits)
        if: steps.release_gate.outputs.should_release != 'true'
        run: |
          echo "Skipping semantic-release: no releasable commits since latest tag."

      - name: Semantic Version Release
        id: release
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPX_RELEASE_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          poetry run semantic-release -v version

      - name: Build installer artifacts
        if: steps.release.outputs.released == 'true'
        run: |
          chmod +x scripts/build_installer_package.sh scripts/build_self_extractors.sh
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          scripts/build_installer_package.sh --package-name "spx-installer" --version "${version}"
          scripts/build_self_extractors.sh --version "${version}"

      - name: Upload installer assets to GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.SPX_RELEASE_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          gh release upload "${tag}" \
            "dist/spx-installer-${version}.tgz" \
            "dist/spx-installer-${version}.run" \
            "dist/spx-installer-${version}.ps1" \
            --clobber

      - name: Export release result for downstream artifact jobs
        id: release_result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.release.outputs.released }}" == "true" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows-installer:
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Poetry
        shell: pwsh
        run: python -m pip install --upgrade pip poetry

      - name: Install repository dependencies
        shell: pwsh
        run: poetry install --with=dev --no-root --no-interaction --no-ansi

      - name: Install WiX Toolset v6 CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "6.*"
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          $env:Path = "$toolPath;$env:Path"
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixVersion = ((wix --version) -split '\+')[0].Trim()
          wix extension add --global "WixToolset.BootstrapperApplications.wixext/$wixVersion"
          wix extension add --global "WixToolset.Util.wixext/$wixVersion"
          wix extension list --global

      - name: Build Windows installer
        shell: pwsh
        run: |
          & .\packaging\windows\Build.ps1 `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -BuildRoot build/windows

      - name: Validate Windows installer artifact
        id: windows_artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path "build/windows/artifacts" -Filter "spx-installer-*.exe" -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected exactly one Windows installer bundle, found $($artifacts.Count)."
          }
          "path=build/windows/artifacts/$($artifacts[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spx-installer-${{ needs.release.outputs.tag }}-windows
          path: ${{ steps.windows_artifact.outputs.path }}
          if-no-files-found: error

      - name: Upload Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SPX_RELEASE_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" `
            "${{ steps.windows_artifact.outputs.path }}" `
            --clobber

  build-macos-installer:
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true'
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Prepare macOS signing and notarization
        shell: bash
        env:
          MACOS_APP_SIGN_IDENTITY: ${{ vars.MACOS_APP_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_APP_CERT_P12_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail

          : "${MACOS_APP_SIGN_IDENTITY:?Missing MACOS_APP_SIGN_IDENTITY}"
          : "${MACOS_INSTALLER_SIGN_IDENTITY:?Missing MACOS_INSTALLER_SIGN_IDENTITY}"
          : "${MACOS_NOTARY_KEY_ID:?Missing MACOS_NOTARY_KEY_ID}"
          : "${MACOS_NOTARY_ISSUER_ID:?Missing MACOS_NOTARY_ISSUER_ID}"
          : "${MACOS_NOTARY_PROFILE:?Missing MACOS_NOTARY_PROFILE}"
          : "${MACOS_CERT_PASSWORD:?Missing MACOS_CERT_PASSWORD}"
          : "${MACOS_APP_CERT_P12_BASE64:?Missing MACOS_APP_CERT_P12_BASE64}"
          : "${MACOS_INSTALLER_CERT_P12_BASE64:?Missing MACOS_INSTALLER_CERT_P12_BASE64}"
          : "${MACOS_NOTARY_KEY_BASE64:?Missing MACOS_NOTARY_KEY_BASE64}"

          keychain_path="${RUNNER_TEMP}/spx-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          app_p12_path="${RUNNER_TEMP}/developer-id-application.p12"
          installer_p12_path="${RUNNER_TEMP}/developer-id-installer.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"

          printf '%s' "${MACOS_APP_CERT_P12_BASE64}" | base64 -D > "${app_p12_path}"
          printf '%s' "${MACOS_INSTALLER_CERT_P12_BASE64}" | base64 -D > "${installer_p12_path}"
          printf '%s' "${MACOS_NOTARY_KEY_BASE64}" | base64 -D > "${notary_key_path}"
          chmod 600 "${app_p12_path}" "${installer_p12_path}" "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          for certificate_path in "${app_p12_path}" "${installer_p12_path}"; do
            security import "${certificate_path}" \
              -f pkcs12 \
              -k "${keychain_path}" \
              -P "${MACOS_CERT_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild
          done

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          app_identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
          if [[ "${app_identity_output}" != *"${MACOS_APP_SIGN_IDENTITY}"* ]]; then
            echo "Developer ID Application identity was not imported." >&2
            exit 1
          fi
          installer_identity_output="$(security find-identity -v -p basic "${keychain_path}")"
          if [[ "${installer_identity_output}" != *"${MACOS_INSTALLER_SIGN_IDENTITY}"* ]]; then
            echo "Developer ID Installer identity was not imported." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "${MACOS_NOTARY_PROFILE}" \
            --key "${notary_key_path}" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER_ID}" \
            --keychain "${keychain_path}"

          {
            echo "MACOS_SIGNING_KEYCHAIN=${keychain_path}"
            echo "MACOS_SIGNING_APP_P12=${app_p12_path}"
            echo "MACOS_SIGNING_INSTALLER_P12=${installer_p12_path}"
            echo "MACOS_SIGNING_NOTARY_KEY=${notary_key_path}"
          } >> "${GITHUB_ENV}"

      - name: Build macOS installer package
        id: macos_package
        shell: bash
        env:
          MACOS_APP_SIGN_IDENTITY: ${{ vars.MACOS_APP_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          chmod +x scripts/build_macos_pkg.sh
          tag="${{ needs.release.outputs.tag }}"
          version="${tag#v}"
          if [[ -z "${version}" ]]; then
            echo "Unable to resolve package version from release tag." >&2
            exit 1
          fi
          scripts/build_macos_pkg.sh \
            --version "${version}" \
            --python-version "3.12.10" \
            --app-sign "${MACOS_APP_SIGN_IDENTITY}" \
            --sign "${MACOS_INSTALLER_SIGN_IDENTITY}" \
            --keychain "${MACOS_SIGNING_KEYCHAIN}" \
            --notarytool-profile "${MACOS_NOTARY_PROFILE}"
          echo "path=dist/spx-installer-macos-${version}.pkg" >> "${GITHUB_OUTPUT}"

      - name: Validate macOS installer artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.macos_package.outputs.path }}"
          pkgutil --check-signature "${{ steps.macos_package.outputs.path }}"
          inspection_dir="${RUNNER_TEMP}/spx-macos-package-inspection"
          pkgutil --expand-full \
            "${{ steps.macos_package.outputs.path }}" \
            "${inspection_dir}"
          spx_component="$(find "${inspection_dir}" -maxdepth 1 -name '*-component.pkg' ! -name '*-python-component.pkg' -print -quit)"
          python_component="$(find "${inspection_dir}" -maxdepth 1 -name '*-python-component.pkg' -print -quit)"
          test -n "${spx_component}"
          test -n "${python_component}"
          pkgutil --check-signature "${spx_component}"
          pkgutil --check-signature "${python_component}"
          xcrun stapler validate "${{ steps.macos_package.outputs.path }}"
          spctl -a -vv -t install "${{ steps.macos_package.outputs.path }}"

      - name: Upload macOS installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spx-installer-${{ needs.release.outputs.tag }}-macos
          path: ${{ steps.macos_package.outputs.path }}
          if-no-files-found: error

      - name: Upload macOS installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SPX_RELEASE_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            "${{ steps.macos_package.outputs.path }}" \
            --clobber

      - name: Clean up macOS signing material
        if: always()
        shell: bash
        run: |
          set +e
          security delete-keychain "${MACOS_SIGNING_KEYCHAIN:-${RUNNER_TEMP}/spx-signing.keychain-db}" \
            >/dev/null 2>&1
          rm -f \
            "${MACOS_SIGNING_APP_P12:-${RUNNER_TEMP}/developer-id-application.p12}" \
            "${MACOS_SIGNING_INSTALLER_P12:-${RUNNER_TEMP}/developer-id-installer.p12}" \
            "${MACOS_SIGNING_NOTARY_KEY:-${RUNNER_TEMP}/AuthKey_${{ vars.MACOS_NOTARY_KEY_ID }}.p8}"

  release-verification:
    needs: [release, build-windows-installer, build-macos-installer]
    if: >-
      always() &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SPX_RELEASE_TOKEN }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Verify platform build jobs succeeded
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.build-windows-installer.result }}" != "success" ]]; then
            echo "Windows installer job did not succeed: ${{ needs.build-windows-installer.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.build-macos-installer.result }}" != "success" ]]; then
            echo "macOS installer job did not succeed: ${{ needs.build-macos-installer.result }}" >&2
            exit 1
          fi

      - name: Verify complete GitHub Release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          printf '%s\n' "${assets}"

          expected_assets=(
            "spx-installer-${version}.tgz"
            "spx-installer-${version}.run"
            "spx-installer-${version}.ps1"
            "spx-installer-${version}.exe"
            "spx-installer-macos-${version}.pkg"
          )
          for expected in "${expected_assets[@]}"; do
            if ! grep -Fxq "${expected}" <<<"${assets}"; then
              echo "Missing release asset: ${expected}" >&2
              exit 1
            fi
          done
