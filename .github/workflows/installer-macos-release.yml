# SPDX-License-Identifier: MIT
name: macOS installer release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without the leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.17"

      - name: Prepare macOS signing and notarization
        shell: bash
        env:
          MACOS_APP_SIGN_IDENTITY: ${{ vars.MACOS_APP_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_APP_CERT_P12_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail

          : "${MACOS_APP_SIGN_IDENTITY:?Missing MACOS_APP_SIGN_IDENTITY}"
          : "${MACOS_INSTALLER_SIGN_IDENTITY:?Missing MACOS_INSTALLER_SIGN_IDENTITY}"
          : "${MACOS_NOTARY_KEY_ID:?Missing MACOS_NOTARY_KEY_ID}"
          : "${MACOS_NOTARY_ISSUER_ID:?Missing MACOS_NOTARY_ISSUER_ID}"
          : "${MACOS_NOTARY_PROFILE:?Missing MACOS_NOTARY_PROFILE}"
          : "${MACOS_CERT_PASSWORD:?Missing MACOS_CERT_PASSWORD}"
          : "${MACOS_APP_CERT_P12_BASE64:?Missing MACOS_APP_CERT_P12_BASE64}"
          : "${MACOS_INSTALLER_CERT_P12_BASE64:?Missing MACOS_INSTALLER_CERT_P12_BASE64}"
          : "${MACOS_NOTARY_KEY_BASE64:?Missing MACOS_NOTARY_KEY_BASE64}"

          keychain_path="${RUNNER_TEMP}/spx-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          app_p12_path="${RUNNER_TEMP}/developer-id-application.p12"
          installer_p12_path="${RUNNER_TEMP}/developer-id-installer.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"

          printf '%s' "${MACOS_APP_CERT_P12_BASE64}" | base64 -D > "${app_p12_path}"
          printf '%s' "${MACOS_INSTALLER_CERT_P12_BASE64}" | base64 -D > "${installer_p12_path}"
          printf '%s' "${MACOS_NOTARY_KEY_BASE64}" | base64 -D > "${notary_key_path}"
          chmod 600 "${app_p12_path}" "${installer_p12_path}" "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          for certificate_path in "${app_p12_path}" "${installer_p12_path}"; do
            security import "${certificate_path}" \
              -f pkcs12 \
              -k "${keychain_path}" \
              -P "${MACOS_CERT_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild
          done

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          app_identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
          if [[ "${app_identity_output}" != *"${MACOS_APP_SIGN_IDENTITY}"* ]]; then
            echo "Developer ID Application identity was not imported." >&2
            exit 1
          fi
          installer_identity_output="$(security find-identity -v -p basic "${keychain_path}")"
          if [[ "${installer_identity_output}" != *"${MACOS_INSTALLER_SIGN_IDENTITY}"* ]]; then
            echo "Developer ID Installer identity was not imported." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "${MACOS_NOTARY_PROFILE}" \
            --key "${notary_key_path}" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER_ID}" \
            --keychain "${keychain_path}"

          {
            echo "MACOS_SIGNING_KEYCHAIN=${keychain_path}"
            echo "MACOS_SIGNING_APP_P12=${app_p12_path}"
            echo "MACOS_SIGNING_INSTALLER_P12=${installer_p12_path}"
            echo "MACOS_SIGNING_NOTARY_KEY=${notary_key_path}"
          } >> "${GITHUB_ENV}"

      - name: Build signed and notarized package
        shell: bash
        env:
          APP_SIGN_IDENTITY: ${{ vars.MACOS_APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          telemetry_environment="staging"
          if [[ "${version}" != *-* ]]; then
            telemetry_environment="production"
          fi
          scripts/build_macos_pkg.sh \
            --version "${version}" \
            --telemetry-environment "${telemetry_environment}" \
            --app-sign "${APP_SIGN_IDENTITY}" \
            --sign "${INSTALLER_SIGN_IDENTITY}" \
            --keychain "${MACOS_SIGNING_KEYCHAIN}" \
            --notarytool-profile "${NOTARY_PROFILE}"
          echo "MACOS_PACKAGE=dist/spx-installer-macos-${version}.pkg" >> "${GITHUB_ENV}"

      - name: Verify package release gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "${MACOS_PACKAGE}"
          shasum -a 256 "${MACOS_PACKAGE}" | tee "${MACOS_PACKAGE}.sha256"
          pkgutil --check-signature "${MACOS_PACKAGE}"
          xcrun stapler validate "${MACOS_PACKAGE}"
          spctl -a -vv -t install "${MACOS_PACKAGE}"

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: spx-installer-macos-${{ github.ref_name }}
          path: |
            ${{ env.MACOS_PACKAGE }}
            ${{ env.MACOS_PACKAGE }}.sha256
          if-no-files-found: error

      - name: Upload package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${MACOS_PACKAGE}" "${MACOS_PACKAGE}.sha256" --clobber

      - name: Clean up macOS signing material
        if: always()
        shell: bash
        run: |
          set +e
          security delete-keychain "${MACOS_SIGNING_KEYCHAIN:-${RUNNER_TEMP}/spx-signing.keychain-db}" \
            >/dev/null 2>&1
          rm -f \
            "${MACOS_SIGNING_APP_P12:-${RUNNER_TEMP}/developer-id-application.p12}" \
            "${MACOS_SIGNING_INSTALLER_P12:-${RUNNER_TEMP}/developer-id-installer.p12}" \
            "${MACOS_SIGNING_NOTARY_KEY:-${RUNNER_TEMP}/AuthKey_${{ vars.MACOS_NOTARY_KEY_ID }}.p8}"
