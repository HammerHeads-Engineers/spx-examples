# SPDX-License-Identifier: MIT
name: macOS installer release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without the leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Prepare temporary signing keychain
        shell: bash
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APP_CERTIFICATE_BASE64:?Missing application certificate}"
          : "${INSTALLER_CERTIFICATE_BASE64:?Missing installer certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          keychain="${RUNNER_TEMP}/spx-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          app_p12="${RUNNER_TEMP}/spx-app.p12"
          installer_p12="${RUNNER_TEMP}/spx-installer.p12"
          printf '%s' "${APP_CERTIFICATE_BASE64}" | base64 -D > "${app_p12}"
          printf '%s' "${INSTALLER_CERTIFICATE_BASE64}" | base64 -D > "${installer_p12}"
          security create-keychain -p "${password}" "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security import "${app_p12}" -f pkcs12 -k "${keychain}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security import "${installer_p12}" -f pkcs12 -k "${keychain}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}"
          security list-keychains -d user -s "${keychain}"
          echo "MACOS_SIGNING_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"

      - name: Build signed and notarized package
        shell: bash
        env:
          APP_SIGN_IDENTITY: ${{ vars.MACOS_APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          scripts/build_macos_pkg.sh \
            --version "${version}" \
            --app-sign "${APP_SIGN_IDENTITY}" \
            --sign "${INSTALLER_SIGN_IDENTITY}" \
            --keychain "${MACOS_SIGNING_KEYCHAIN}" \
            --notarytool-profile "${NOTARY_PROFILE}"
          echo "MACOS_PACKAGE=dist/spx-installer-macos-${version}.pkg" >> "${GITHUB_ENV}"

      - name: Verify package release gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "${MACOS_PACKAGE}"
          shasum -a 256 "${MACOS_PACKAGE}" | tee "${MACOS_PACKAGE}.sha256"
          pkgutil --check-signature "${MACOS_PACKAGE}"
          xcrun stapler validate "${MACOS_PACKAGE}"
          spctl -a -vv -t install "${MACOS_PACKAGE}"

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: spx-installer-macos-${{ github.ref_name }}
          path: |
            ${{ env.MACOS_PACKAGE }}
            ${{ env.MACOS_PACKAGE }}.sha256
          if-no-files-found: error

      - name: Upload package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${MACOS_PACKAGE}" "${MACOS_PACKAGE}.sha256" --clobber

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "${MACOS_SIGNING_KEYCHAIN:-${RUNNER_TEMP}/spx-signing.keychain-db}" >/dev/null 2>&1 || true
